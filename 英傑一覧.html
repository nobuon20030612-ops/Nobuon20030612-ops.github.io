<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英傑一覧</title>
<style>
body{background:#000;color:#ccc;font-family:sans-serif;margin:0;padding:8px 16px 40px;}
.title{text-align:center;font-size:40px;margin:12px 0;color:#ddd;}
.top-buttons{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 0 0;box-sizing:border-box;}
.top-reset,.top-zoom,.top-save,.top-back{padding:10px 20px;font-size:20px;border:2px solid #ff3b3b;color:#ff3b3b;background:rgba(0,0,0,0.6);cursor:pointer;transition:all .2s;}
.top-reset:hover,.top-zoom:hover,.top-save:hover,.top-back:hover{color:#fff;border-color:#ff0000;box-shadow:0 0 8px rgba(255,80,80,.9),0 0 20px rgba(255,0,0,.9),0 0 40px rgba(255,0,0,.8);transform:scale(1.05)}
h3{font-size:22px;margin:12px 0 4px;color:#ddd;}
.priority-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.modeBtns{display:flex;gap:4px;margin-right:8px;}
.modeBtns button{
  font-size:17px;
  padding:10px 14px;
}

.statBtns button{
  font-size:17px;
  padding:10px 14px;
  min-width:auto;
}.statBtns{display:flex;gap:4px;flex-wrap:wrap;}
button{background:#222;color:#aaa;border:1px solid #444;margin:2px;padding:10px 14px;font-size:17px;font-weight:700;cursor:pointer;}
button:hover{transform:scale(1.05);filter:brightness(1.2) drop-shadow(0 0 6px rgba(255,255,200,.9)) drop-shadow(0 0 14px rgba(255,230,120,.9)) drop-shadow(0 0 24px rgba(255,200,80,.8));}
button.active{background:#444;color:#fff;box-shadow:0 0 10px rgba(255,255,200,1),0 0 20px rgba(255,230,120,.9),0 0 40px rgba(255,200,80,.8);transform:scale(1.03)}
.modeBtns button.active{
  background:#7a0000 !important;
  color:#ffffff !important;
  border-color:#ff4a4a !important;
  box-shadow:
    0 0 10px rgba(255,120,120,1),
    0 0 22px rgba(255,0,0,.95),
    0 0 42px rgba(255,0,0,.8) !important;
}
button:active{transform:scale(.95);filter:brightness(1.4) drop-shadow(0 0 10px rgba(255,255,200,1)) drop-shadow(0 0 20px rgba(255,200,80,1));}
.guideBox{
  margin:10px 0 14px;
  padding:10px 14px;
  border:2px solid #ff4a4a;
  background:#160000;
  color:#ffd0d0;
  font-size:16px;
  font-weight:900;
  box-shadow:
    0 0 10px rgba(255,70,70,.65),
    inset 0 0 10px rgba(255,40,40,.25);
}
.guideBox strong{color:#ffffff;}
.statusText{font-size:14px;color:#bbb;margin:8px 0 10px;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th,td{border:1px solid #333;padding:4px;text-align:center;font-size:11px;word-break:break-word;}
th{cursor:pointer;background:#111;color:#ddd;}
tr:hover{background:#222;box-shadow:0 0 6px rgba(255,255,200,.5),0 0 12px rgba(255,230,120,.5);}
.resultRank{width:42px}.numCol{width:46px}.costCol{width:45px}.nameCol{width:120px}.factorCol{width:82px}.weaponCol{width:72px}.skillNameCol{width:120px}.skillCol{width:130px}.statCol{width:55px;}
.totalRow{background:#1e2f1e;font-weight:bold;}
.sorted-col td{background:#2f3b2f!important;}
*{cursor:pointer!important;}


/* ===== 九十九と同仕様：英傑名検索 ===== */
.eiketsu-search-guide{
  margin:12px 0 6px;padding:10px 14px;box-sizing:border-box;text-align:center;
  font-size:22px;line-height:1.35;font-weight:900;color:#ffd8e7;
  border:2px solid #ffb8d1;background:rgba(24,8,16,.82);
  text-shadow:0 0 7px rgba(255,216,231,.98),0 0 16px rgba(255,170,205,.88),0 0 28px rgba(255,135,185,.62);
  box-shadow:0 0 10px rgba(255,184,209,.60),0 0 22px rgba(255,150,195,.34),inset 0 0 12px rgba(255,190,215,.12);
}
.eiketsu-search-row{display:flex;justify-content:center;align-items:center;margin:8px 0 4px;}
.eiketsu-search-input{width:min(430px,100%);box-sizing:border-box;padding:9px 12px;border:2px solid #666;background:rgba(0,0,0,.82);color:#eee;font-size:16px;outline:none;}
.eiketsu-search-input:focus{border-color:#ffb8d1;box-shadow:0 0 8px rgba(255,190,215,.82),0 0 16px rgba(255,150,195,.40),inset 0 0 8px rgba(255,190,215,.10);}
.eiketsu-search-input::placeholder{color:#888;}
.eiketsu-search-results{margin:8px 0 14px;}
.eiketsu-search-results.hidden{display:none;}
.eiketsu-search-results h3{margin:8px 0 4px;}
#eiketsuSearchResultTable{width:100%;border-collapse:collapse;table-layout:fixed;}
#eiketsuSearchResultTable th,#eiketsuSearchResultTable td{border:1px solid #333;padding:4px;text-align:center;font-size:11px;word-break:break-word;}

/* ===== 九十九と同仕様：右下固定ズーム操作 ===== */
.fixed-zoom-controls{position:fixed;right:22px;bottom:22px;z-index:999999;display:flex;align-items:center;gap:12px;}
.fixed-zoom-btn{min-width:112px;margin:0!important;padding:12px 18px!important;border-radius:8px;font-size:18px!important;font-weight:900;line-height:1.1;color:#fff;background:rgba(0,0,0,.86);cursor:pointer;transition:filter .15s ease,box-shadow .15s ease,transform .15s ease;}
.fixed-zoom-btn:hover{transform:scale(1.05)!important;filter:brightness(1.16);}
.fixed-zoom-out{border:2px solid #55bfff!important;color:#bfe9ff!important;box-shadow:0 0 8px rgba(90,195,255,.95),0 0 18px rgba(40,145,255,.85),0 0 34px rgba(0,95,255,.65),inset 0 0 12px rgba(75,175,255,.14)!important;}
.fixed-zoom-out:hover{border-color:#a7e2ff!important;box-shadow:0 0 10px rgba(165,225,255,1),0 0 24px rgba(65,165,255,.95),0 0 42px rgba(0,100,255,.78)!important;}
.fixed-zoom-in{border:2px solid #ff4f5f!important;color:#ffd0d5!important;box-shadow:0 0 8px rgba(255,90,105,.98),0 0 18px rgba(255,35,55,.88),0 0 34px rgba(205,0,25,.68),inset 0 0 12px rgba(255,70,90,.14)!important;}
.fixed-zoom-in:hover{border-color:#ff9da8!important;box-shadow:0 0 10px rgba(255,155,165,1),0 0 24px rgba(255,65,85,.95),0 0 42px rgba(210,0,30,.78)!important;}
@media (max-width:700px){.fixed-zoom-controls{right:10px;bottom:10px;gap:8px}.fixed-zoom-btn{min-width:92px;padding:10px 12px!important;font-size:16px!important;}}

</style>

<style id="season-background-style">
/* 季節背景画像：既存レイアウト・HTML・JSには影響させない */
body {
  background-color:#000 !important;
  background-image:
    linear-gradient(rgba(0,0,0,.56), rgba(0,0,0,.56)),
    url("bg_winter.png") !important;
  background-position:center center !important;
  background-size:cover !important;
  background-repeat:no-repeat !important;
  background-attachment:fixed !important;
}
</style>

</head>
<body>
<div class="top-buttons no-capture">
  <div class="top-reset" onclick="resetEiketsuSelection()">リセット</div>
  <div class="top-save" onclick="downloadScreen()">保存</div>
  <div class="top-back" onclick="location.href='index.html'">戻る</div>
</div>

<div class="fixed-zoom-controls no-capture" aria-label="画面倍率操作">
  <button type="button" class="fixed-zoom-btn fixed-zoom-out" onclick="changeEiketsuZoom(-25)" title="25%縮小（最小100%）">－ 縮小</button>
  <button type="button" class="fixed-zoom-btn fixed-zoom-in" onclick="changeEiketsuZoom(25)" title="25%拡大（最大300%）">拡大 ＋</button>
</div>

<div id="zoomArea" style="zoom:100%;">
<h1 class="title">英傑一覧</h1>

<div class="guideBox">使い方：各優先で先に <strong>ステータス</strong> または <strong>育成技能</strong> を選んでから、右側の <strong>生命〜風</strong> ボタンを選んでください。</div>
<h3>第1優先</h3><div class="priority-row"><div class="modeBtns" id="mode1"></div><div class="statBtns" id="stat1"></div></div>
<h3>第2優先</h3><div class="priority-row"><div class="modeBtns" id="mode2"></div><div class="statBtns" id="stat2"></div></div>
<h3>第3優先</h3><div class="priority-row"><div class="modeBtns" id="mode3"></div><div class="statBtns" id="stat3"></div></div>
<div class="statusText" id="statusText">優先条件を選択すると、一覧全体を並び替えます。</div>


<div class="eiketsu-search-guide">【英傑名】は、名前のどの漢字1文字でも検索できます。</div>
<div class="eiketsu-search-row">
  <input type="search" id="eiketsuNameSearch" class="eiketsu-search-input" placeholder="英傑名を検索（漢字1文字から）" autocomplete="off" aria-label="英傑名検索">
</div>
<div id="eiketsuSearchResults" class="eiketsu-search-results hidden">
  <h3>検索結果（<span id="eiketsuSearchCount">0</span>件）</h3>
  <table id="eiketsuSearchResultTable"></table>
</div>

<h3>一覧</h3>
<table id="table"></table>
</div>

<script>
let baseData=[];
let sortKey="生命";
let sortAsc=false;
let priorities=[{mode:null,stat:null},{mode:null,stat:null},{mode:null,stat:null}];
let eiketsuSearchSortKey="番号";
let eiketsuSearchSortAsc=true;
let eiketsuZoomPercent=100;

const stats=["生命","気合","腕力","耐久","器用","知力","魅力","土","水","火","風"];
const skillCols=["育成技能１","育成技能２","育成技能３"];
const statKeyMap={"生命":"生命","気合":"気合","腕力":"腕力","耐久":"耐久力","器用":"器用さ","知力":"知力","魅力":"魅力","土":"土属性","水":"水属性","火":"火属性","風":"風属性"};
const statSkillWords={"生命":["生命"],"気合":["気合"],"腕力":["腕力"],"耐久":["耐久","耐久力"],"器用":["器用","器用さ"],"知力":["知力"],"魅力":["魅力"],"土":["土","土属性"],"水":["水","水属性"],"火":["火","火属性"],"風":["風","風属性"]};
const statColors={"生命":"#ddd","気合":"#7fbfd6","腕力":"#cc6666","耐久":"#5f7fbf","器用":"#6fbf6f","知力":"#d6d67f","魅力":"#a87fd6","土":"#d19a66","水":"#4f6fa8","火":"#b35f7a","風":"#9ccc65"};
const viewColumns=[
  {key:"番号"},
  {key:"コスト"},
  {key:"名前"},
  {key:"育成技能１"},
  {key:"育成技能２"},
  {key:"育成技能３"},
  {key:"生命",stat:"生命"},
  {key:"気合",stat:"気合"},
  {key:"腕力",stat:"腕力"},
  {key:"耐久力",stat:"耐久"},
  {key:"器用さ",stat:"器用"},
  {key:"知力",stat:"知力"},
  {key:"魅力",stat:"魅力"},
  {key:"土属性",stat:"土"},
  {key:"水属性",stat:"水"},
  {key:"火属性",stat:"火"},
  {key:"風属性",stat:"風"},
  {key:"因子1"},
  {key:"因子2"},
  {key:"因子3"},
  {key:"因子4"}
];

function resolveCsvKey(d,key){
  const fallbackMap = {
    "育成技能１":"育成技能1:(0凸)",
    "育成技能２":"育成技能2:(0凸)",
    "育成技能３":"育成技能3:(0凸)",
    "因子1":"因子1(特化)",
    "因子2":"因子2(2凸)",
    "因子3":"因子3(LV20)",
    "因子4":"因子4(文曲)",
    "耐久力":"耐久",
    "器用さ":"器用",
    "土属性":"土",
    "水属性":"水",
    "火属性":"火",
    "風属性":"風",
    "職業・因子1":"因子1(特化)",
  };

  if(d[key] != null) return key;

  if(fallbackMap[key] && d[fallbackMap[key]] != null){
    return fallbackMap[key];
  }

  const keys = Object.keys(d);
  const found = keys.find(k => k === key || k.startsWith(key));
  if(found) return found;

  return key;
}

function getVal(d,key){
  const realKey=resolveCsvKey(d,key);
  let v=d[realKey];
  if(typeof v==="string")v=v.replace(/[^0-9.-]/g,"");
  v=parseFloat(v);
  return isNaN(v)?0:v;
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"").replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(q){ if(c==='"' && n==='"'){cell+='"';i++;} else if(c==='"'){q=false;} else cell+=c; }
    else{ if(c==='"')q=true; else if(c===','){row.push(cell);cell="";} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=='\r')cell+=c; }
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}
async function loadCSV(){
  const res=await fetch("./英傑一覧.csv");
  if(!res.ok) throw new Error("CSV読み込み失敗: "+res.status);

  const buffer = await res.arrayBuffer();
  let text = "";

  try{
    text = new TextDecoder("utf-8", {fatal:true}).decode(buffer);
  }catch(e){
    text = new TextDecoder("shift_jis").decode(buffer);
  }

  const rows=parseCSV(text);
  const headers=rows[0].map(x=>x.trim());
  baseData=rows.slice(1).filter(r=>r.some(x=>String(x).trim()!=="")).map(r=>{
    const o={}; headers.forEach((h,i)=>o[h]=(r[i]||"").trim()); return o;
  });
}
function makeButtons(){
  for(let i=0;i<3;i++){
    const mode=document.getElementById("mode"+(i+1));
    mode.innerHTML=`<button onclick="setMode(${i},'status')">ステータス</button><button onclick="setMode(${i},'skill')">育成技能</button>`;
    const sbox=document.getElementById("stat"+(i+1));
    sbox.innerHTML=stats.map(s=>`<button style="color:${statColors[s]}" onclick="setStat(${i},'${s}')">${s}</button>`).join("");
  }
}
function updateButtons(){
  for(let i=0;i<3;i++){
    document.querySelectorAll(`#mode${i+1} button`).forEach(b=>{
      b.classList.toggle("active",(b.textContent==="ステータス"&&priorities[i].mode==="status")||(b.textContent==="育成技能"&&priorities[i].mode==="skill"));
    });
    document.querySelectorAll(`#stat${i+1} button`).forEach(b=>b.classList.toggle("active",b.textContent===priorities[i].stat));
  }
}
function setMode(i,mode){priorities[i].mode=mode;updateButtons();render();}
function setStat(i,stat){priorities[i].stat=stat;updateButtons();render();}
function resetEiketsuSelection(){
  priorities=[{mode:null,stat:null},{mode:null,stat:null},{mode:null,stat:null}];
  const searchInput=document.getElementById("eiketsuNameSearch");
  if(searchInput) searchInput.value="";
  updateButtons();
  render();
}

function skillDetail(d,stat){
  let count=0, rate=0, up=0, train=0;
  const words=statSkillWords[stat]||[stat];
  skillCols.forEach(k=>{
    const txt=d[resolveCsvKey(d,k)]||"";
    const hitWord=words.find(w=>txt.includes(w));
    if(hitWord){
      count++;
      if(words.some(w=>txt.includes(w+"上昇率向上"))) rate++;
      if(words.some(w=>txt.includes(w+"上昇") && !txt.includes(w+"上昇率向上"))) up++;
      if(words.some(w=>txt.includes(w+"修練志向") || txt.includes(w+"修練上昇") || txt.includes(w+"修練"))) train++;
    }
  });
  return {count, rate, up, train};
}
function getSkillLv(txt){
  const m=String(txt||"").match(/Lv\.?\s*(\d+)/i);
  return m?parseInt(m[1],10):0;
}
function skillLevelTotal(d,stat){
  const words=statSkillWords[stat]||[stat];
  let total=0;
  skillCols.forEach(k=>{
    const txt=d[resolveCsvKey(d,k)]||"";
    if(words.some(w=>txt.includes(w))){
      total+=getSkillLv(txt);
    }
  });
  return total;
}
function criterionScore(d,p){
  if(!p.mode || !p.stat) return {main:0,rate:0,up:0,train:0,lv:0};
  if(p.mode==="status") return {main:getVal(d,p.stat),rate:0,up:0,train:0,lv:0};
  const s=skillDetail(d,p.stat);
  return {
    main:s.count,
    rate:s.rate,
    up:s.up,
    train:s.train,
    lv:skillLevelTotal(d,p.stat)
  };
}
function compareByPriorities(a,b){
  for(const p of priorities){
    if(!p.mode || !p.stat) continue;
    const A=criterionScore(a,p), B=criterionScore(b,p);
    let diff=B.main-A.main; if(diff) return diff;
    if(p.mode==="skill"){
      diff=B.lv-A.lv; if(diff) return diff;
      diff=B.rate-A.rate; if(diff) return diff;
      diff=B.up-A.up; if(diff) return diff;
      diff=B.train-A.train; if(diff) return diff;
    }
  }
  let diff=getVal(b,"生命")-getVal(a,"生命"); if(diff) return diff;
  return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
}
function activePriorityText(){
  const arr=priorities.map((p,i)=>p.mode&&p.stat?`第${i+1}優先：${p.mode==="status"?"ステータス":"育成技能"} ${p.stat}`:null).filter(Boolean);
  return arr.length?arr.join(" / "):"優先条件を選択すると、一覧全体を並び替えます。";
}
function getArrow(key){if(sortKey!==key)return"";return sortAsc?" ▲":" ▼";}
function setSort(key){if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=false;}renderList();}
function cellValue(d,h){
  const realKey=resolveCsvKey(d,h);
  const v=d[realKey];
  if(v==null) return "";
  const s=String(v).trim();
  if(s==="?" || s==="？" || s==="undefined" || s==="null") return "";
  return s;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
}
function getSkillTextStat(txt){
  const s=String(txt||"");
  for(const stat of stats){
    const words=statSkillWords[stat]||[stat];
    if(words.some(w=>s.includes(w))) return stat;
  }
  return null;
}
function isNumericColumn(key){return Object.values(statKeyMap).includes(key)||key==="番号"||key==="コスト";}
function renderRows(list,withRank=false){
  let html="<tr>";
  if(withRank) html+='<th class="resultRank">順位</th>';
  viewColumns.forEach(c=>{
    const key=c.key;
    const realKey=baseData.length?resolveCsvKey(baseData[0],key):key;
    const h=realKey;
    const cls=(key==="番号"?"numCol":key==="コスト"?"costCol":key==="名前"?"nameCol":key.includes("因子")?"factorCol":key==="武器"?"weaponCol":key==="固有技能名"?"skillNameCol":skillCols.includes(key)?"skillCol":c.stat?"statCol":"");
    html+=`<th class="${cls}" onclick="${withRank?'':`setSort('${key}')`}">${h}${withRank?'':getArrow(key)}</th>`;
  });
  html+="</tr>";
  list.forEach((d,idx)=>{
    html+="<tr>";
    if(withRank) html+=`<td>${idx+1}</td>`;
    viewColumns.forEach(c=>{
      const value=cellValue(d,c.key);
      const skillStat=skillCols.includes(c.key)?getSkillTextStat(value):null;
      const colorStat=c.stat||skillStat;
      const style=colorStat?` style="color:${statColors[colorStat]}"`:"";
      html+=`<td${style}>${escapeHTML(value)}</td>`;
    });
    html+="</tr>";
  });
  return html;
}
function renderResult(){
  statusText.textContent=activePriorityText();
}
function renderList(){
  const hasPriority=priorities.some(p=>p.mode&&p.stat);
  const list=[...baseData].sort((a,b)=>{
    if(hasPriority){
      return compareByPriorities(a,b);
    }
    if(isNumericColumn(sortKey)){
      const diff=getVal(a,sortKey)-getVal(b,sortKey); return sortAsc?diff:-diff;
    }
    const A=cellValue(a,sortKey), B=cellValue(b,sortKey);
    return sortAsc?A.localeCompare(B,'ja'):B.localeCompare(A,'ja');
  });
  table.innerHTML=renderRows(list,false);
}

function getEiketsuSearchArrow(key){
  if(eiketsuSearchSortKey!==key) return "";
  return eiketsuSearchSortAsc ? " ▲" : " ▼";
}
function setEiketsuSearchSort(key){
  if(eiketsuSearchSortKey===key) eiketsuSearchSortAsc=!eiketsuSearchSortAsc;
  else { eiketsuSearchSortKey=key; eiketsuSearchSortAsc=false; }
  renderEiketsuSearchResults();
}
function renderEiketsuSearchRows(list){
  let html="<tr>";
  viewColumns.forEach(c=>{
    const key=c.key;
    const realKey=baseData.length?resolveCsvKey(baseData[0],key):key;
    const cls=(key==="番号"?"numCol":key==="コスト"?"costCol":key==="名前"?"nameCol":key.includes("因子")?"factorCol":key==="武器"?"weaponCol":key==="固有技能名"?"skillNameCol":skillCols.includes(key)?"skillCol":c.stat?"statCol":"");
    html+=`<th class="${cls}" onclick="setEiketsuSearchSort('${key}')">${realKey}${getEiketsuSearchArrow(key)}</th>`;
  });
  html+="</tr>";
  list.forEach(d=>{
    html+="<tr>";
    viewColumns.forEach(c=>{
      const value=cellValue(d,c.key);
      const skillStat=skillCols.includes(c.key)?getSkillTextStat(value):null;
      const colorStat=c.stat||skillStat;
      const style=colorStat?` style="color:${statColors[colorStat]}"`:"";
      html+=`<td${style}>${escapeHTML(value)}</td>`;
    });
    html+="</tr>";
  });
  return html;
}
function renderEiketsuSearchResults(){
  const input=document.getElementById("eiketsuNameSearch");
  const wrap=document.getElementById("eiketsuSearchResults");
  const tableEl=document.getElementById("eiketsuSearchResultTable");
  const countEl=document.getElementById("eiketsuSearchCount");
  if(!input||!wrap||!tableEl||!countEl) return;
  const query=input.value.trim();
  if(!query){ wrap.classList.add("hidden"); tableEl.innerHTML=""; countEl.textContent="0"; return; }
  const matches=baseData.filter(d=>String(cellValue(d,"名前")||"").includes(query));
  matches.sort((a,b)=>{
    const key=eiketsuSearchSortKey;
    if(isNumericColumn(key)){
      const diff=getVal(a,key)-getVal(b,key); return eiketsuSearchSortAsc?diff:-diff;
    }
    const A=cellValue(a,key), B=cellValue(b,key);
    return eiketsuSearchSortAsc?A.localeCompare(B,'ja'):B.localeCompare(A,'ja');
  });
  countEl.textContent=String(matches.length);
  tableEl.innerHTML=renderEiketsuSearchRows(matches);
  wrap.classList.remove("hidden");
}
function render(){renderResult();renderList();renderEiketsuSearchResults();}

makeButtons();updateButtons();
loadCSV().then(()=>{
  const input=document.getElementById("eiketsuNameSearch");
  if(input) input.addEventListener("input",renderEiketsuSearchResults);
  render();
});
</script>
