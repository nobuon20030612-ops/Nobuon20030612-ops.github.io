<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>家臣計算機</title>

<style>

.top-buttons{
  display: flex;
  justify-content: flex-end;
  gap: 10px; /* ←間隔ここ */
  padding: 12px 20px 0 0;
  box-sizing: border-box;
}

.top-zoom,
.top-save,
.top-back{
  padding: 10px 20px;
  font-size: 20px;
  border: 2px solid #ff3b3b;
  color: #ff3b3b;
  background: rgba(0,0,0,0.6);
  cursor: pointer;
  transition: all 0.2s;
}

.top-zoom:hover,
.top-save:hover,
.top-back:hover{
  color: #fff;
  border-color: #ff0000;
  box-shadow:
    0 0 8px rgba(255,80,80,0.9),
    0 0 20px rgba(255,0,0,0.9),
    0 0 40px rgba(255,0,0,0.8);
  transform: scale(1.05);
}
  html, body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:"MS Gothic", sans-serif;
}

body{ background:#000; }

.table{
  display:grid;
  grid-template-columns:80px repeat(11, 49px);
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.06) 0px,
      rgba(255,255,255,0.06) 26px,
      transparent 26px,
      transparent 52px
    );
}

.cell{
  border:1px solid #111;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.label{
  justify-content:flex-end;
  padding-right:6px;
  border:none;
  position:relative;
  background:#000 !important;
}

.shift-row{ position:relative; top:26px; z-index:1; }

.nine-inline{
  position:absolute;
  left:4px;
  font-size:11px;
}

.kashin-tsukumo-inline-btn{
  position:absolute;
  left:4px;
  top:2px;
  height:22px;
  padding:0 5px;
  border:2px solid #ffcc33;
  border-radius:5px;
  background:
    linear-gradient(to bottom,#5a4200 0%,#2d1d00 55%,#140d00 100%);
  color:#fff4b0;
  font-size:11px;
  font-weight:900;
  line-height:18px;
  cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    inset 0 -2px 0 rgba(0,0,0,0.85),
    0 0 8px rgba(255,200,50,0.55);
}

.kashin-tsukumo-inline-btn:hover{
  color:#ffffff;
  border-color:#ffe27a;
  background:
    linear-gradient(to bottom,#7a5a00 0%,#3b2600 55%,#1c1200 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.38),
    inset 0 -2px 0 rgba(0,0,0,0.9),
    0 0 12px rgba(255,240,120,0.95),
    0 0 24px rgba(255,180,40,0.8);
  filter:brightness(1.18);
}

.kashin-tsukumo-inline-btn:active{
  transform:translateY(1px) scale(0.98);
}

.top-h{ background:#e8a0a0; color:#000; }
.top-v{ background:#333; color:#ff4444; }

.sub-h{ background:#ff8800; color:#000; }

.input{
  width:100%;
  height:100%;
  background:transparent;
  color:inherit;
  border:none;
  text-align:center;
}

.head  .cell{ background:#5c7fb8; }
.body  .cell{ background:#3f9b3f; }
.right .cell{ background:#8f7f00; }
.left  .cell{ background:#c03a6b; }

.head .label,
.body .label,
.right .label,
.left .label{
  background:#000 !important;
}

.section{ margin-top:16px; }
.flex{ display:flex; gap:16px; }

/* ★選択中セルを常時発光 */
/* 通常ホバー：全セル */
.cell:hover{
  filter: brightness(1.25);
  box-shadow:
    inset 0 0 8px rgba(255,255,200,0.7),
    0 0 12px rgba(255,230,120,0.7);
}


/* 空セルだけホバーで光る */
.cell:hover:not(.label):not(.filled){
  filter: brightness(1.2);
  box-shadow:
    inset 0 0 8px rgba(255,255,200,0.6),
    0 0 12px rgba(255,230,120,0.6);
}

/* 選択中セルは常時光る */
.cell.active{
  background:#444 !important;
  box-shadow:
    inset 0 0 10px rgba(255,230,120,0.8),
    0 0 10px rgba(255,230,120,0.7);
}

/* 選択中セルにホバーしたらさらに光る */
.cell.active:hover{
  filter: brightness(1.4);
  box-shadow:
    inset 0 0 14px rgba(255,255,200,1),
    0 0 16px rgba(255,230,120,0.9),
    0 0 28px rgba(255,200,80,0.8);
}

/* 入力済みセルは光らない */
.cell.filled{
  box-shadow:none !important;
  filter:none !important;
}  

/* ▼付与ボタン・付与ページ（能力計算機と同じ仕様） */
.fuyoseki-select-btn{
  width:100%;
  height:100%;
  border:2px solid #ff4a4a;
  border-radius:6px;

  cursor:pointer;

    inset 0 2px 0 rgba(255,255,255,0.28),

    box-shadow 0.12s,

    background 0.12s;

.fuyoseki-select-btn:hover{

    inset 0 2px 0 rgba(255,255,255,0.38),
    inset 0 -3px 0 rgba(0,0,0,0.9),
    0 0 16px rgba(255,150,150,0.95),
    0 0 34px rgba(255,40,40,0.8),

}

.fuyoseki-select-btn:active{
  transform:translateY(2px) scale(0.98);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.95),
    0 0 10px rgba(255,40,40,0.6),
    0 1px 0 #160000;
}


.kashin-fuyo-row-label{
  box-sizing:border-box;
  white-space:nowrap;

.fuyoseki-modal{

.fuyoseki-close-btn{

}

.fuyoseki-button-grid{

.fuyoseki-choice-btn{

.fuyoseki-choice-btn.selected{

.fuyoseki-choice-btn:active{

.fuyoseki-choice-btn:focus{

.fuyoseki-decide-btn{

.fuyoseki-count{

.fuyoseki-note{

.fuyoseki-manual-title{

.fuyoseki-manual-cell{

.fuyoseki-manual-label{

/* ▼付与モーダル：クリック入力レイアウト */
.fuyoseki-modal-title{grid-column:1 / -1;margin:4px 0 8px;text-align:center;font-size:34px;font-weight:900;letter-spacing:22px;border:1px solid #555;background:#f5f5f5;color:#000;padding:10px 0;}
.fuyoseki-frame-wrap{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);gap:18px;align-items:start;}
.fuyoseki-frame{border:1px solid #555;background:#050505;min-width:0;}
.fuyoseki-frame-title{text-align:center;font-size:24px;font-weight:900;color:#ffffff;border-bottom:1px solid #555;padding:5px 0;}
.fuyoseki-entry-title{text-align:center;font-size:22px;font-weight:900;color:#ffffff;border-top:1px solid #555;border-bottom:1px solid #555;padding:5px 0;background:#080808;}
.fuyoseki-value-row{display:grid;grid-template-columns:repeat(11, minmax(0, 1fr));}
.fuyoseki-value-btn{min-height:35px;min-width:0;border:1px solid #662222;background:#050505;font-size:13px;font-weight:900;cursor:pointer;padding:1px 0;margin:0;border-radius:0;line-height:1.08;}
.fuyoseki-value-btn:hover,.fuyoseki-value-btn.active{color:#ffffff !important;border-color:#ff9999;background:#220000;box-shadow:inset 0 0 10px rgba(255,160,160,0.75),0 0 12px rgba(255,60,60,0.8);filter:brightness(1.25);transform:none;}
.fuyoseki-value-stat{display:block;font-size:13px;font-weight:900;}
.fuyoseki-value-number{display:block;margin-top:1px;font-size:13px;font-weight:900;color:#ffffff;}
.fuyoseki-digit-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.78);
  z-index:100000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  box-sizing:border-box;
}
.fuyoseki-digit-modal.hidden{display:none;}
.fuyoseki-digit-box{
  --fuyo-active-color:#ffd0d0;
  position:relative;
  width:min(460px, calc(100vw - 32px));
  min-width:0;
  max-height:calc(100vh - 32px);
  overflow:auto;
  box-sizing:border-box;
  padding:54px 18px 16px;
  border:3px solid var(--fuyo-active-color);
  border-radius:10px;
  background:#060606;
  color:#fff;
  box-shadow:
    0 0 16px var(--fuyo-active-color),
    0 0 30px rgba(255,255,255,0.08),
    inset 0 0 18px rgba(255,255,255,0.025);
}
.fuyoseki-digit-top-close{
  position:absolute;
  top:10px;
  right:10px;
  min-width:78px;
  height:34px;
  padding:0 14px;
  border:2px solid #ff4f5f;
  border-radius:6px;
  background:#260006;
  color:#ffd0d5;
  font-size:15px;
  font-weight:900;
  line-height:30px;
  cursor:pointer;
  box-shadow:0 0 8px rgba(255,79,95,.75);
  z-index:2;
}
.fuyoseki-digit-top-close:hover{
  color:#fff;
  border-color:#ff9da8;
  background:#52000d;
  box-shadow:0 0 14px rgba(255,79,95,.95);
  filter:brightness(1.15);
}
.fuyoseki-digit-context{
  text-align:center;
  font-weight:900;
  line-height:1.25;
}
.fuyoseki-digit-frame-name{
  font-size:27px;
  color:#fff;
  margin-bottom:6px;
}
.fuyoseki-digit-row-name{
  font-size:22px;
  color:#ddd;
  margin-bottom:7px;
}
.fuyoseki-digit-stat-name{
  font-size:28px;
  color:var(--fuyo-active-color);
  text-shadow:0 0 10px currentColor;
  margin-bottom:16px;
}
.fuyoseki-digit-step-grid{
  display:grid;
  grid-template-columns:repeat(4, 70px);
  justify-content:center;
  gap:12px;
  margin:4px auto 14px;
}
.fuyoseki-digit-step-col{
  display:grid;
  grid-template-rows:44px 58px 44px;
  gap:6px;
  min-width:0;
}
.fuyoseki-digit-arrow{
  width:100%;
  height:44px;
  padding:0;
  border:2px solid var(--fuyo-active-color);
  border-radius:7px;
  background:#101010;
  color:var(--fuyo-active-color);
  font-size:28px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:inset 0 0 8px rgba(255,255,255,0.035),0 0 8px var(--fuyo-active-color);
}
.fuyoseki-digit-arrow:hover:not(:disabled){
  color:#fff;
  background:#1b1b1b;
  filter:brightness(1.2);
  box-shadow:0 0 14px var(--fuyo-active-color);
}
.fuyoseki-digit-arrow:disabled{
  opacity:.28;
  cursor:default;
  filter:none;
  box-shadow:none;
}
.fuyoseki-digit-input{
  width:100%;
  height:58px;
  box-sizing:border-box;
  padding:0;
  border:2px solid var(--fuyo-active-color);
  border-radius:7px;
  outline:none;
  background:#000;
  color:var(--fuyo-active-color);
  font-size:36px;
  font-weight:900;
  line-height:58px;
  text-align:center;
  text-shadow:0 0 9px currentColor;
  caret-color:var(--fuyo-active-color);
  ime-mode:disabled;
}
.fuyoseki-digit-input:focus{
  color:#fff;
  border-color:#fff;
  box-shadow:0 0 14px var(--fuyo-active-color), inset 0 0 10px rgba(255,255,255,0.08);
}
.fuyoseki-digit-help{
  margin:0 0 10px;
  color:#aaa;
  font-size:12px;
  line-height:1.45;
  text-align:center;
}
.fuyoseki-digit-actions{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:8px;
}
.fuyoseki-clear-btn,
.fuyoseki-digit-close-btn{
  padding:9px 18px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  border-radius:6px;
}
.fuyoseki-clear-btn{
  background:#111;
  color:#ddd;
  border:1px solid #666;
}
.fuyoseki-digit-close-btn{
  background:#111;
  color:var(--fuyo-active-color);
  border:2px solid var(--fuyo-active-color);
  box-shadow:0 0 10px var(--fuyo-active-color);
}
.fuyoseki-clear-btn:hover,
.fuyoseki-digit-close-btn:hover{
  color:#fff;
  filter:brightness(1.2);
}
@media (max-width:520px){
  .fuyoseki-digit-box{padding:52px 10px 12px;}
  .fuyoseki-digit-top-close{top:8px;right:8px;min-width:72px;height:32px;font-size:14px;line-height:28px;}
  .fuyoseki-digit-frame-name{font-size:23px;}
  .fuyoseki-digit-row-name{font-size:19px;}
  .fuyoseki-digit-stat-name{font-size:24px;margin-bottom:12px;}
  .fuyoseki-digit-step-grid{grid-template-columns:repeat(4, minmax(54px, 64px));gap:7px;}
  .fuyoseki-digit-input{font-size:31px;}
  .fuyoseki-digit-arrow{font-size:25px;}
}

<script>
const KASHIN_BASE_DEVICE_PIXEL_RATIO = window.devicePixelRatio || 1;

function setKashinZoom(percent) {
  const currentRatio = window.devicePixelRatio || KASHIN_BASE_DEVICE_PIXEL_RATIO;
  const browserZoomRatio = currentRatio / KASHIN_BASE_DEVICE_PIXEL_RATIO;
  const correctedPercent = percent / (browserZoomRatio || 1);

  const tsukumoModal = document.getElementById("tsukumoModal");
  const tsukumoZoomArea = document.getElementById("tsukumoZoomArea");
  if(tsukumoModal && tsukumoZoomArea && !tsukumoModal.classList.contains("hidden")){
    tsukumoZoomArea.style.zoom = correctedPercent + "%";
    return;
  }

  const fuyosekiModal = document.getElementById("fuyosekiModal");
  const fuyosekiZoomArea = document.getElementById("fuyosekiZoomArea");
  if(fuyosekiModal && fuyosekiZoomArea && !fuyosekiModal.classList.contains("hidden")){
    fuyosekiZoomArea.style.zoom = correctedPercent + "%";
    return;
  }

  const zoomArea = document.getElementById("zoomArea");
  if(zoomArea){
    zoomArea.style.zoom = correctedPercent + "%";
  }
}



// ===== 家臣計算機ページ本体専用ズーム：モーダルには影響させない =====
let currentKashinPageFixedZoom = 75;
function setKashinPageFixedZoom(percent){
  const next=Math.max(25,Math.min(300,Number(percent)||100));
  currentKashinPageFixedZoom=next;
  const zoomArea=document.getElementById("zoomArea");
  if(zoomArea){
    zoomArea.style.zoom=next+"%";
    zoomArea.style.width="100%";
  }
}
function changeKashinPageFixedZoom(delta){
  const step=Number(delta)||0;
  const zoomArea=document.getElementById("zoomArea");
  const actual=zoomArea ? parseFloat(zoomArea.style.zoom) : NaN;
  const current=Number.isFinite(actual) ? actual : currentKashinPageFixedZoom;
  const next=Math.max(25,Math.min(300,current+step));
  if(next===current){
    currentKashinPageFixedZoom=next;
    return;
  }
  setKashinPageFixedZoom(next);
}
document.addEventListener("DOMContentLoaded", function(){
  setKashinPageFixedZoom(75);
});

function fillKashinInputTestValues(){
  if(!confirm("入力可能な全マスに1を入力します。実行していいですか？")) return;

  document.querySelectorAll("input.input").forEach(input => {
    input.value = "1";
    const cell = input.closest(".cell");
    if(cell){
      cell.classList.add("filled");
      cell.classList.remove("active");
    }
  });

  if(typeof calc === "function"){
    calc();
  }
}

function resetKashinInputValues(){
  if(!confirm("入力可能な全マスの数値を削除します。実行していいですか？")) return;

  document.querySelectorAll("input.input").forEach(input => {
    input.value = "";
    const cell = input.closest(".cell");
    if(cell){
      cell.classList.remove("filled");
      cell.classList.remove("active");
    }
  });

  if(typeof calc === "function"){
    calc();
  }
}

function downloadScreen() {
  const width = document.body.scrollWidth;
  const height = document.body.scrollHeight;

  html2canvas(document.body, {
    backgroundColor: "#000000",
    width: width,
    height: height,
    windowWidth: width,
    windowHeight: height,
    scrollX: 0,
    scrollY: 0,
    scale: 2,

    ignoreElements: (el) => el.classList.contains("no-capture")
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "家臣計算.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

<script>
const KASHIN_FUYO_STATS = ["腕力","耐久","器用","知力","魅力","土","水","火","風"];
const KASHIN_ALL_STATS = ["生命","気合","腕力","耐久","器用","知力","魅力","土","水","火","風"];
const KASHIN_FUYO_STORAGE_KEY = "kashin_fuyoseki_state_v2_digit_layout";
const kashinFuyoStatColors = {
  "生命":"#ffb3b3",
  "気合":"#ffcc99",
  "腕力":"#ff8080",
  "耐久":"#99ccff",
  "器用":"#99ff99",
  "知力":"#ffd966",
  "魅力":"#ff99ff",
  "土":"#d9a066",
  "水":"#66ccff",
  "火":"#ff6666",
  "風":"#99ffcc"
};
let fuyosekiTargetSection = "";
let fuyosekiTargetLabel = "";
let fuyosekiManualValues = {};
let fuyosekiActiveTarget = null;
let fuyosekiSavedState = loadFuyoSavedStateAll();
const FUYOKU_PLACE_INDEX = { thousands:0, hundreds:1, tens:2, ones:3 };
const FUYOKU_LAYOUT = [
  {title:"1枠目",rows:[{key:"slot1_fuyo", title:"付与　or　神秘"},{key:"slot1_jingi", title:"神器石1"},{key:"slot1_tenro", title:"天楼武器"},{key:"slot1_other", title:"その他1"}]},
  {title:"2枠目",rows:[{key:"slot2_fuyo", title:"付与　or　神秘"},{key:"slot2_jingi", title:"神器石2"},{key:"slot2_tenro", title:"御法具"},{key:"slot2_other", title:"その他2"}]}
];
function kashinFuyoNum(value){
  const n = Number(String(value || "").replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[－ー]/g, "-").replace(/,/g, "").replace(/[^0-9.\-]/g, "").trim());
  return Number.isFinite(n) ? n : 0;
}
function fuyosekiStatColor(stat){return kashinFuyoStatColors[stat] || "#ffd0d0";}
function loadFuyoSavedStateAll(){try{return JSON.parse(localStorage.getItem(KASHIN_FUYO_STORAGE_KEY) || "{}");}catch(e){return {};}}
function writeFuyoSavedStateAll(){try{localStorage.setItem(KASHIN_FUYO_STORAGE_KEY, JSON.stringify(fuyosekiSavedState));}catch(e){}}
function cloneFuyoPersistState(value){
  if(value == null) return null;
  try{return JSON.parse(JSON.stringify(value));}catch(e){return null;}
}
function saveFuyoCurrentState(){
  if(!fuyosekiTargetSection) return;
  fuyosekiSavedState[fuyosekiTargetSection] = {
    manual:Object.assign({}, fuyosekiManualValues),
    workflowStep:fuyosekiWorkflowStep,
    stage1StatIndex:fuyosekiStage1StatIndex,
    stage2Type:fuyosekiStage2Type,
    stage2AppliedType:fuyosekiStage2AppliedType,
    stage2AppliedSnapshot:cloneFuyoPersistState(fuyosekiStage2AppliedSnapshot),
    stage2RowIndex:fuyosekiStage2RowIndex,
    stage2StatIndex:fuyosekiStage2StatIndex,
    stage3RowIndex:fuyosekiStage3RowIndex,
    stage3StatIndex:fuyosekiStage3StatIndex,
    stage4StatIndex:fuyosekiStage4StatIndex,
    stage3Set:!!fuyosekiStage3Set,
    mysticLimits:Object.assign({lifeKi:0,ability:0},fuyosekiMysticLimits||{}),
    mysticLimitSet:Object.assign({lifeKi:false,ability:false},fuyosekiMysticLimitSet||{}),
    mysticLimitTarget:fuyosekiMysticLimitTarget,
    stage2LimitKey:fuyosekiStage2LimitKey
  };
  writeFuyoSavedStateAll();
}
function makeFuyoValueKey(rowKey, stat){return `${rowKey}_${stat}`;}
function getFuyoValue(rowKey, stat){return kashinFuyoNum(fuyosekiManualValues[makeFuyoValueKey(rowKey, stat)] || "");}
function setFuyoValue(rowKey, stat, value){const key = makeFuyoValueKey(rowKey, stat); const n = kashinFuyoNum(value); if(n){fuyosekiManualValues[key] = String(Math.floor(n));}else{delete fuyosekiManualValues[key];}}
function clearFuyoModalSelectionState(){fuyosekiManualValues = {}; fuyosekiActiveTarget = null;}
function resetFuyoModalSelection(){if(isLeftFuyoMode()){resetLeftFuyoModalSelection();return;}if(isRightFuyoMode()){resetRightFuyoModalSelection();return;}clearFuyoModalSelectionState(); fuyosekiWorkflowStep=1; fuyosekiStage1StatIndex=0; fuyosekiStage2Type=""; fuyosekiStage2AppliedType=""; fuyosekiStage2AppliedSnapshot=null; fuyosekiStage2RowIndex=0; fuyosekiStage2StatIndex=0; fuyosekiStage3RowIndex=0; fuyosekiStage3StatIndex=0; fuyosekiStage4StatIndex=0; fuyosekiStage3Set=false; fuyosekiMysticLimits={lifeKi:0,ability:0}; fuyosekiMysticLimitSet={lifeKi:false,ability:false}; fuyosekiStage2LimitKey=""; saveFuyoCurrentState(); syncFuyoWorkflowTarget(); renderFuyoButtons();}
function kashinInputsHaveAnyValue(inputs){return inputs.some(input => String(input?.value || "").trim() !== "" && kashinFuyoNum(input.value) !== 0);}
function readKashinInputsTotal(inputs){const total = makeKashinFuyoTotal(); KASHIN_ALL_STATS.forEach((stat, i) => {total[stat] = kashinFuyoNum(inputs[i]?.value || "");}); return total;}
function putTotalIntoFuyoRow(rowKey, total){KASHIN_ALL_STATS.forEach(stat => setFuyoValue(rowKey, stat, total[stat] || 0));}
function isKashinFuyoReflected(sectionClass){let inputs = []; inputs = inputs.concat(getKashinFuyoInputs(sectionClass)); ["付与石1","付与石2","神器石1","神器石2"].forEach(label => {inputs = inputs.concat(getKashinFuyoDetailInputs(sectionClass, label));}); return kashinInputsHaveAnyValue(inputs);}
function loadFuyoTargetStateFromTable(sectionClass){
  clearFuyoModalSelectionState();
  const saved = fuyosekiSavedState[sectionClass];
  if(saved && saved.manual){
    const validTypes = ["付与石","双晶石","神秘石"];
    fuyosekiManualValues = Object.assign({}, saved.manual);
    fuyosekiWorkflowStep = [1,2,3,4].includes(Number(saved.workflowStep)) ? Number(saved.workflowStep) : 1;
    fuyosekiStage1StatIndex = Math.max(0,Math.min(KASHIN_ALL_STATS.length-1,Number(saved.stage1StatIndex)||0));
    fuyosekiStage2Type = validTypes.includes(saved.stage2Type) ? saved.stage2Type : "";
    fuyosekiStage2AppliedType = validTypes.includes(saved.stage2AppliedType) ? saved.stage2AppliedType : "";
    fuyosekiStage2AppliedSnapshot = cloneFuyoPersistState(saved.stage2AppliedSnapshot);
    if(fuyosekiStage2AppliedSnapshot && !validTypes.includes(fuyosekiStage2AppliedSnapshot.type)){
      fuyosekiStage2AppliedSnapshot = null;
    }
    if(!fuyosekiStage2AppliedType && fuyosekiStage2AppliedSnapshot){
      fuyosekiStage2AppliedType = fuyosekiStage2AppliedSnapshot.type;
    }
    fuyosekiStage2RowIndex = Math.max(0,Number(saved.stage2RowIndex)||0);
    fuyosekiStage2StatIndex = Math.max(0,Math.min(KASHIN_ALL_STATS.length-1,Number(saved.stage2StatIndex)||0));
    fuyosekiStage3RowIndex = Math.max(0,Math.min(1,Number(saved.stage3RowIndex)||0));
    fuyosekiStage3StatIndex = Math.max(0,Math.min(KASHIN_ALL_STATS.length-1,Number(saved.stage3StatIndex)||0));
    fuyosekiStage4StatIndex = Math.max(0,Math.min(KASHIN_ALL_STATS.length-1,Number(saved.stage4StatIndex)||0));
    fuyosekiStage3Set = !!saved.stage3Set;
    fuyosekiMysticLimits = {
      lifeKi:Math.max(0,Number(saved.mysticLimits?.lifeKi)||0),
      ability:Math.max(0,Number(saved.mysticLimits?.ability)||0)
    };
    fuyosekiMysticLimitSet = {
      lifeKi:!!saved.mysticLimitSet?.lifeKi,
      ability:!!saved.mysticLimitSet?.ability
    };
    fuyosekiMysticLimitTarget = ["lifeKi","ability"].includes(saved.mysticLimitTarget) ? saved.mysticLimitTarget : "lifeKi";
    fuyosekiStage2LimitKey = ["lifeKi","ability"].includes(saved.stage2LimitKey) ? saved.stage2LimitKey : "";
    if(!["付与石","神秘石"].includes(fuyosekiStage2Type)) fuyosekiStage2LimitKey = "";
    return;
  }
  if(!isKashinFuyoReflected(sectionClass)) return;

  const detailMap = [
    {rowKey:"slot1_fuyo", label:"付与石1"},
    {rowKey:"slot2_fuyo", label:"付与石2"},
    {rowKey:"slot1_jingi", label:"神器石1"},
    {rowKey:"slot2_jingi", label:"神器石2"}
  ];

  detailMap.forEach(item => {
    const inputs = getKashinFuyoDetailInputs(sectionClass, item.label);
    if(inputs.length === 11){
      putTotalIntoFuyoRow(item.rowKey, readKashinInputsTotal(inputs));
    }
  });

  const mainInputs = getKashinFuyoInputs(sectionClass);
  if(mainInputs.length === 11){
    const mainTotal = readKashinInputsTotal(mainInputs);
    const detailTotal = makeKashinFuyoTotal();
    detailMap.forEach(item => addKashinFuyoTotals(detailTotal, makeFuyoRowTotal(item.rowKey)));

    KASHIN_ALL_STATS.forEach(stat => {
      const mainValue = mainTotal[stat] || 0;
      const detailValue = detailTotal[stat] || 0;
      const rest = mainValue > detailValue ? mainValue - detailValue : mainValue;
      if(rest > 0){
        setFuyoValue("slot1_other", stat, rest);
      }
    });
  }
}
function updateFuyoSelectedCount(){
  /* 新土台では工程表示を画面内に常時出すため、上部の件数表示は使用しない。 */
}

/* ===== 右手専用付与モーダル：頭・胴・左手の既存経路とは分離 ===== */
const KASHIN_RIGHT_FUYO_STORAGE_KEY = "kashin_right_fuyo_state_v1";
const KASHIN_LEFT_DUAL_FUYO_STORAGE_KEY = "kashin_left_dual_fuyo_state_v1";
function getRightFuyoStorageKey(){return fuyosekiTargetSection === "left" ? KASHIN_LEFT_DUAL_FUYO_STORAGE_KEY : KASHIN_RIGHT_FUYO_STORAGE_KEY;}
const RIGHT_FUYO_YES_STAGE2_ROWS = [
  {key:"right_double_refine",title:"精錬"},
  {key:"right_slot1_fuyo",title:"付与枠1"},
  {key:"right_slot2_fuyo",title:"付与枠2"}
];
const RIGHT_FUYO_JINGI_ROWS = [
  {key:"right_slot1_jingi",title:"神器石1"},
  {key:"right_slot2_jingi",title:"神器石2"}
];
const RIGHT_FUYO_NO_BASE_ROW_KEY = "right_no_base";
let rightFuyoWorkflowStep = 1;
let rightFuyoTenroEnabled = false;
let rightFuyoTenroPoints = {};
let rightFuyoStage1StatIndex = 0;
let rightFuyoManualValues = {};
let rightFuyoYesStage2RowIndex = 0;
let rightFuyoYesStage2StatIndex = 0;
let rightFuyoNoBaseStatIndex = 0;
let rightFuyoNoStage3Type = "";
let rightFuyoNoStage3AppliedType = "";
let rightFuyoNoStage3AppliedSnapshot = null;
let rightFuyoNoStage3RowIndex = 0;
let rightFuyoNoStage3StatIndex = 0;
let rightFuyoNoLimits = {lifeKi:0,ability:0};
let rightFuyoNoLimitSet = {lifeKi:false,ability:false};
let rightFuyoNoLimitKey = "";
let rightFuyoJingiRowIndex = 0;
let rightFuyoJingiStatIndex = 0;
let rightFuyoActiveTarget = null;

function isRightFuyoMode(){return fuyosekiTargetSection === "right";}
function rightFuyoValueKey(rowKey,stat){return `${rowKey}_${stat}`;}
function getRightFuyoValue(rowKey,stat){return kashinFuyoNum(rightFuyoManualValues[rightFuyoValueKey(rowKey,stat)] || "");}
function setRightFuyoValue(rowKey,stat,value){const key=rightFuyoValueKey(rowKey,stat);const n=Math.max(0,Math.floor(kashinFuyoNum(value)));if(n){rightFuyoManualValues[key]=String(n);}else{delete rightFuyoManualValues[key];}}
function getRightTenroPoint(stat){return Math.max(0,Math.floor(Number(rightFuyoTenroPoints[stat])||0));}
function getRightTenroMaxPoint(stat){return (stat === "生命" || stat === "気合") ? 20 : 70;}
function getRightTenroUsedPoints(){return KASHIN_ALL_STATS.reduce((sum,stat)=>sum+getRightTenroPoint(stat),0);}
function getRightTenroRemainPoints(){return Math.max(0,140-getRightTenroUsedPoints());}
function getRightTenroStatValue(stat){const p=getRightTenroPoint(stat);return (stat === "生命" || stat === "気合") ? p*15 : p;}
function setRightTenroPoint(stat,value){
  const current=getRightTenroPoint(stat);
  const otherUsed=Math.max(0,getRightTenroUsedPoints()-current);
  const maxByTotal=Math.max(0,140-otherUsed);
  const maxAllowed=Math.min(getRightTenroMaxPoint(stat),maxByTotal);
  const next=Math.max(0,Math.min(maxAllowed,Math.floor(Number(value)||0)));
  if(next){rightFuyoTenroPoints[stat]=next;}else{delete rightFuyoTenroPoints[stat];}
}
function makeRightFuyoRowTotal(rowKey){const total=makeKashinFuyoTotal();KASHIN_ALL_STATS.forEach(stat=>total[stat]=getRightFuyoValue(rowKey,stat));return total;}
function makeRightTenroTotal(){const total=makeKashinFuyoTotal();if(!rightFuyoTenroEnabled)return total;KASHIN_ALL_STATS.forEach(stat=>total[stat]=getRightTenroStatValue(stat));return total;}
function cloneRightFuyoTotal(source){const total=makeKashinFuyoTotal();KASHIN_ALL_STATS.forEach(stat=>total[stat]=Number(source?.[stat])||0);return total;}
function clearRightFuyoRows(rowKeys){rowKeys.forEach(rowKey=>KASHIN_ALL_STATS.forEach(stat=>delete rightFuyoManualValues[rightFuyoValueKey(rowKey,stat)]));}
function getRightNoLimitForStat(stat,limits){const source=limits||rightFuyoNoLimits;return (stat==="生命"||stat==="気合")?(Number(source.lifeKi)||0):(Number(source.ability)||0);}
function areRightNoLimitsReady(){return !!(rightFuyoNoLimitSet.lifeKi&&rightFuyoNoLimitSet.ability);}
function getRightNoStage3Rows(){
  if(rightFuyoNoStage3Type==="付与石"&&areRightNoLimitsReady())return [
    {key:"right_no_slot1_fuyo",title:"付与枠1"},
    {key:"right_no_slot2_fuyo",title:"付与枠2"}

function areFuyoMysticLimitsReady(){

function getFuyoStage2Rows(){

    {key:"slot1_jingi",title:"神器石1"},

}

function syncFuyoWorkflowTarget(){
  if(fuyosekiWorkflowStep === 1){
    const stat = KASHIN_ALL_STATS[fuyosekiStage1StatIndex] || KASHIN_ALL_STATS[0];
    fuyosekiActiveTarget = {rowKey:FUYOKU_STAGE1_ROW_KEY,stat,title:"装備入魂"};
    return;
  }
  if(fuyosekiWorkflowStep === 2){
    if(["付与石","神秘石"].includes(fuyosekiStage2Type) && ["lifeKi","ability"].includes(fuyosekiStage2LimitKey)){
      fuyosekiActiveTarget = {kind:"mysticLimit",limitKey:fuyosekiStage2LimitKey,stat:getFuyoMysticLimitLabel(fuyosekiStage2LimitKey),title:"付与限界"};
      return;
    }
    const rows = getFuyoStage2Rows();
    if(rows.length){
      const row = rows[Math.max(0,Math.min(rows.length-1,fuyosekiStage2RowIndex))] || rows[0];
      const stat = KASHIN_ALL_STATS[fuyosekiStage2StatIndex] || KASHIN_ALL_STATS[0];
      fuyosekiActiveTarget = {rowKey:row.key,stat,title:row.title};
      return;
    }
  }
  if(fuyosekiWorkflowStep === 3){
    const rows = getFuyoStage3Rows();
    const row = rows[Math.max(0,Math.min(rows.length-1,fuyosekiStage3RowIndex))] || rows[0];
    const stat = KASHIN_ALL_STATS[fuyosekiStage3StatIndex] || KASHIN_ALL_STATS[0];
    fuyosekiActiveTarget = {rowKey:row.key,stat,title:row.title};
    return;
  }
  if(fuyosekiWorkflowStep === 4){
    const stat = KASHIN_ALL_STATS[fuyosekiStage4StatIndex] || KASHIN_ALL_STATS[0];
    fuyosekiActiveTarget = {rowKey:"slot2_tenro",stat,title:"御法具"};
    return;
  }
  fuyosekiActiveTarget = null;
}

function getFuyoActiveDigitArray(){
  syncFuyoWorkflowTarget();
  if(!fuyosekiActiveTarget) return ["0","0","0","0"];
  if(fuyosekiActiveTarget.kind === "mysticLimit"){
    return String(fuyosekiMysticLimits[fuyosekiActiveTarget.limitKey] || 0).padStart(4,"0").slice(-4).split("");
  }
  return String(getFuyoValue(fuyosekiActiveTarget.rowKey, fuyosekiActiveTarget.stat) || 0)
    .padStart(4,"0").slice(-4).split("");
}

function getFuyoTargetDisplayName(){
  return ({head:"頭の装備",body:"胴の装備",right:"右手の武器",left:"左手の武器"})[fuyosekiTargetSection] || "装備";
}
function getFuyoTargetEquipmentType(){
  return (fuyosekiTargetSection === "right" || fuyosekiTargetSection === "left") ? "武器" : "防具";
}
function getFuyoMysticLimitForStat(stat, limits){
  const source = limits || fuyosekiMysticLimits;
  return (stat === "生命" || stat === "気合") ? (source.lifeKi || 0) : (source.ability || 0);
}
function getFuyoMysticEffectiveContribution(sourceSnapshot){
  const total = makeKashinFuyoTotal();
  const rawSource = sourceSnapshot && sourceSnapshot.mystic ? sourceSnapshot.mystic : makeFuyoRowTotal("slot1_fuyo");
  const limits = sourceSnapshot && sourceSnapshot.limits ? sourceSnapshot.limits : fuyosekiMysticLimits;
  KASHIN_ALL_STATS.forEach(stat => {
    const base = getFuyoValue(FUYOKU_STAGE1_ROW_KEY,stat);
    const rawMystic = rawSource[stat] || 0;
    const limit = getFuyoMysticLimitForStat(stat, limits);
    total[stat] = Math.max(0, Math.min(rawMystic, Math.max(0, limit - base)));
  });
  return total;
}
function getFuyoStoneEffectiveDetails(sourceSnapshot){
  const detail1 = makeKashinFuyoTotal();
  const detail2 = makeKashinFuyoTotal();
  const raw1 = sourceSnapshot && sourceSnapshot.detail1 ? sourceSnapshot.detail1 : makeFuyoRowTotal("slot1_fuyo");
  const raw2 = sourceSnapshot && sourceSnapshot.detail2 ? sourceSnapshot.detail2 : makeFuyoRowTotal("slot2_fuyo");
  const limits = sourceSnapshot && sourceSnapshot.limits ? sourceSnapshot.limits : fuyosekiMysticLimits;
  KASHIN_ALL_STATS.forEach(stat => {
    const base = getFuyoValue(FUYOKU_STAGE1_ROW_KEY,stat);
    const limit = getFuyoMysticLimitForStat(stat, limits);
    let remain = Math.max(0, limit - base);
    detail1[stat] = Math.max(0, Math.min(raw1[stat] || 0, remain));
    remain = Math.max(0, remain - detail1[stat]);
    detail2[stat] = Math.max(0, Math.min(raw2[stat] || 0, remain));
  });
  return {detail1,detail2};
}
function cloneFuyoTotal(source){
  const total = makeKashinFuyoTotal();
  KASHIN_ALL_STATS.forEach(stat => total[stat] = source && source[stat] ? Number(source[stat]) || 0 : 0);
  return total;
}
function makeFuyoStage2AppliedSnapshot(type){
  if(type === "付与石"){
    return {
      type,
      detail1:cloneFuyoTotal(makeFuyoRowTotal("slot1_fuyo")),
      detail2:cloneFuyoTotal(makeFuyoRowTotal("slot2_fuyo")),
      limits:{lifeKi:Number(fuyosekiMysticLimits.lifeKi)||0,ability:Number(fuyosekiMysticLimits.ability)||0},
      limitSet:{lifeKi:!!fuyosekiMysticLimitSet.lifeKi,ability:!!fuyosekiMysticLimitSet.ability}
    };
  }
  if(type === "双晶石"){
    return {
      type,
      refine:cloneFuyoTotal(makeFuyoRowTotal("double_refine")),
      detail1:cloneFuyoTotal(makeFuyoRowTotal("slot1_fuyo")),
      detail2:cloneFuyoTotal(makeFuyoRowTotal("slot2_fuyo"))
    };
  }
  if(type === "神秘石"){
    return {
      type,
      mystic:cloneFuyoTotal(makeFuyoRowTotal("slot1_fuyo")),
      limits:{lifeKi:Number(fuyosekiMysticLimits.lifeKi)||0,ability:Number(fuyosekiMysticLimits.ability)||0},
      limitSet:{lifeKi:!!fuyosekiMysticLimitSet.lifeKi,ability:!!fuyosekiMysticLimitSet.ability}
    };
  }
  return null;
}
function restoreFuyoStage2AppliedSnapshotToEditor(){
  fuyosekiStage2LimitKey="";
  const snap = fuyosekiStage2AppliedSnapshot;
  if(!snap || snap.type !== fuyosekiStage2Type) return;
  clearFuyoStage2ValueRows();
  if(snap.type === "付与石"){
    fuyosekiMysticLimits={lifeKi:Number(snap.limits?.lifeKi)||0,ability:Number(snap.limits?.ability)||0};
    fuyosekiMysticLimitSet={lifeKi:!!snap.limitSet?.lifeKi,ability:!!snap.limitSet?.ability};
    KASHIN_ALL_STATS.forEach(stat => {
      setFuyoValue("slot1_fuyo",stat,snap.detail1?.[stat]||0);
      setFuyoValue("slot2_fuyo",stat,snap.detail2?.[stat]||0);
    });
  }else if(snap && snap.type === "双晶石"){
    KASHIN_ALL_STATS.forEach(stat => {
      setFuyoValue("double_refine",stat,snap.refine?.[stat]||0);
      setFuyoValue("slot1_fuyo",stat,snap.detail1?.[stat]||0);
      setFuyoValue("slot2_fuyo",stat,snap.detail2?.[stat]||0);
    });
  }else if(snap && snap.type === "神秘石"){
    fuyosekiMysticLimits={lifeKi:Number(snap.limits?.lifeKi)||0,ability:Number(snap.limits?.ability)||0};
    fuyosekiMysticLimitSet={lifeKi:!!snap.limitSet?.lifeKi,ability:!!snap.limitSet?.ability};
    KASHIN_ALL_STATS.forEach(stat => setFuyoValue("slot1_fuyo",stat,snap.mystic?.[stat]||0));
  }
}
function makeFuyoPreviewTotal(){
  const total = makeFuyoRowTotal(FUYOKU_STAGE1_ROW_KEY);
  const snap = fuyosekiStage2AppliedSnapshot;
  if(snap){
    if(snap.type === "付与石"){
      addKashinFuyoTotals(total, snap.detail1 || makeKashinFuyoTotal());
      addKashinFuyoTotals(total, snap.detail2 || makeKashinFuyoTotal());
      KASHIN_ALL_STATS.forEach(stat => {
        total[stat] = Math.min(total[stat], getFuyoMysticLimitForStat(stat, snap.limits));
      });
    }else if(snap.type === "双晶石"){
      addKashinFuyoTotals(total, snap.refine || makeKashinFuyoTotal());
      addKashinFuyoTotals(total, snap.detail1 || makeKashinFuyoTotal());
      addKashinFuyoTotals(total, snap.detail2 || makeKashinFuyoTotal());
    }else if(snap.type === "神秘石"){
      const mystic = getFuyoMysticEffectiveContribution(snap);
      addKashinFuyoTotals(total,mystic);
      KASHIN_ALL_STATS.forEach(stat => {
        total[stat] = Math.min(total[stat], getFuyoMysticLimitForStat(stat, snap.limits));
      });
    }
  }
  addKashinFuyoTotals(total, makeFuyoRowTotal("slot1_jingi"));
  addKashinFuyoTotals(total, makeFuyoRowTotal("slot2_jingi"));
  addKashinFuyoTotals(total, makeFuyoRowTotal("slot2_tenro"));
  return total;
}

  if(snap.type === "双晶石" || snap.type === "神秘石") return [true,true];

function guardFuyoDigitKeyDown(event){
  if(!event) return;
  if(event.ctrlKey || event.metaKey || event.altKey) return;
  const allowed = ["Backspace","Delete","Tab","ArrowLeft","ArrowRight","Home","End"];
  if(allowed.includes(event.key)) return;
  if(/^[0-9]$/.test(event.key)) return;
  event.preventDefault();
}
function guardFuyoDigitBeforeInput(event){
  if(!event) return;
  if(event.inputType && event.inputType.startsWith("delete")) return;
  if(event.inputType && event.inputType.toLowerCase().includes("composition")){event.preventDefault();return;}
  if(typeof event.data === "string" && event.data !== "" && !/^[0-9]$/.test(event.data)) event.preventDefault();
}
function syncFuyoStage2AppliedSnapshotFromEditor(){
  if(!fuyosekiStage2AppliedType) return;
  if(fuyosekiStage2Type !== fuyosekiStage2AppliedType) return;
  fuyosekiStage2AppliedSnapshot = makeFuyoStage2AppliedSnapshot(fuyosekiStage2AppliedType);
}
function setFuyoDigitValueAtPlace(place,digit){
  syncFuyoWorkflowTarget();
  if(!fuyosekiActiveTarget) return;
  const idx = FUYOKU_PLACE_INDEX[place];
  if(idx == null) return;
  const digits = getFuyoActiveDigitArray();
  digits[idx] = String(Math.max(0,Math.min(9,Number(digit)||0)));
  const nextValue=parseInt(digits.join(""),10)||0;
  if(fuyosekiActiveTarget.kind === "mysticLimit"){
    const key=fuyosekiActiveTarget.limitKey;
    fuyosekiMysticLimits[key]=nextValue;
    fuyosekiMysticLimitSet[key]=true;
    syncFuyoStage2AppliedSnapshotFromEditor();
    return;
  }
  setFuyoValue(fuyosekiActiveTarget.rowKey,fuyosekiActiveTarget.stat,nextValue);
  if(fuyosekiWorkflowStep === 2) syncFuyoStage2AppliedSnapshotFromEditor();
}
function stepFuyoDigit(place,delta){
  syncFuyoWorkflowTarget();
  if(!fuyosekiActiveTarget) return;
  const idx = FUYOKU_PLACE_INDEX[place];
  if(idx == null) return;
  const digits = getFuyoActiveDigitArray();
  const current = Number(digits[idx]) || 0;
  const next = Math.max(0,Math.min(9,current + (Number(delta)||0)));
  if(next===current) return;
  setFuyoDigitValueAtPlace(place,next);
  renderFuyoButtons();
}
function setFuyoDigitInput(input,place){
  syncFuyoWorkflowTarget();
  if(!input || !fuyosekiActiveTarget) return;
  const digitText = String(input.value||"").replace(/[^0-9]/g,"").slice(-1);
  const digit = digitText==="" ? 0 : Number(digitText);
  setFuyoDigitValueAtPlace(place,digit);
  renderFuyoButtons();
  const next = document.getElementById(`fuyoDigitInput-${place}`);
  if(next){next.focus();try{next.select();}catch(e){}}
}
function clearFuyoActiveValue(){
  syncFuyoWorkflowTarget();
  if(!fuyosekiActiveTarget) return;
  if(fuyosekiActiveTarget.kind === "mysticLimit"){
    const key=fuyosekiActiveTarget.limitKey;
    fuyosekiMysticLimits[key]=0;
    fuyosekiMysticLimitSet[key]=true;
    syncFuyoStage2AppliedSnapshotFromEditor();
  }else{
    setFuyoValue(fuyosekiActiveTarget.rowKey,fuyosekiActiveTarget.stat,0);
    if(fuyosekiWorkflowStep === 2) syncFuyoStage2AppliedSnapshotFromEditor();
  }
  renderFuyoButtons();
}

let currentKashinFuyoFixedZoom = 100;
function setKashinFuyoFixedZoom(percent){
  const next=Math.max(25,Math.min(300,Number(percent)||100));
  currentKashinFuyoFixedZoom=next;
  const area=document.getElementById("fuyosekiZoomArea");
  if(area){
    area.style.zoom=next+"%";
    area.style.width="100%";
  }
}
function changeKashinFuyoFixedZoom(delta){
  const step=Number(delta)||0;
  const area=document.getElementById("fuyosekiZoomArea");
  const actual=area ? parseFloat(area.style.zoom) : NaN;
  const current=Number.isFinite(actual) ? actual : currentKashinFuyoFixedZoom;
  const next=Math.max(25,Math.min(300,current+step));
  if(next===current){
    currentKashinFuyoFixedZoom=next;
    return;
  }
  setKashinFuyoFixedZoom(next);
}
function positionKashinFuyoFixedZoomControls(){

  controls.style.right=Math.max(10,Math.round(window.innerWidth-rect.right+edge))+"px";
  controls.style.bottom=Math.max(10,Math.round(window.innerHeight-rect.bottom+edge))+"px";
}

  const snap = fuyosekiStage2AppliedSnapshot;
  if(snap && snap.type === "双晶石"){
    addKashinFuyoTotals(mainOnlyTotal, snap.refine || makeKashinFuyoTotal());
  }

  const mainInputs = getKashinFuyoInputs(fuyosekiTargetSection);
  if(mainInputs.length !== 11){alert("反映先の付与欄が見つかりません"); return;}

  if(snap && (snap.type === "付与石" || snap.type === "神秘石")){
    KASHIN_ALL_STATS.forEach(stat => {
      mainOnlyTotal[stat] = Math.min(mainOnlyTotal[stat] || 0, getFuyoMysticLimitForStat(stat, snap.limits));
    });
  }
  addKashinFuyoTotals(mainOnlyTotal, gohoguTotal);

  const detail1 = makeKashinFuyoTotal();
  const detail2 = makeKashinFuyoTotal();
  if(snap && snap.type === "付与石"){
    const effective = getFuyoStoneEffectiveDetails(snap);
    Object.assign(detail1,effective.detail1);
    Object.assign(detail2,effective.detail2);
  }else if(snap && snap.type === "双晶石"){
    Object.assign(detail1,cloneFuyoTotal(snap.detail1));
    Object.assign(detail2,cloneFuyoTotal(snap.detail2));
  }else if(snap && snap.type === "神秘石"){
    Object.assign(detail1,getFuyoMysticEffectiveContribution(snap));
  }

  setKashinFuyoInputs(mainInputs, mainOnlyTotal);
  setKashinFuyoInputs(getKashinFuyoDetailInputs(fuyosekiTargetSection,"付与石1"),detail1);
  setKashinFuyoInputs(getKashinFuyoDetailInputs(fuyosekiTargetSection,"付与石2"),detail2);
  setKashinFuyoInputs(getKashinFuyoDetailInputs(fuyosekiTargetSection,"神器石1"),makeFuyoRowTotal("slot1_jingi"));
  setKashinFuyoInputs(getKashinFuyoDetailInputs(fuyosekiTargetSection,"神器石2"),makeFuyoRowTotal("slot2_jingi"));

  saveFuyoCurrentState();
  if(typeof calc === "function") calc();
  closeFuyoPicker();
}
</script>



<script>
const KASHIN_TSUKUMO_STATS = ["生命","気合","腕力","耐久","器用","知力","魅力","土","水","火","風"];
const KASHIN_TSUKUMO_STORAGE_KEY = "kashin_tsukumo_state_v3_ability_match";
const kashinTsukumoStatColors = {
  "生命":"#ddd",
  "気合":"#7fbfd6",
  "腕力":"#cc6666",
  "耐久":"#5f7fbf",
  "器用":"#6fbf6f",
  "知力":"#d6d67f",
  "魅力":"#a87fd6",
  "土":"#d19a66",
  "水":"#4f6fa8",
  "火":"#b35f7a",
  "風":"#9ccc65"
};

let tsukumoData = [];
let tsukumoDataLoaded = false;
let tsukumoTargetSection = "";
let tsukumoTargetLabel = "";
let tsukumoSelected = [];
let tsukumoSortKey = "番号";
let tsukumoSortAsc = true;
let tsukumoMainStat = null;
let tsukumoSubStat = null;
let tsukumoThirdStat = null;
let tsukumoReplaceTarget = null;

let tsukumoPrioritySortStats = [null,null];
let tsukumoPrioritySortTarget = 0;

function updateTsukumoSelectedCountUI(){
  const modal = document.getElementById("tsukumoModal");
  if(modal){
    modal.querySelectorAll("[data-tsukumo-selected-count]").forEach(el => {
      el.textContent = tsukumoSelected.length;
    });
  }
  const actions = document.querySelector("#tsukumoModal > .tsukumo-actions");
  if(actions) actions.style.setProperty("display", tsukumoSelected.length === 8 ? "flex" : "none", "important");
  const count = document.getElementById("tsukumoCount");
  if(count) count.textContent = "選択数：" + tsukumoSelected.length + " / 8";
}
function makeTsukumoPrioritySortButtons(){
  const box = document.getElementById("tsukumoPrioritySortButtons");
  if(!box) return;
  const rows = [["生命","気合"],["腕力","耐久","器用","知力","魅力"],["土","水","火","風"]];
  box.innerHTML = rows.map((row,rowIndex) =>
    `<div class="tsukumo-priority-sort-modal-row">${row.map(s => `<button type="button" data-tsukumo-priority-sort-stat="${s}" style="color:${getKashinTsukumoColor(s)}" onclick="selectTsukumoPrioritySortStat('${s}')">${s}</button>`).join("")}${rowIndex===0?`<button type="button" class="tsukumo-priority-sort-clear" onclick="clearTsukumoPrioritySort()">解除</button>`:""}</div>`
  ).join("");
  updateTsukumoPrioritySortUI();
}
function updateTsukumoPrioritySortUI(){
  [0,1].forEach(slot => {
    const trigger = document.getElementById(`tsukumoPrioritySortTrigger${slot+1}`);
    if(!trigger) return;
    const stat = tsukumoPrioritySortStats[slot];
    if(stat){
      trigger.innerHTML = `並び替え${slot===0?"①":"②"}<span class="tsukumo-priority-sort-stat" style="color:${getKashinTsukumoColor(stat)}">${stat}</span>`;
    }else{
      trigger.textContent = `並び替え${slot===0?"①":"②"}`;
    }
  });
  document.querySelectorAll("#tsukumoModal [data-tsukumo-priority-sort-stat]").forEach(btn => {
    const stat = btn.dataset.tsukumoPrioritySortStat;
    const current = tsukumoPrioritySortStats[tsukumoPrioritySortTarget];
    const usedByOther = tsukumoPrioritySortStats.some((s,i) => i!==tsukumoPrioritySortTarget && s===stat);
    btn.classList.toggle("active",stat===current);
    btn.disabled = usedByOther;
  });
}
function openTsukumoPrioritySortModal(slot){
  tsukumoPrioritySortTarget = slot===1 ? 1 : 0;
  const modal = document.getElementById("tsukumoPrioritySortModal");
  if(!modal) return;
  modal.classList.remove("hidden");
  modal.setAttribute("aria-hidden","false");
  updateTsukumoPrioritySortUI();
}
function closeTsukumoPrioritySortModal(){
  const modal = document.getElementById("tsukumoPrioritySortModal");
  if(!modal) return;
  modal.classList.add("hidden");
  modal.setAttribute("aria-hidden","true");
}
function selectTsukumoPrioritySortStat(stat){
  if(tsukumoPrioritySortStats[tsukumoPrioritySortTarget] === stat){
    tsukumoPrioritySortStats[tsukumoPrioritySortTarget] = null;
  }else{
    const other = tsukumoPrioritySortTarget===0 ? 1 : 0;
    if(tsukumoPrioritySortStats[other] === stat) return;
    tsukumoPrioritySortStats[tsukumoPrioritySortTarget] = stat;
  }
  tsukumoSortKey = null;
  updateTsukumoPrioritySortUI();
  closeTsukumoPrioritySortModal();
  renderTsukumoPicker();
}
function clearTsukumoPrioritySort(){
  tsukumoPrioritySortStats[tsukumoPrioritySortTarget] = null;
  updateTsukumoPrioritySortUI();
  closeTsukumoPrioritySortModal();
  renderTsukumoPicker();
}
function clearTsukumoSelected(){
  tsukumoSelected = [];
  tsukumoReplaceTarget = null;
  renderTsukumoPicker();
}
function compareTsukumoPrioritySort(a,b){
  const active = tsukumoPrioritySortStats.filter(Boolean);
  if(active.length === 1){
    const s = active[0];
    const diff = kashinTsukumoNum(b[s]) - kashinTsukumoNum(a[s]);
    if(diff !== 0) return diff;
    return (parseInt(a["番号"],10)||0) - (parseInt(b["番号"],10)||0);
  }
  if(active.length === 2){
    const first = tsukumoPrioritySortStats[0];
    const second = tsukumoPrioritySortStats[1];
    const aFirst = kashinTsukumoNum(a[first]), aSecond = kashinTsukumoNum(a[second]);
    const bFirst = kashinTsukumoNum(b[first]), bSecond = kashinTsukumoNum(b[second]);
    const bucket = (firstOn,secondOn) => firstOn && secondOn ? 0 : firstOn ? 1 : secondOn ? 2 : 3;
    let diff = bucket(aFirst>=10,aSecond>=10) - bucket(bFirst>=10,bSecond>=10);
    if(diff !== 0) return diff;
    diff = (bFirst+bSecond) - (aFirst+aSecond); if(diff !== 0) return diff;
    diff = bFirst-aFirst; if(diff !== 0) return diff;
    diff = bSecond-aSecond; if(diff !== 0) return diff;
    return (parseInt(a["番号"],10)||0) - (parseInt(b["番号"],10)||0);
  }
  return (parseInt(a["番号"],10)||0) - (parseInt(b["番号"],10)||0);
}
function keepTsukumoClickedRowPosition(id,beforeTop){
  if(beforeTop == null) return;
  let row = null;
  document.querySelectorAll("#tsukumoPickerTable tr[data-tsukumo-row-id]").forEach(candidate => {
    if(!row && candidate.dataset.tsukumoRowId === String(id)) row = candidate;
  });
  if(!row) return;
  const delta = row.getBoundingClientRect().top - beforeTop;
  const modal = document.getElementById("tsukumoModal");
  if(modal && Math.abs(delta)>0.5) modal.scrollTop += delta;
}
function setTsukumoModalZoom(percent){
  const area = document.getElementById("tsukumoZoomArea");
  if(area){
    area.style.zoom = percent + "%";
    area.style.width = "100%";
  }
  const modal = document.getElementById("tsukumoModal");
  if(modal){
    modal.querySelectorAll("[data-tsukumo-zoom]").forEach(btn => {
      btn.classList.toggle("zoom-active",Number(btn.dataset.tsukumoZoom)===Number(percent));
    });
  }
}
function downloadTsukumoModalScreen(){
  const modal = document.getElementById("tsukumoModal");
  if(!modal || typeof html2canvas !== "function") return;
  html2canvas(modal,{
    backgroundColor:"#000000",
    scale:2,
    ignoreElements:(el)=>el.classList.contains("no-capture")
  }).then(canvas=>{
    const link=document.createElement("a");
    const title=document.getElementById("tsukumoPageTitle");
    link.download=(title ? title.textContent.trim() : "九十九") + ".png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  });
}
let tsukumoSavedState = loadKashinTsukumoSavedStateAll();

function kashinTsukumoNum(value){
  const n = Number(String(value || "")
    .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    .replace(/[－ー]/g, "-")
    .replace(/,/g, "")
    .replace(/[^0-9.\-]/g, "")
    .trim());
  return Number.isFinite(n) ? n : 0;
}

function getKashinTsukumoName(row){
  return row["九十九の力"] || row["名前"] || "";
}

function getKashinTsukumoColor(stat){
  return kashinTsukumoStatColors[stat] || "#ddd";
}

function getKashinTsukumoArrow(key){
  if(tsukumoSortKey === key){
    return tsukumoSortAsc ? " ▲" : " ▼";
  }
  return " ⇅";
}

function loadKashinTsukumoSavedStateAll(){
  try{
    return JSON.parse(localStorage.getItem(KASHIN_TSUKUMO_STORAGE_KEY) || "{}");
  }catch(e){
    return {};
  }
}

function writeKashinTsukumoSavedStateAll(){
  try{
    localStorage.setItem(KASHIN_TSUKUMO_STORAGE_KEY, JSON.stringify(tsukumoSavedState));
  }catch(e){}
}

function normalizeKashinTsukumoSelected(selected){
  if(!Array.isArray(selected)) return [];
  return selected.map(item => {
    if(item && typeof item === "object") return String(item["番号"] || "");
    return String(item || "");
  }).filter(Boolean);
}

function saveKashinTsukumoCurrentState(){
  if(!tsukumoTargetSection) return;
  tsukumoSavedState[tsukumoTargetSection] = {
    selected: tsukumoSelected.slice(),
    main: tsukumoMainStat,
    sub: tsukumoSubStat,
    third: tsukumoThirdStat
  };
  writeKashinTsukumoSavedStateAll();
}

function loadKashinTsukumoTargetState(sectionClass){
  const saved = tsukumoSavedState[sectionClass] || {};
  tsukumoSelected = normalizeKashinTsukumoSelected(saved.selected);
  tsukumoMainStat = saved.main || null;
  tsukumoSubStat = saved.sub || null;
  tsukumoThirdStat = saved.third || null;
  tsukumoReplaceTarget = null;
}

async function loadKashinTsukumoCSV(){
  const response = await fetch("./九十九.csv");
  if(!response.ok){
    alert("九十九.csvを読み込めませんでした");
    return;
  }

  const text = (await response.text()).replace(/^\uFEFF/, "");
  const rows = text.trim().split(/\r?\n/).map(row => row.split(",").map(col => {
    let value = col.trim();
    if(value.startsWith('"') && value.endsWith('"')){
      value = value.slice(1, -1).replace(/""/g, '"');
    }
    return value;
  }));

  const headers = rows[0] || [];
  tsukumoData = rows.slice(1).map(cols => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = cols[i] || "");
    return obj;
  });
  tsukumoDataLoaded = true;
}

function isKashinTsukumoExcluded(num){
  num = parseInt(num, 10) || 0;
  const excludeA = document.getElementById("tsukumoExcludeA");
  const excludeB = document.getElementById("tsukumoExcludeB");
  const excludeC = document.getElementById("tsukumoExcludeC");
  if(excludeA && excludeA.checked && [1,9,10,30].includes(num)) return true;
  if(excludeB && excludeB.checked && [2,29].includes(num)) return true;
  if(excludeC && excludeC.checked && [17,18,19,149,150,151].includes(num)) return true;
  return false;
}

function updateKashinTsukumoExcludeLabels(){
  ["A","B","C"].forEach(code => {
    const checkbox = document.getElementById(`tsukumoExclude${code}`);
    const label = document.getElementById(`tsukumoExcludeLabel${code}`);
    if(checkbox && label){
      label.classList.toggle("activeLabel", checkbox.checked);
    }
  });
}

function syncKashinTsukumoExcludedSelected(){
  tsukumoSelected = tsukumoSelected.filter(id => !isKashinTsukumoExcluded(id));
  if(tsukumoReplaceTarget != null && isKashinTsukumoExcluded(tsukumoReplaceTarget)){
    tsukumoReplaceTarget = null;
  }
}

function onTsukumoExcludeChange(){
  syncKashinTsukumoExcludedSelected();
  updateKashinTsukumoExcludeLabels();
  showKashinTsukumoTop();
}

function makeTsukumoPriorityBtns(){
  const areas = [
    {id:"tsukumoMainBtns", type:"main", active:tsukumoMainStat},
    {id:"tsukumoSubBtns", type:"sub", active:tsukumoSubStat},
    {id:"tsukumoThirdBtns", type:"third", active:tsukumoThirdStat}
  ];

  areas.forEach(area => {
    const box = document.getElementById(area.id);
    if(!box) return;
    let html = "";
    KASHIN_TSUKUMO_STATS.forEach(stat => {
      const active = area.active === stat ? " active" : "";
      html += `<button class="${active}" style="color:${getKashinTsukumoColor(stat)}" onclick="setTsukumoPriority('${area.type}', '${stat}')">${stat}</button>`;
    });
    box.innerHTML = html;
  });
}

function compareKashinTsukumoPriority(a, b){
  const priority = [tsukumoMainStat, tsukumoSubStat, tsukumoThirdStat, "生命"].filter(Boolean);
  for(const key of priority){
    const diff = kashinTsukumoNum(b[key]) - kashinTsukumoNum(a[key]);
    if(diff !== 0) return diff;
  }
  return (parseInt(a["番号"], 10) || 0) - (parseInt(b["番号"], 10) || 0);
}

function showKashinTsukumoTop(){
  const sorted = [...tsukumoData]
    .filter(row => !isKashinTsukumoExcluded(row["番号"]))
    .sort(compareKashinTsukumoPriority);

  tsukumoSelected = sorted.slice(0, 8).map(row => String(row["番号"] || ""));
  tsukumoReplaceTarget = null;
  renderTsukumoPicker();
}

function setTsukumoPriority(type, stat){
  if(type === "main") tsukumoMainStat = stat;
  if(type === "sub") tsukumoSubStat = stat;
  if(type === "third") tsukumoThirdStat = stat;
  makeTsukumoPriorityBtns();
  showKashinTsukumoTop();
}

function sortTsukumo(key){
  tsukumoPrioritySortStats = [null,null];
  updateTsukumoPrioritySortUI();
  if(tsukumoSortKey === key){
    tsukumoSortAsc = !tsukumoSortAsc;
  }else{
    tsukumoSortKey = key;
    tsukumoSortAsc = false;
  }
  renderTsukumoPicker();
}

function getTsukumoSortedData(){
  const data = [...tsukumoData];
  data.sort((a,b) => {
    if(tsukumoPrioritySortStats.some(Boolean)) return compareTsukumoPrioritySort(a,b);
    if(tsukumoSortKey){
      const diff = kashinTsukumoNum(a[tsukumoSortKey]) - kashinTsukumoNum(b[tsukumoSortKey]);
      return tsukumoSortAsc ? diff : -diff;
    }
    return compareKashinTsukumoPriority(a,b);
  });
  return data;
}

function updateTsukumoCount(){
  const count = document.getElementById("tsukumoCount");
  if(count){
    count.textContent = `選択数：${tsukumoSelected.length} / 8`;
  }
}

function renderTsukumoSelectedTable(){
  const table = document.getElementById("tsukumoSelectedTable");
  if(!table) return;

  let html = "<tr>";
  html += "<th>番号</th><th>九十九の力</th>";
  KASHIN_TSUKUMO_STATS.forEach(stat => {
    html += `<th style="color:${getKashinTsukumoColor(stat)}">${stat}</th>`;
  });
  html += "<th style='width:70px; white-space:nowrap;'>入手</th></tr>";

  const total = {};
  KASHIN_TSUKUMO_STATS.forEach(stat => total[stat] = 0);

  tsukumoSelected.forEach(id => {
    const row = tsukumoData.find(x => String(x["番号"] || "") === String(id));
    if(!row) return;
    const replaceClass = (tsukumoReplaceTarget == id) ? "replaceTarget" : "";
    html += `<tr class="${replaceClass}" onclick="setTsukumoReplace('${id}')">`;
    html += `<td>${row["番号"] || ""}</td>`;
    html += `<td>${getKashinTsukumoName(row)}</td>`;
    KASHIN_TSUKUMO_STATS.forEach(stat => {
      const value = kashinTsukumoNum(row[stat]);
      total[stat] += value;
      html += `<td style="color:${getKashinTsukumoColor(stat)}">${value}</td>`;
    });
    html += `<td style="white-space:nowrap;">${row["入手"] || ""}</td></tr>`;
  });

  html += `<tr class="totalRow"><td colspan="2">合計</td>`;
  KASHIN_TSUKUMO_STATS.forEach(stat => {
    html += `<td style="color:${getKashinTsukumoColor(stat)}">${total[stat]}</td>`;
  });
  html += `<td></td></tr>`;
  table.innerHTML = html;
}

function setTsukumoReplace(id){
  if(isKashinTsukumoExcluded(id)) return;
  tsukumoReplaceTarget = (tsukumoReplaceTarget === id) ? null : id;
  renderTsukumoPicker();
}

function toggleTsukumo(id,rowEl){
  if(isKashinTsukumoExcluded(id)) return;
  const beforeTop = rowEl ? rowEl.getBoundingClientRect().top : null;
  const finish = () => {
    renderTsukumoPicker();
    keepTsukumoClickedRowPosition(id,beforeTop);
  };

  if(tsukumoReplaceTarget != null){
    if(id == tsukumoReplaceTarget){
      tsukumoReplaceTarget = null;
      finish();
      return;
    }
    if(tsukumoSelected.includes(id)) return;
    const idx = tsukumoSelected.indexOf(tsukumoReplaceTarget);
    if(idx !== -1) tsukumoSelected[idx] = id;
    tsukumoReplaceTarget = null;
    finish();
    return;
  }

  const i = tsukumoSelected.indexOf(id);
  if(i >= 0){
    tsukumoSelected.splice(i,1);
  }else{
    if(tsukumoSelected.length >= 8) return;
    tsukumoSelected.push(id);
  }
  finish();
}

function renderTsukumoPicker(){
  makeTsukumoPriorityBtns();
  syncKashinTsukumoExcludedSelected();
  updateTsukumoCount();
  updateTsukumoSelectedCountUI();
  updateKashinTsukumoExcludeLabels();
  renderTsukumoSelectedTable();
  updateTsukumoPrioritySortUI();

  const table = document.getElementById("tsukumoPickerTable");
  if(!table) return;

  const colIndexMap = {"番号":1};
  KASHIN_TSUKUMO_STATS.forEach((s,i) => colIndexMap[s] = i+3);

  let html = "<tr>";
  html += `<th style="width:42px; white-space:nowrap;" onclick="sortTsukumo('番号')">番号${getKashinTsukumoArrow('番号')}</th>`;
  html += `<th>九十九の力</th>`;
  KASHIN_TSUKUMO_STATS.forEach(stat => {
    const active = tsukumoPrioritySortStats.includes(stat);
    const cls = active ? "tsukumo-priority-sort-col" : "";
    const color = getKashinTsukumoColor(stat);
    const style = active ? `color:${color};--tsukumo-priority-col-color:${color}` : `color:${color}`;
    html += `<th class="${cls}" style="${style}" onclick="sortTsukumo('${stat}')">${stat}${getKashinTsukumoArrow(stat)}</th>`;
  });
  html += `<th style="width:70px; white-space:nowrap;">入手</th></tr>`;

  getTsukumoSortedData().forEach(row => {
    const id = String(row["番号"] || "");
    const selectedClass = tsukumoSelected.includes(id) ? "selected" : "";
    const replaceClass = (tsukumoReplaceTarget == id) ? "replaceTarget" : "";
    const excludedClass = isKashinTsukumoExcluded(id) ? "excluded" : "";
    html += `<tr class="${selectedClass} ${replaceClass} ${excludedClass}" data-tsukumo-row-id="${id}" onclick="toggleTsukumo('${id}',this)">`;
    html += `<td>${row["番号"] || ""}</td>`;
    html += `<td>${getKashinTsukumoName(row)}</td>`;
    KASHIN_TSUKUMO_STATS.forEach(stat => {
      const value = kashinTsukumoNum(row[stat]);
      const active = tsukumoPrioritySortStats.includes(stat);
      const cls = active ? "tsukumo-priority-sort-col" : "";
      const color = getKashinTsukumoColor(stat);
      const style = active ? `color:${color};--tsukumo-priority-col-color:${color}` : `color:${color}`;
      html += `<td class="${cls}" style="${style}">${value}</td>`;
    });
    html += `<td style="white-space:nowrap;">${row["入手"] || ""}</td></tr>`;
  });

  table.innerHTML = html;
  if(tsukumoPrioritySortStats.some(Boolean)){
    table.className = "";
  }else if(tsukumoSortKey && colIndexMap[tsukumoSortKey]){
    table.className = "sorted-col-" + colIndexMap[tsukumoSortKey];
  }else{
    table.className = "";
  }
}

function clearKashinTsukumoModalState(){
  tsukumoSelected = [];
  tsukumoMainStat = null;
  tsukumoSubStat = null;
  tsukumoThirdStat = null;
  tsukumoReplaceTarget = null;
}

function isKashinTsukumoReflected(sectionClass){
  let inputs = [];
  for(let i=0; i<8; i++){
    inputs = inputs.concat(getKashinTsukumoRowInputs(sectionClass, i));
  }
  return kashinInputsHaveAnyValue(inputs);
}

function loadKashinTsukumoSelectionFromTable(sectionClass){
  const reconstructed = [];

  for(let i=0; i<8; i++){
    const inputs = getKashinTsukumoRowInputs(sectionClass, i);
    if(inputs.length !== 11 || !kashinInputsHaveAnyValue(inputs)) continue;

    const found = tsukumoData.find(row => {
      return KASHIN_TSUKUMO_STATS.every((stat, index) => {
        return kashinTsukumoNum(row[stat]) === kashinTsukumoNum(inputs[index]?.value || "");
      });
    });

    if(found){

<script id="kashin-shared-number-modal-20260922">
/* 通常数値入力用。九十九8行は対象外。 */
let kashinNumberActiveInput = null;
let kashinNumberDigitCount = 4;
let kashinNumberActiveStat = "";
let kashinNumberActiveTitle = "";
let kashinNumberActiveRowTitle = "";

function getKashinNumberInputInfo(input){
  if(!input || !input.classList || !input.classList.contains("input")) return null;
  const cell = input.closest(".cell");
  const table = input.closest(".table");
  if(!cell || !table) return null;
  const cells = Array.from(table.children).filter(el => el.classList && el.classList.contains("cell"));
  const cellIndex = cells.indexOf(cell);
  if(cellIndex < 0) return null;
  const rowStart = cellIndex - (cellIndex % 12);
  const rowLabelCell = cells[rowStart] || null;

  /* 九十九の入力8行は絶対にこのモーダルへ接続しない */
  if(rowLabelCell && rowLabelCell.classList.contains("kashin-tsukumo-detail-label")) return null;

  const colClass = Array.from(input.classList).find(c => /^col-\d+$/.test(c));
  const statIndex = colClass ? Number(colClass.slice(4)) : -1;
  const stat = (statIndex >= 0 && typeof KASHIN_ALL_STATS !== "undefined") ? KASHIN_ALL_STATS[statIndex] : "";

  const isAbility = table.classList.contains("kashin-ability");
  const sectionMap = {head:"頭",body:"胴",right:"右手",left:"左手"};
  let sectionTitle = isAbility ? "家臣能力" : "数値入力";
  Object.keys(sectionMap).forEach(cls => { if(table.classList.contains(cls)) sectionTitle = sectionMap[cls]; });

  let rowTitle = rowLabelCell ? String(rowLabelCell.textContent || "").trim() : "";
  if(rowTitle){
    rowTitle = rowTitle.replace(new RegExp("^" + sectionTitle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "[：:]?"), "").trim();
  }
  if(!rowTitle && isAbility) rowTitle = "家臣能力";
  if(!rowTitle) rowTitle = "入力";

  return {input,cell,table,stat,isAbility,digits:isAbility?5:4,sectionTitle,rowTitle};
}

function normalizeKashinOneDigit(value){
  return String(value == null ? "" : value)
    .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0)-0xFEE0))
    .replace(/[^0-9]/g, "")
    .slice(-1);
}

function getKashinNumberDigits(){
  const count = kashinNumberDigitCount || 4;
  const raw = kashinNumberActiveInput ? String(kashinNumberActiveInput.value || "").replace(/[^0-9]/g,"") : "";
  return raw.padStart(count,"0").slice(-count).split("").map(x => Number(x)||0);
}

function applyKashinNumberDigits(digits){
  if(!kashinNumberActiveInput) return;
  const value = parseInt(digits.join(""),10) || 0;
  kashinNumberActiveInput.value = value ? String(value) : "";
  const cell = kashinNumberActiveInput.closest(".cell");
  if(cell){
    cell.classList.toggle("filled", value !== 0);
    if(value !== 0) cell.classList.remove("active");
  }
  if(typeof calc === "function") calc();
}

function renderKashinNumberModal(){
  const modal = document.getElementById("kashinNumberModal");
  const box = document.getElementById("kashinNumberBox");
  const context = document.getElementById("kashinNumberContext");
  const controls = document.getElementById("kashinNumberControls");
  if(!modal || !box || !context || !controls || !kashinNumberActiveInput) return;

  const color = (typeof fuyosekiStatColor === "function") ? fuyosekiStatColor(kashinNumberActiveStat) : "#ffd0d0";
  box.style.setProperty("--fuyo-active-color", color);
  const rowLine = kashinNumberActiveRowTitle === kashinNumberActiveTitle ? "" : `<div class="fuyoseki-digit-row-name">${kashinNumberActiveRowTitle}</div>`;
  context.innerHTML = `<div class="fuyoseki-digit-frame-name">${kashinNumberActiveTitle}</div>${rowLine}<div class="fuyoseki-digit-stat-name">${kashinNumberActiveStat}</div>`;

  const digits = getKashinNumberDigits();
  let html = `<div class="fuyoseki-digit-step-grid kashin-number-grid digits-${kashinNumberDigitCount}">`;
  digits.forEach((digit,idx) => {
    html += `<div class="fuyoseki-digit-step-col">`;
    html += `<button type="button" class="fuyoseki-digit-arrow" onclick="stepKashinNumberDigit(${idx},1)" ${digit>=9?"disabled":""} aria-label="${idx+1}桁目を増やす">⇧</button>`;
    html += `<input class="fuyoseki-digit-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en" value="${digit}" data-kashin-number-digit="${idx}" onfocus="this.select()" onkeydown="guardKashinNumberDigitKeyDown(event)" onbeforeinput="guardKashinNumberDigitBeforeInput(event)" oninput="setKashinNumberDigitInput(this,${idx})" aria-label="${idx+1}桁目">`;
    html += `<button type="button" class="fuyoseki-digit-arrow" onclick="stepKashinNumberDigit(${idx},-1)" ${digit<=0?"disabled":""} aria-label="${idx+1}桁目を減らす">⇩</button>`;
    html += `</div>`;
  });
  html += `</div>`;
  html += `<div class="fuyoseki-digit-help">数字部分は直接入力できます。0～9以外の文字とIME変換入力は受け付けません。</div>`;
  html += `<div class="fuyoseki-digit-actions"><button type="button" class="fuyoseki-clear-btn" onclick="clearKashinNumberValue()">このマスを0にする</button><button type="button" class="fuyoseki-digit-close-btn" onclick="closeKashinNumberModal()">反映</button></div>`;
  controls.innerHTML = html;
}

function openKashinNumberModal(input){
  const info = getKashinNumberInputInfo(input);
  if(!info) return false;

  // 共通入力モーダルで別のマスを選んだら、以前の選択表示を必ず解除する。
  document.querySelectorAll(".cell.active").forEach(cell => {
    cell.classList.remove("active");
  });
  const selectedCell = info.input.closest(".cell");
  if(selectedCell) selectedCell.classList.add("active");

  kashinNumberActiveInput = info.input;
  kashinNumberDigitCount = info.digits;
  kashinNumberActiveStat = info.stat;
  kashinNumberActiveTitle = info.sectionTitle;
  kashinNumberActiveRowTitle = info.rowTitle;
  const modal = document.getElementById("kashinNumberModal");
  renderKashinNumberModal();
  if(modal){modal.classList.remove("hidden");modal.setAttribute("aria-hidden","false");}
  return true;
}

function closeKashinNumberModal(){
  const modal = document.getElementById("kashinNumberModal");
  if(modal){modal.classList.add("hidden");modal.setAttribute("aria-hidden","true");}
  kashinNumberActiveInput = null;
}

function stepKashinNumberDigit(index,delta){
  if(!kashinNumberActiveInput) return;
  const digits = getKashinNumberDigits();
  if(index < 0 || index >= digits.length) return;
  digits[index] = Math.max(0,Math.min(9,digits[index] + (delta>0?1:-1)));
  applyKashinNumberDigits(digits);
  renderKashinNumberModal();
}

function setKashinNumberDigitInput(input,index){
  if(!kashinNumberActiveInput) return;
  const digitText = normalizeKashinOneDigit(input.value);
  const digits = getKashinNumberDigits();
  digits[index] = digitText === "" ? 0 : Number(digitText);
  applyKashinNumberDigits(digits);
  renderKashinNumberModal();
  const next = document.querySelector(`#kashinNumberControls [data-kashin-number-digit="${index}"]`);
  if(next){next.focus();try{next.select();}catch(e){}}
}

function guardKashinNumberDigitKeyDown(event){
  if(!event) return;
  if(event.isComposing || event.key === "Process") {event.preventDefault();return;}
  if(event.ctrlKey || event.metaKey || event.altKey) return;
  const allowed=["Backspace","Delete","Tab","ArrowLeft","ArrowRight","Home","End"];
  if(allowed.includes(event.key)) return;
  if(!/^[0-9]$/.test(event.key)) event.preventDefault();
}
function guardKashinNumberDigitBeforeInput(event){
  if(!event) return;
  if(event.isComposing || (event.inputType && event.inputType.includes("Composition"))){event.preventDefault();return;}
  if(typeof event.data === "string" && event.data !== "" && !/^[0-9]$/.test(event.data)) event.preventDefault();
}
function clearKashinNumberValue(){
  if(!kashinNumberActiveInput) return;
  applyKashinNumberDigits(new Array(kashinNumberDigitCount).fill(0));
  renderKashinNumberModal();
  closeKashinNumberModal();
}

function setupKashinSharedNumberInputs(){
  document.querySelectorAll("input.input").forEach(input => {
    const info = getKashinNumberInputInfo(input);
    if(!info){
      input.classList.remove("kashin-number-input-source");
      input.readOnly = false;
      return;
    }
    input.classList.add("kashin-number-input-source");
    input.readOnly = true;
    if(input.dataset.kashinNumberBound === "1") return;
    input.dataset.kashinNumberBound = "1";
    input.addEventListener("click", function(e){
      e.stopPropagation();
      openKashinNumberModal(input);
    });
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        openKashinNumberModal(input);
      }
    });
  });
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", setupKashinSharedNumberInputs, {once:true});
}else{
  setupKashinSharedNumberInputs();
}
</script>

<script>
// 全角→半角変換
function toHalfWidth(str){
  return str
    .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    .replace(/[－ー]/g, "-");
}

function calc(){
  for(let i=0;i<11;i++){
    let sum = 0;

    document.querySelectorAll(".col-"+i).forEach(el=>{
      const val = toHalfWidth(el.value);
      sum += Number(val) || 0;
    });

    document.querySelector(".total-"+i).textContent = sum;

    const max = (i === 0 || i === 1) ? 65535 : 8000;
    const remain = max - sum;
    const remainEl = document.querySelector(".remain-"+i);
    if(remainEl){
      remainEl.textContent = remain;
      remainEl.classList.toggle("remain-positive", remain >= 1);
      remainEl.classList.toggle("remain-zero", remain === 0);
      remainEl.classList.toggle("remain-negative", remain <= -1);
      remainEl.classList.toggle("remain-low", remain >= 1 && remain <= 99);
    }
  }
}

// 入力時に自動変換＋計算
document.addEventListener("input", e=>{
  if(e.target.classList.contains("input")){
    e.target.value = toHalfWidth(e.target.value);

    const cell = e.target.closest(".cell");

    if(e.target.value.trim() !== ""){
      cell.classList.add("filled");
      cell.classList.remove("active");
    }else{
      cell.classList.remove("filled");
    }

    calc();
  }
});

// セルクリック選択
document.querySelectorAll(".cell").forEach(cell=>{
  cell.addEventListener("click", (e)=>{

    if(cell.classList.contains("label")) return;

    const input = cell.querySelector("input");

    if(input && input.value.trim() !== "") return;

    document.querySelectorAll(".cell.active").forEach(c=>{
      c.classList.remove("active");
    });

    cell.classList.add("active");
  });
});

calc();
</script>


<script id="kashin-halfwidth-noime-arrow-navigation-20260628">
(function(){
  function normalizeHalfWidthNumeric(value){
    return String(value || "")
      .replace(/[０-９]/g, function(s){ return String.fromCharCode(s.charCodeAt(0) - 0xFEE0); })
      .replace(/[－ー]/g, "-")
      .replace(/[^0-9\-]/g, "");
  }

  function isKashinNumericInput(input){
    if(!input || input.tagName !== "INPUT") return false;
    if(input.type === "checkbox" || input.type === "radio" || input.type === "button" || input.type === "submit") return false;
    return input.classList.contains("input") ||
      input.classList.contains("fuyoseki-manual-input");
  }

  function applyNoImeAttributes(input){
    if(!isKashinNumericInput(input)) return;
    input.setAttribute("type", "tel");
    input.setAttribute("inputmode", "numeric");
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocorrect", "off");
    input.setAttribute("autocapitalize", "off");
    input.setAttribute("spellcheck", "false");
    input.setAttribute("enterkeyhint", "next");
    input.setAttribute("lang", "en");
    input.style.imeMode = "disabled";
  }

  function normalizeInputValue(input){
    if(!isKashinNumericInput(input)) return;
    const normalized = normalizeHalfWidthNumeric(input.value);
    if(input.value !== normalized){
      const pos = normalized.length;
      input.value = normalized;
      try{ input.setSelectionRange(pos, pos); }catch(e){}
    }
  }

  function setupKashinInputs(){
    document.querySelectorAll("input").forEach(function(input){
      applyNoImeAttributes(input);
      normalizeInputValue(input);
    });
  }

  function getInputInCell(cell){
    return cell ? cell.querySelector("input.input") : null;
  }

  function moveKashinInput(currentInput, direction){
    const currentCell = currentInput.closest(".cell");
    const table = currentInput.closest(".table");
    if(!currentCell || !table) return false;

    const cells = Array.from(table.children).filter(function(el){ return el.classList && el.classList.contains("cell"); });
    const currentIndex = cells.indexOf(currentCell);
    if(currentIndex < 0) return false;

    const columns = 12;
    let step = 0;
    if(direction === "ArrowLeft") step = -1;
    if(direction === "ArrowRight") step = 1;
    if(direction === "ArrowUp") step = -columns;
    if(direction === "ArrowDown") step = columns;
    if(!step) return false;

    let nextIndex = currentIndex + step;
    while(nextIndex >= 0 && nextIndex < cells.length){
      const nextInput = getInputInCell(cells[nextIndex]);
      if(nextInput){
        document.querySelectorAll(".cell.active").forEach(function(cell){ cell.classList.remove("active"); });
        const nextCell = nextInput.closest(".cell");
        if(nextCell && !nextInput.value.trim()) nextCell.classList.add("active");
        nextInput.focus();
        try{ nextInput.select(); }catch(e){}
        return true;
      }
      nextIndex += step;
    }
    return false;
  }

  setupKashinInputs();

  document.addEventListener("focusin", function(e){
    if(isKashinNumericInput(e.target)){
      applyNoImeAttributes(e.target);
      normalizeInputValue(e.target);
    }
  }, true);

  document.addEventListener("beforeinput", function(e){
    if(!isKashinNumericInput(e.target)) return;
    if(e.inputType && e.inputType.indexOf("Composition") !== -1){
      e.preventDefault();
      return;
    }
    if(typeof e.data === "string" && normalizeHalfWidthNumeric(e.data) !== e.data){
      const normalized = normalizeHalfWidthNumeric(e.data);
      if(normalized === ""){
        e.preventDefault();
      }
    }
  }, true);

  document.addEventListener("input", function(e){
    if(isKashinNumericInput(e.target)){
      normalizeInputValue(e.target);
    }
  }, true);

  document.addEventListener("keydown", function(e){
    if(!e.target || !e.target.classList || !e.target.classList.contains("input")) return;
    if(e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(e.key) === -1) return;
    if(moveKashinInput(e.target, e.key)){
      e.preventDefault();
    }
  }, true);

  const observer = new MutationObserver(function(){ setupKashinInputs(); });
  observer.observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
