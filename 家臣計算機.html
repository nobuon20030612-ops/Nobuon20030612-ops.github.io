      controls.innerHTML = '<button type="button" class="fixed-zoom-btn fixed-zoom-out" onclick="changeKashinZoom(-25)" title="25%縮小（最小25%）">－ 縮小</button>' +
        '<button type="button" class="fixed-zoom-btn fixed-zoom-in" onclick="changeKashinZoom(25)" title="25%拡大（最大300%）">拡大 ＋</button>';
      const zoomArea = doc.getElementById("zoomArea");
      if(zoomArea && zoomArea.parentNode) zoomArea.parentNode.insertBefore(controls, zoomArea);
      else if(doc.body) doc.body.appendChild(controls);
    }

    /* 九十九モーダル内は既存standalone実装に依存せず、25%刻み・25〜300%で完全停止させる。 */
    let currentKashinZoom = 150;
    win.setKashinZoom = function(percent){
      const next = Math.max(25, Math.min(300, Number(percent) || 150));
      currentKashinZoom = next;
      const zoomArea = doc.getElementById("zoomArea");
      if(zoomArea){
        zoomArea.style.zoom = next + "%";
        zoomArea.style.width = "100%";
      }
      doc.querySelectorAll(".top-zoom[data-zoom]").forEach(btn => {
        btn.classList.toggle("zoom-active", Number(btn.dataset.zoom) === next);
      });
    };
    win.changeKashinZoom = function(delta){
      const step = Number(delta) || 0;
      const zoomArea = doc.getElementById("zoomArea");
      const actual = zoomArea ? parseFloat(zoomArea.style.zoom) : NaN;
      const current = Number.isFinite(actual) ? actual : currentKashinZoom;
      const next = Math.max(25, Math.min(300, current + step));
      if(next === current){
        currentKashinZoom = next;
        return;
      }
      win.setKashinZoom(next);
    };

    if(typeof win.setKashinZoom === "function") win.setKashinZoom(150);
    positionTsukumoModalZoomControls();
    if(win.requestAnimationFrame){
      win.requestAnimationFrame(() => positionTsukumoModalZoomControls());
    }
  }

  window.addEventListener("resize", positionTsukumoModalZoomControls);
  if(typeof ResizeObserver === "function" && actions){
    tsukumoModalActionResizeObserver = new ResizeObserver(positionTsukumoModalZoomControls);
    tsukumoModalActionResizeObserver.observe(actions);
  }

  function getFrameDoc(){
    try{
      return frame && frame.contentDocument ? frame.contentDocument : null;
    }catch(e){
      return null;
    }
  }

  function getSelectedRows(){
    const doc = getFrameDoc();
    const table = doc && doc.getElementById("selectedTable");
    if(!table) return [];
    return Array.from(table.rows).slice(1).filter(row =>
      !row.classList.contains("totalRow") && row.cells && row.cells.length >= 13
    );
  }

  function syncIntegrationActions(){
    const count = getSelectedRows().length;
    if(countEl) countEl.textContent = "選択数：" + count + " / 8";
    if(actions) actions.style.display = "flex";
  }

  function getReflectedRowValues(sectionClass){
    const rows = [];
    for(let i=0; i<8; i++){
      const inputs = getKashinTsukumoRowInputs(sectionClass, i);
      if(inputs.length !== 11 || !kashinInputsHaveAnyValue(inputs)) continue;
      rows.push(inputs.map(input => Number(String(input.value || "0").replace(/,/g,"").trim()) || 0));
    }
    return rows;
  }

  function restoreSelectionsFromTable(sectionClass, attempt){
    const doc = getFrameDoc();
    if(!doc) return;
    const mainTable = doc.getElementById("table");
    if(!mainTable || mainTable.rows.length <= 1){
      if((attempt || 0) < 60){
        clearTimeout(restoreTimer);
        restoreTimer = setTimeout(() => restoreSelectionsFromTable(sectionClass, (attempt || 0) + 1), 100);
      }
      return;
    }

    if(isKashinTsukumoReflected(sectionClass)){
      const saved = tsukumoSavedState[sectionClass] || {};
      const wantedIds = normalizeKashinTsukumoSelected(saved.selected);
      if(wantedIds.length){
        wantedIds.slice(0,8).forEach(id => {
          const row = Array.from(mainTable.rows).slice(1).find(candidate =>
            candidate.cells && candidate.cells[0] && String(candidate.cells[0].textContent || "").trim() === String(id)
          );
          if(row && !row.classList.contains("selected")) row.click();
        });
        setTimeout(syncIntegrationActions, 0);
        return;
      }
    }

    const wantedRows = getReflectedRowValues(sectionClass);
    if(!wantedRows.length){
      syncIntegrationActions();
      return;
    }

    let restoreJoranIndex = 0;

    wantedRows.forEach(values => {
      const row = Array.from(mainTable.rows).slice(1).find(candidate => {
        if(!candidate.cells || candidate.cells.length < 13) return false;

        const name = candidate.cells[1]
          ? String(candidate.cells[1].textContent || "").replace(/\s+/g,"").trim()
          : "";
        const isJoranII = JORAN_TSUKUMO_II_NAMES.has(name);

        return values.every((value, statIndex) => {
          const raw = candidate.cells[statIndex + 2] ? candidate.cells[statIndex + 2].textContent : "0";
          let expected = Number(String(raw || "0").replace(/,/g,"").trim()) || 0;

          if(isJoranII && statIndex === 0){
            expected = JORAN_TSUKUMO_II_LIFE[restoreJoranIndex] ?? expected;
          }else if(isJoranII && statIndex === 6){
            expected = JORAN_TSUKUMO_II_CHARM[restoreJoranIndex] ?? expected;
          }

          return expected === value;
        });
      });

      if(row){
        const name = row.cells[1]
          ? String(row.cells[1].textContent || "").replace(/\s+/g,"").trim()
          : "";
        if(JORAN_TSUKUMO_II_NAMES.has(name)) restoreJoranIndex++;
        if(!row.classList.contains("selected")) row.click();
      }
    });
    setTimeout(syncIntegrationActions, 0);
  }

  function bindStandaloneFrame(){
    const doc = getFrameDoc();
    if(!doc) return;

    ensureTsukumoModalZoomControls();

    const back = doc.querySelector(".top-back");
    if(back){
      back.onclick = function(ev){
        if(ev){ ev.preventDefault(); ev.stopPropagation(); }
        closeTsukumoPicker();
        return false;
      };
    }

    const table = doc.getElementById("selectedTable");
    if(frameObserver) frameObserver.disconnect();
    if(table){
      frameObserver = new MutationObserver(syncIntegrationActions);
      frameObserver.observe(table, {childList:true, subtree:true});
    }

    doc.addEventListener("click", function(){ setTimeout(syncIntegrationActions, 0); });
    doc.addEventListener("change", function(){ setTimeout(syncIntegrationActions, 0); });
    syncIntegrationActions();

    if(tsukumoTargetSection){
      restoreSelectionsFromTable(tsukumoTargetSection, 0);
    }
  }

  window.openTsukumoPicker = function(sectionClass, label){
    tsukumoTargetSection = sectionClass;
    tsukumoTargetLabel = label;

    const modal = document.getElementById("tsukumoModal");
    if(!modal || !frame) return;

    modal.classList.remove("hidden");
    modal.scrollTop = 0;
    modal.scrollLeft = 0;
    if(actions) actions.style.display = "flex";
    if(countEl) countEl.textContent = "選択数：0 / 8";
    if(applyBtn) applyBtn.textContent = "選択した九十九を表へ反映";

    frame.onload = bindStandaloneFrame;
    frame.src = "九十九.html?modal=" + Date.now();
  };

  window.closeTsukumoPicker = function(){
    const modal = document.getElementById("tsukumoModal");
    if(modal) modal.classList.add("hidden");
    if(frameObserver){ frameObserver.disconnect(); frameObserver = null; }
    clearTimeout(restoreTimer);
    if(frame) frame.removeAttribute("src");
    if(actions) actions.style.display = "none";
    tsukumoTargetSection = "";
    tsukumoTargetLabel = "";
    tsukumoReplaceTarget = null;
  };


  const JORAN_TSUKUMO_II_NAMES = new Set([
    "怪力無双・弐",
    "忠勇義烈・弐",
    "才智覚醒・弐"
  ]);
  const JORAN_TSUKUMO_II_LIFE = [1100,650,425];
  const JORAN_TSUKUMO_II_CHARM = [110,55,27];

  function isJoranTsukumoIISelectedRow(row){
    const name = row && row.cells && row.cells[1]
      ? String(row.cells[1].textContent || "").replace(/\s+/g, "").trim()
      : "";
    return JORAN_TSUKUMO_II_NAMES.has(name);
  }

  window.applyTsukumoSelection = function(){
    if(!tsukumoTargetSection){
      alert("反映先が不明です");
      return;
    }

    const rows = getSelectedRows();
    if(rows.length < 1){
      alert("1個以上選択してください");
      return;
    }

    clearKashinTsukumoRows(tsukumoTargetSection);
    tsukumoSelected = [];

    rows.slice(0,8).forEach((row, rowIndex) => {
      const id = row.cells[0] ? String(row.cells[0].textContent || "").trim() : "";
      if(id) tsukumoSelected.push(id);

      const inputs = getKashinTsukumoRowInputs(tsukumoTargetSection, rowIndex);
      const total = makeKashinFuyoTotal();

      KASHIN_TSUKUMO_STATS.forEach((stat, statIndex) => {
        const raw = row.cells[statIndex + 2] ? row.cells[statIndex + 2].textContent : "0";
        total[stat] = Number(String(raw || "0").replace(/,/g,"").trim()) || 0;
      });

      setKashinFuyoInputs(inputs, total);
    });

    saveKashinTsukumoCurrentState();
    if(typeof calc === "function") calc();
    closeTsukumoPicker();
  };
})();
</script>
