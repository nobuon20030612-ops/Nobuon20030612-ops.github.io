<body>

<!-- 🔥 保存・戻る -->
<div class="top-buttons no-capture">
  <div class="top-zoom" onclick="resetMadouSelection()">リセット</div>
  <div class="top-zoom" data-zoom="100" onclick="setKashinZoom(100)">100%</div>

<div id="zoomArea" style="zoom:150%;">
<h1 class="title">魔導結晶</h1>	

<div id="rawData" style="display:none;">
  <table id="csvTable" cellspacing="0" border="0"></table>
</div>
<div class="priority-box">
  <div class="priority-block">
    <h3>第1優先</h3>
    <div id="mainBtns" class="priority-stat-row"></div>
  </div>
  <div class="priority-block">
    <h3>第2優先</h3>
    <div id="subBtns" class="priority-stat-row"></div>
  </div>
  <div class="priority-block">
    <h3>第3優先</h3>
    <div id="thirdBtns" class="priority-stat-row"></div>
  </div>
</div>

<h3 class="selected-count-heading">選択中（<span class="selected-count-number" data-selected-count>0</span>個）</h3>
<table id="selectedTable"></table>

<div class="list-heading-row">
  <div class="list-title-with-count">
    <h3>一覧</h3>
    <div class="selected-count-inline">選択中 <span class="selected-count-number" data-selected-count>0</span>個</div>
  </div>
  <div class="priority-sort-controls">
    <button type="button" class="priority-sort-trigger selection-clear-trigger" onclick="clearAllSelected()">選択全解除</button>
    <div class="priority-sort-buttons-line">
      <button type="button" id="prioritySortTrigger1" class="priority-sort-trigger" onclick="openPrioritySortModal(0)">並び替え①</button>
      <button type="button" id="prioritySortTrigger2" class="priority-sort-trigger" onclick="openPrioritySortModal(1)">並び替え②</button>
    </div>
  </div>

<table id="table"></table>

<div id="prioritySortModal" class="priority-sort-modal hidden no-capture" aria-hidden="true">
  <div class="priority-sort-panel">
    <div id="prioritySortButtons" class="priority-sort-modal-buttons"></div>
  </div>
</div>

<script>
let baseData=[];
let selected=[];
let replaceTarget=null;

let mainStat=null;
let subStat=null;
let thirdStat=null;
let prioritySortStats=[null,null];
let prioritySortTarget=0;

let sortKey="番号";
let sortAsc=true;

const stats=["生命","気合","腕力","耐久","器用","知力","魅力","土","水","火","風"];

const statColors={
  "生命":"#ddd","気合":"#7fbfd6","腕力":"#cc6666","耐久":"#5f7fbf",
  "器用":"#6fbf6f","知力":"#d6d67f","魅力":"#a87fd6",
  "土":"#d19a66","水":"#4f6fa8","火":"#b35f7a","風":"#9ccc65"
};

function updateSelectedCount(){
  document.querySelectorAll("[data-selected-count]").forEach(el=>{
    el.textContent=selected.length;
  });
}

function clearAllSelected(){
  selected=[];
  replaceTarget=null;
  render();
}


function comparePrioritySort(a,b){
  const active=prioritySortStats.filter(Boolean);

  if(active.length===1){
    const s=active[0];
    const diff=getVal(b,s)-getVal(a,s);
    if(diff!==0)return diff;
    return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
  }

  if(active.length===2){
    const first=prioritySortStats[0];
    const second=prioritySortStats[1];

    const aFirst=getVal(a,first);
    const aSecond=getVal(a,second);
    const bFirst=getVal(b,first);
    const bSecond=getVal(b,second);

    const aFirstOn=aFirst>=10;
    const aSecondOn=aSecond>=10;
    const bFirstOn=bFirst>=10;
    const bSecondOn=bSecond>=10;

    // 優先順位:
    // 1) ①②とも10以上
    // 2) ①のみ10以上
    // 3) ②のみ10以上
    // 4) ①②とも10未満
    const bucket=(firstOn,secondOn)=>{
      if(firstOn && secondOn) return 0;
      if(firstOn) return 1;
      if(secondOn) return 2;
      return 3;
    };

    let diff=bucket(aFirstOn,aSecondOn)-bucket(bFirstOn,bSecondOn);
    if(diff!==0)return diff;

    const sumA=aFirst+aSecond;
    const sumB=bFirst+bSecond;
    diff=sumB-sumA;
    if(diff!==0)return diff;

    diff=bFirst-aFirst;
    if(diff!==0)return diff;

    diff=bSecond-aSecond;
    if(diff!==0)return diff;

    return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
  }

  return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
}

function makePrioritySortButtons(){
  const box=document.getElementById("prioritySortButtons");
  if(!box)return;

  const rows=[
    ["生命","気合"],
    ["腕力","耐久","器用","知力","魅力"],
    ["土","水","火","風"]
  ];

  box.innerHTML=rows.map((row,rowIndex)=>
    `<div class="priority-sort-modal-row">${
      row.map(s=>`<button type="button" data-priority-sort-stat="${s}" style="color:${statColors[s]}" onclick="selectPrioritySortStat('${s}')">${s}</button>`).join("")
    }${rowIndex===0?`<button type="button" class="priority-sort-clear" onclick="clearPrioritySort()">解除</button>`:""}</div>`
  ).join("");

  updatePrioritySortUI();
}

function updatePrioritySortUI(){
  [0,1].forEach(slot=>{
    const trigger=document.getElementById(`prioritySortTrigger${slot+1}`);
    if(!trigger)return;

    const stat=prioritySortStats[slot];
    if(stat){
      trigger.innerHTML=`並び替え${slot===0?"①":"②"}<span class="priority-sort-stat" style="color:${statColors[stat]}">${stat}</span>`;
    }else{
      trigger.textContent=`並び替え${slot===0?"①":"②"}`;
    }
  });

  document.querySelectorAll("[data-priority-sort-stat]").forEach(btn=>{
    const stat=btn.dataset.prioritySortStat;
    const current=prioritySortStats[prioritySortTarget];
    const usedByOther=prioritySortStats.some((s,i)=>i!==prioritySortTarget && s===stat);

    btn.classList.toggle("active",stat===current);
    btn.disabled=usedByOther;
  });
}

function selectPrioritySortStat(stat){
  if(prioritySortStats[prioritySortTarget]===stat){
    prioritySortStats[prioritySortTarget]=null;
  }else{
    const otherSlot=prioritySortTarget===0?1:0;
    if(prioritySortStats[otherSlot]===stat)return;
    prioritySortStats[prioritySortTarget]=stat;
  }

  updatePrioritySortUI();
  closePrioritySortModal();
  render();
}

function openPrioritySortModal(slot){
  prioritySortTarget=slot===1?1:0;
  const modal=document.getElementById("prioritySortModal");
  if(!modal)return;
  modal.classList.remove("hidden");
  modal.setAttribute("aria-hidden","false");
  updatePrioritySortUI();
}

function closePrioritySortModal(){
  const modal=document.getElementById("prioritySortModal");
  if(!modal)return;
  modal.classList.add("hidden");
  modal.setAttribute("aria-hidden","true");
}

function clearPrioritySort(){
  prioritySortStats[prioritySortTarget]=null;
  updatePrioritySortUI();
  closePrioritySortModal();
  render();
}


function getArrow(key){
  if(sortKey!==key) return "";
  return sortAsc ? " ▲" : " ▼";
}
async function loadCSV() {
  const response = await fetch("./魔導結晶.csv");

  if (!response.ok) {
    throw new Error("CSV読み込み失敗: " + response.status);
  }

  const text = (await response.text()).replace(/^\uFEFF/, "");

  const rows = text.trim().split(/\r?\n/);

  const csvTable = document.getElementById("csvTable");
  csvTable.innerHTML = "";

  rows.forEach(row => {
    const cols = row.split(",");

    let tr = document.createElement("tr");

    cols.forEach(col => {
      let value = col.trim();

      if(value.startsWith('"') && value.endsWith('"')){
        value = value.slice(1, -1).replace(/""/g, '"');
      }

      let td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    csvTable.appendChild(tr);
  });
}
function loadFromHTML(){
  const rows=document.querySelectorAll("#rawData table tr");
  if(!rows.length)return;

  const headers=[];
  rows[0].querySelectorAll("td").forEach(td=>{
    headers.push(td.innerText.trim());
  });

  for(let i=1;i<rows.length;i++){
    const tds=rows[i].querySelectorAll("td");
    if(!tds.length)continue;

    let obj={};
    headers.forEach((h,idx)=>{
      obj[h]=tds[idx]?.innerText.trim()||"";
    });

    baseData.push(obj);
  }
}

function getVal(d,key){
  let v=d[key];
  if(typeof v==="string")v=v.replace(/[^0-9.-]/g,"");
  v=parseFloat(v);
  return isNaN(v)?0:v;
}

function resetMadouSelection(){
  selected = [];
  mainStat = null;
  subStat = null;
  thirdStat = null;
  replaceTarget = null;
  prioritySortStats = [null,null];
  updateBtnState();
  render();
}

function makeBtns(){
  stats.forEach(s=>{
    mainBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setMain('${s}')">${s}</button>`;
    subBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setSub('${s}')">${s}</button>`;
    thirdBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setThird('${s}')">${s}</button>`;
  });
}

function updateBtnState(){
  document.querySelectorAll("#mainBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===mainStat);
  });
  document.querySelectorAll("#subBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===subStat);
  });
  document.querySelectorAll("#thirdBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===thirdStat);
  });
}

function setMain(s){mainStat=s;updateBtnState();showTop();}
function setSub(s){subStat=s;updateBtnState();showTop();}
function setThird(s){thirdStat=s;updateBtnState();showTop();}

function compare(a,b){
  const priority=[mainStat,subStat,thirdStat,"生命"].filter(Boolean);
  for(let key of priority){
    let diff=getVal(b,key)-getVal(a,key);
    if(diff!==0)return diff;
  }
  return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
}

function showTop(){
  const sorted=[...baseData].sort(compare);
  selected=sorted.slice(0,8).map(d=>d["番号"]);
  replaceTarget=null;
  render();
}

function setSort(key){
  prioritySortStats=[null,null];
  updatePrioritySortUI();
  if(sortKey===key){
    sortAsc=!sortAsc;
  }else{
    sortKey=key;
    sortAsc=false;
  }
  render();
}

function setReplace(id){
  replaceTarget = (replaceTarget===id)?null:id;
  render();
}

function keepClickedRowPosition(id,beforeTop){
  if(beforeTop==null)return;

  const rows=document.querySelectorAll("#table tr[data-row-id]");
  let currentRow=null;

  for(const row of rows){
    if(row.dataset.rowId==String(id)){
      currentRow=row;
      break;
    }
  }

  if(!currentRow)return;

  const afterTop=currentRow.getBoundingClientRect().top;
  const delta=afterTop-beforeTop;

  if(Math.abs(delta)>0.5){
    window.scrollBy(0,delta);
  }
}

function toggle(id,rowEl){
  const beforeTop=rowEl ? rowEl.getBoundingClientRect().top : null;

  const finish=()=>{
    render();
    keepClickedRowPosition(id,beforeTop);
  };

  if(replaceTarget!=null){
    if(id==replaceTarget){
      replaceTarget=null;
      finish();
      return;
    }

    if(selected.includes(id)) return;

    const idx=selected.indexOf(replaceTarget);

    if(idx!=-1){
      selected[idx]=id;
    }

    replaceTarget=null;
    finish();
    return;
  }

  const i=selected.indexOf(id);

  if(i>=0){
    selected.splice(i,1);
  }else{
    if(selected.length>=8)return;
    selected.push(id);
  }

  finish();
}

function calcTotals(){
  let t={};
  stats.forEach(s=>t[s]=0);

  selected.forEach(id=>{
    const d=baseData.find(x=>x["番号"]==id);
    if(!d)return;
    stats.forEach(s=>t[s]+=getVal(d,s));
  });

  return t;
}

function render(){
  let list=[...baseData];

  list.sort((a,b)=>{
    if(prioritySortStats.some(Boolean)){
      return comparePrioritySort(a,b);
    }
    if(sortKey){
      let diff=getVal(a,sortKey)-getVal(b,sortKey);
      return sortAsc ? diff : -diff;
    }
    return compare(a,b);
  });

  const colIndexMap = {"番号":1,"魔導の力":2};
  stats.forEach((s,i)=>{ colIndexMap[s]=i+3; });
  colIndexMap["入手"]=14;

  let html="<tr>";
  html+=`<th style="width:42px; white-space:nowrap;" onclick="setSort('番号')">番号${getArrow('番号')}</th>`;
  html+=`<th>魔導の力</th>`;
  stats.forEach(s=>{
    const activePriorityCol=prioritySortStats.includes(s);
    const cls=activePriorityCol?"priority-sort-col":"";
    const style=activePriorityCol?` style="--priority-col-color:${statColors[s]};color:${statColors[s]}"`:"";
    html+=`<th class="${cls}"${style} onclick="setSort('${s}')">${s}${getArrow(s)}</th>`;
  });
  html+=`<th style="width:70px; white-space:nowrap;">入手</th>`;
  html+="</tr>";

  list.forEach(d=>{
    const sel=selected.includes(d["番号"])?"selected":"";
    const rep=(replaceTarget==d["番号"])?"replaceTarget":"";

    html+=`<tr class="${sel} ${rep}" data-row-id="${d["番号"]}" onclick="toggle('${d["番号"]}', this)">`;

    html+=`<td style="width:42px; white-space:nowrap;">${d["番号"]}</td><td>${d["魔導の力"]||""}</td>`;

    stats.forEach(s=>{
      const activePriorityCol=prioritySortStats.includes(s);
      const cls=activePriorityCol?"priority-sort-col":"";
      const style=activePriorityCol
        ?`color:${statColors[s]};--priority-col-color:${statColors[s]}`
        :`color:${statColors[s]}`;
      html+=`<td class="${cls}" style="${style}">${getVal(d,s)}</td>`;
    });

    html+=`<td style="white-space:nowrap;">${d["入手"]||""}</td>`;

    html+="</tr>";
  });

  table.innerHTML=html;

  if(prioritySortStats.some(Boolean)){
    table.className="";
  }else if(sortKey){
    table.className="sorted-col-"+colIndexMap[sortKey];
  }else{
    table.className="";
  }

  let html2="<tr><th style='width:42px; white-space:nowrap;'>番号</th><th>魔導の力</th>";

  stats.forEach(s=>html2+=`<th>${s}</th>`);

  html2+=`<th style='width:70px; white-space:nowrap;'>入手</th>`;

  html2+="</tr>";

  selected.forEach(id=>{
    const d=baseData.find(x=>x["番号"]==id);
    if(!d)return;

    const rep=(replaceTarget==id)?"replaceTarget":"";

    html2+=`<tr class="${rep}" onclick="setReplace('${id}')">`;

    html2+=`<td style="width:42px; white-space:nowrap;">${d["番号"]}</td><td>${d["魔導の力"]||""}</td>`;

    stats.forEach(s=>{
      html2+=`<td style="color:${statColors[s]}">${getVal(d,s)}</td>`;
    });

    html2+=`<td style="white-space:nowrap;">${d["入手"]||""}</td>`;

    html2+="</tr>";
  });

  const t=calcTotals();

  html2+=`<tr class="totalRow"><td colspan="2">合計</td>`;

  stats.forEach(s=>{
    html2+=`<td style="color:${statColors[s]}">${t[s]}</td>`;
  });

  html2+=`<td></td>`;
  html2+="</tr>";

  selectedTable.innerHTML=html2;
  updateSelectedCount();
  updatePrioritySortUI();
}
makeBtns();
updateBtnState();
makePrioritySortButtons();
updateSelectedCount();
updatePrioritySortUI();

loadCSV().then(() => {
  loadFromHTML();
  render();
});</script>
