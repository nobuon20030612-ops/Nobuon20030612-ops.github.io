<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>九十九ツール 組み合わせ一覧と最適構成 | 信長の野望オンライン攻略</title>

<meta name="description" content="信長の野望オンラインの九十九ツール。九十九の組み合わせ一覧、能力比較、最適構成の確認ができます。">


<style>
body{
  background:#000;
  color:#ccc;
  font-family:sans-serif;
}

.title{
  text-align:center;
  font-size:40px;
  margin:12px 0;
  color:#ddd;
}

.top-buttons{
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 12px 20px 0 0;
  box-sizing: border-box;
}

.top-zoom,
.top-save,
.top-back{
  padding: 10px 20px;
  font-size: 20px;
  border: 2px solid #ff3b3b;
  color: #ff3b3b;
  background: rgba(0,0,0,0.6);
  cursor: pointer;
  transition: all 0.2s;
}

.top-zoom:hover,
.top-save:hover,
.top-back:hover{
  color: #fff;
  border-color: #ff0000;
  box-shadow:
    0 0 8px rgba(255,80,80,0.9),
    0 0 20px rgba(255,0,0,0.9),
    0 0 40px rgba(255,0,0,0.8);
  transform: scale(1.05);
}

h3{
  font-size:24px;
  margin-top:16px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #333;
  padding:4px;
  text-align:center;
  font-size:11px;
}

th{
  cursor:pointer;
}

tr:hover{
  background:#222;
  box-shadow:
    0 0 6px rgba(255,255,200,0.5),
    0 0 12px rgba(255,230,120,0.5);
}

.selected{
  background:#2a2a2a;
}

tr.selected{
  background:#302000 !important;
  box-shadow:
    inset 0 0 10px rgba(255,230,120,0.8),
    0 0 10px rgba(255,230,120,0.7);
}

tr.selected:hover{
  background:#4a3300 !important;
  box-shadow:
    inset 0 0 14px rgba(255,255,200,1),
    0 0 16px rgba(255,230,120,0.9),
    0 0 28px rgba(255,200,80,0.8);
}

label.activeLabel{
  color:#fff;
  border-color:#ffd966;
  background:#3a2a00;
  box-shadow:
    0 0 8px rgba(255,255,180,0.95),
    0 0 18px rgba(255,220,80,0.9);
}

tr.excluded{
  opacity:0.25;
  text-decoration:line-through;
}

.replaceTarget{
  outline:3px solid #fff;
  background:#444 !important;
}

button{
  background:#222;
  color:#aaa;
  border:1px solid #444;
  margin:2px;
  padding:12px 20px;
  font-size:18px;
  cursor:pointer;
}
button:hover{
  transform: scale(1.05);
  filter:
    brightness(1.2)
    drop-shadow(0 0 6px rgba(255,255,200,0.9))
    drop-shadow(0 0 14px rgba(255,230,120,0.9))
    drop-shadow(0 0 24px rgba(255,200,80,0.8));
}

button.active{
  background:#444;
  color:#fff;
  box-shadow:
    0 0 10px rgba(255,255,200,1),
    0 0 20px rgba(255,230,120,0.9),
    0 0 40px rgba(255,200,80,0.8);
  transform: scale(1.03);
}

button:active{
  transform: scale(0.95);
  filter:
    brightness(1.4)
    drop-shadow(0 0 10px rgba(255,255,200,1))
    drop-shadow(0 0 20px rgba(255,200,80,1));
}

.totalRow{
  background:#1e2f1e;
  font-weight:bold;
}

.sorted-col-1 td:nth-child(1),
.sorted-col-2 td:nth-child(2),
.sorted-col-3 td:nth-child(3),
.sorted-col-4 td:nth-child(4),
.sorted-col-5 td:nth-child(5),
.sorted-col-6 td:nth-child(6),
.sorted-col-7 td:nth-child(7),
.sorted-col-8 td:nth-child(8),
.sorted-col-9 td:nth-child(9),
.sorted-col-10 td:nth-child(10),
.sorted-col-11 td:nth-child(11),
.sorted-col-12 td:nth-child(12),
.sorted-col-13 td:nth-child(13),
.sorted-col-14 td:nth-child(14){
  background:#2f3b2f !important;
}

*{
  cursor:pointer !important;
}
</style>


</head>


<body>


<div class="top-buttons no-capture">
  <div class="top-zoom" onclick="setKashinZoom(100)">100%</div>
  <div class="top-zoom" onclick="setKashinZoom(125)">125%</div>
  <div class="top-zoom" onclick="setKashinZoom(150)">150%</div>
  <div class="top-zoom" onclick="setKashinZoom(175)">175%</div>
  <div class="top-zoom" onclick="setKashinZoom(200)">200%</div>
  <div class="top-save" onclick="downloadScreen()">保存</div>
  <div class="top-back" onclick="location.href='index.html'">戻る</div>
</div>
<h1 class="title">九十九</h1>
<div style="text-align:center; margin:10px 0;">

  <div style="font-size:14px; margin-bottom:6px;">
    除外可能な九十九 系統
  </div>

  <label id="excludeLabelA">
    <input type="checkbox" id="excludeA">
    開運系・九十九
  </label>

  <label id="excludeLabelB" style="margin-left:20px;">
    <input type="checkbox" id="excludeB">
    英雄系・九十九
  </label>

  <label id="excludeLabelC" style="margin-left:20px;">
    <input type="checkbox" id="excludeC">
    上覧系・九十九
  </label>
</div>

<div id="rawData" style="display:none;">
  <table id="csvTable" cellspacing="0" border="0"></table>
</div>
<h3>第1優先</h3>
<div id="mainBtns"></div>

<h3>第2優先</h3>
<div id="subBtns"></div>

<h3>第3優先</h3>
<div id="thirdBtns"></div>

<h3>選択中（8個）</h3>
<table id="selectedTable"></table>

<h3>一覧</h3>
<table id="table"></table>

<script>
let baseData=[];
let selected=[];
let replaceTarget=null;

let mainStat=null;
let subStat=null;
let thirdStat=null;

/* ★修正：初期ソート */
let sortKey="番号";
let sortAsc=true;

const stats=["生命","気合","腕力","耐久","器用","知力","魅力","土","水","火","風"];

const statColors={
  "生命":"#ddd","気合":"#7fbfd6","腕力":"#cc6666","耐久":"#5f7fbf",
  "器用":"#6fbf6f","知力":"#d6d67f","魅力":"#a87fd6",
  "土":"#d19a66","水":"#4f6fa8","火":"#b35f7a","風":"#9ccc65"
};

/* ★追加：矢印 */
function getArrow(key){
  if(sortKey!==key) return "";
  return sortAsc ? " ▲" : " ▼";
}

/* ★追加：除外判定 */
function isExcluded(num){
  num = parseInt(num,10) || 0;

  if(document.getElementById("excludeA").checked){
    if([1,9,10,30].includes(num)) return true;
  }
  if(document.getElementById("excludeB").checked){
    if([2,29].includes(num)) return true;
  }
  if(document.getElementById("excludeC").checked){
    if([17,18,19,149,150,151].includes(num)) return true;
  }

  return false;
}

/* ★追加：除外に合わせて選択解除 */
function syncExcludedSelected(){
  selected = selected.filter(id => !isExcluded(id));
  if(replaceTarget!=null && isExcluded(replaceTarget)){
    replaceTarget = null;
  }
}

/* ★追加：ラベル色更新 */
function updateExcludeLabels(){
  document.getElementById("excludeLabelA").classList.toggle("activeLabel", document.getElementById("excludeA").checked);
  document.getElementById("excludeLabelB").classList.toggle("activeLabel", document.getElementById("excludeB").checked);
  document.getElementById("excludeLabelC").classList.toggle("activeLabel", document.getElementById("excludeC").checked);
}

/* ★追加：除外UI変更時 */
function onExcludeChange(){
  syncExcludedSelected();
  updateExcludeLabels();
  showTop();
}
async function loadCSV() {
  const response = await fetch("./九十九.csv");

  if (!response.ok) {
    throw new Error("CSV読み込み失敗: " + response.status);
  }

  const text = (await response.text()).replace(/^\uFEFF/, "");

  const rows = text.trim().split(/\r?\n/);

  const csvTable = document.getElementById("csvTable");
  csvTable.innerHTML = "";

  rows.forEach(row => {
    const cols = row.split(",");

    let tr = document.createElement("tr");

    cols.forEach(col => {
      let value = col.trim();

      if(value.startsWith('"') && value.endsWith('"')){
        value = value.slice(1, -1).replace(/""/g, '"');
      }

      let td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    csvTable.appendChild(tr);
  });
}/* データ読込 */
function loadFromHTML(){
  const rows=document.querySelectorAll("#rawData table tr");
  if(!rows.length)return;

  const headers=[];
  rows[0].querySelectorAll("td").forEach(td=>{
    headers.push(td.innerText.trim());
  });

  for(let i=1;i<rows.length;i++){
    const tds=rows[i].querySelectorAll("td");
    if(!tds.length)continue;

    let obj={};
    headers.forEach((h,idx)=>{
      obj[h]=tds[idx]?.innerText.trim()||"";
    });

    baseData.push(obj);
  }
}

function getVal(d,key){
  let v=d[key];
  if(typeof v==="string")v=v.replace(/[^0-9.-]/g,"");
  v=parseFloat(v);
  return isNaN(v)?0:v;
}

/* ボタン */
function makeBtns(){
  stats.forEach(s=>{
    mainBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setMain('${s}')">${s}</button>`;
    subBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setSub('${s}')">${s}</button>`;
    thirdBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setThird('${s}')">${s}</button>`;
  });
}

function updateBtnState(){
  document.querySelectorAll("#mainBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===mainStat);
  });
  document.querySelectorAll("#subBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===subStat);
  });
  document.querySelectorAll("#thirdBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===thirdStat);
  });
}

/* 優先 */
function setMain(s){mainStat=s;updateBtnState();showTop();}
function setSub(s){subStat=s;updateBtnState();showTop();}
function setThird(s){thirdStat=s;updateBtnState();showTop();}

/* 自動8個 */
function compare(a,b){
  const priority=[mainStat,subStat,thirdStat,"生命"].filter(Boolean);
  for(let key of priority){
    let diff=getVal(b,key)-getVal(a,key);
    if(diff!==0)return diff;
  }
  return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
}

function showTop(){
  const sorted=[...baseData].filter(d=>!isExcluded(d["番号"])).sort(compare);
  selected=sorted.slice(0,8).map(d=>d["番号"]);
  replaceTarget=null;
  render();
}

/* ソート */
function setSort(key){
  if(sortKey===key){
    sortAsc=!sortAsc;
  }else{
    sortKey=key;
    sortAsc=false;
  }
  render();
}

/* 入替対象 */
function setReplace(id){
  if(isExcluded(id)) return;
  replaceTarget = (replaceTarget===id)?null:id;
  render();
}

/* 入替＋選択 */
function toggle(id){

  if(isExcluded(id)) return;

  if(replaceTarget!=null){

    if(id==replaceTarget){
      replaceTarget=null;
      render();
      return;
    }

    if(selected.includes(id)) return;

    const idx=selected.indexOf(replaceTarget);

    if(idx!=-1){
      selected[idx]=id;
    }

    replaceTarget=null;
    render();
    return;
  }

  const i=selected.indexOf(id);

  if(i>=0){
    selected.splice(i,1);
  }else{
    if(selected.length>=8)return;
    selected.push(id);
  }

  render();
}

/* 合計 */
function calcTotals(){
  let t={};
  stats.forEach(s=>t[s]=0);

  selected.forEach(id=>{
    const d=baseData.find(x=>x["番号"]==id);
    if(!d)return;
    stats.forEach(s=>t[s]+=getVal(d,s));
  });

  return t;
}

/* 描画 */
function render(){

  syncExcludedSelected();

  let list=[...baseData];

  list.sort((a,b)=>{

    if(sortKey){
      let diff=getVal(a,sortKey)-getVal(b,sortKey);
      return sortAsc ? diff : -diff;
    }
    return compare(a,b);
  });

  const colIndexMap = {"番号":1,"九十九の力":2};
  stats.forEach((s,i)=>{ colIndexMap[s]=i+3; });
  colIndexMap["入手"]=14;

  let html="<tr>";
  html+=`<th style="width:42px; white-space:nowrap;" onclick="setSort('番号')">番号${getArrow('番号')}</th>`;
  html+=`<th>九十九の力</th>`;
  stats.forEach(s=>{
    html+=`<th onclick="setSort('${s}')">${s}${getArrow(s)}</th>`;
  });
  html+=`<th style="width:70px; white-space:nowrap;">入手</th>`;
  html+="</tr>";

  list.forEach(d=>{
    const sel=selected.includes(d["番号"])?"selected":"";
    const rep=(replaceTarget==d["番号"])?"replaceTarget":"";
    const exc=isExcluded(d["番号"])?"excluded":"";

    html+=`<tr class="${sel} ${rep} ${exc}" onclick="toggle('${d["番号"]}')">`;

    html+=`<td>${d["番号"]}</td><td>${d["九十九の力"]||""}</td>`;
    stats.forEach(s=>{
      html+=`<td style="color:${statColors[s]}">${getVal(d,s)}</td>`;
    });
    html+=`<td style="white-space:nowrap;">${d["入手"]||""}</td>`;
    html+="</tr>";
  });

  table.innerHTML=html;

  if(sortKey){
    table.className="sorted-col-"+colIndexMap[sortKey];
  }else{
    table.className="";
  }

  let html2="<tr><th>番号</th><th>九十九の力</th>";
  stats.forEach(s=>html2+=`<th>${s}</th>`);
  html2+=`<th style='width:70px; white-space:nowrap;'>入手</th>`;
  html2+="</tr>";

  selected.forEach(id=>{
    const d=baseData.find(x=>x["番号"]==id);
    if(!d)return;

    const rep=(replaceTarget==id)?"replaceTarget":"";

    html2+=`<tr class="${rep}" onclick="setReplace('${id}')">`;

    html2+=`<td>${d["番号"]}</td><td>${d["九十九の力"]||""}</td>`;
    stats.forEach(s=>{
      html2+=`<td style="color:${statColors[s]}">${getVal(d,s)}</td>`;
    });
    html2+=`<td style="white-space:nowrap;">${d["入手"]||""}</td>`;

    html2+="</tr>";
  });

  const t=calcTotals();

  html2+=`<tr class="totalRow"><td colspan="2">合計</td>`;
  stats.forEach(s=>{
    html2+=`<td style="color:${statColors[s]}">${t[s]}</td>`;
  });
  html2+=`<td></td>`;
  html2+="</tr>";

  selectedTable.innerHTML=html2;
}

/* 初期化 */
makeBtns();
updateBtnState();

loadCSV().then(() => {
  loadFromHTML();
  updateExcludeLabels();

  document.getElementById("excludeA").addEventListener("change", onExcludeChange);
  document.getElementById("excludeB").addEventListener("change", onExcludeChange);
  document.getElementById("excludeC").addEventListener("change", onExcludeChange);

  render();
});</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
function setKashinZoom(percent) {
  document.body.style.zoom = percent + "%";
}

function downloadScreen() { 
 html2canvas(document.body, {
    backgroundColor: "#000000",
    scale: 2,

    x: window.scrollX,
    y: window.scrollY,

    width: window.innerWidth,
    height: window.innerHeight,
    windowWidth: window.innerWidth,
    windowHeight: window.innerHeight,

    ignoreElements: (el) => el.classList.contains("no-capture")
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "九十九.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
</script>

</body>
</html>
