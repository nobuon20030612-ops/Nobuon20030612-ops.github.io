<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>公開前チェック | 英傑陣法</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#100b07;color:#f4ead2;font-family:system-ui,"Yu Gothic",sans-serif}
header{padding:14px 16px;background:#1b0f08;border-bottom:1px solid #d8ad55}
main{max-width:1100px;margin:auto;padding:16px}
.card{background:#1c140d;border:1px solid #7a5a29;border-radius:14px;padding:14px;margin-bottom:12px}
button{padding:9px 12px;border-radius:8px;border:1px solid #d8ad55;background:#7b281c;color:#fff;cursor:pointer}
.ok{color:#86efac}.ng{color:#ff8a8a}.warn{color:#ffd166}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #3f3019;padding:6px;text-align:left}
th{background:#24170b;color:#ffe1a1}
a{color:#f4d38b}
pre{white-space:pre-wrap;background:#080808;border:1px solid #3f3019;border-radius:8px;padding:10px}
</style>
</head>
<body>
<header>
<a href="index.html" style="color:#f4d38b;text-decoration:none">← トップへ戻る</a>
<h1>公開前チェック</h1>
</header>
<main>
<section class="card">
<p>公開前・公開後に、必要ファイルとCSV読込を確認するページ。</p>
<button id="runBtn">チェック実行</button>
</section>

<section class="card">
<h2>結果</h2>
<div id="result">未実行</div>
</section>

<section class="card">
<h2>リンク確認</h2>
<ul>
<li><a href="index.html">index.html</a></li>
<li><a href="jinpo.html">jinpo.html</a></li>
<li><a href="eiketsu_list.html">eiketsu_list.html</a></li>
<li><a href="inen_list.html">inen_list.html</a></li>
</ul>
</section>
</main>
<script>
const files = [
  "index.html",
  "jinpo.html",
  "eiketsu_list.html",
  "inen_list.html",
  "data/jinpo_eiketsu_master.csv",
  "data/jinpo_inen_master.csv",
  "jinpo-activation-engine.js",
  "jinpo-formation-config.js",
  "favicon.svg",
  "ogp.svg"
];

async function checkFile(path){
  try{
    const res = await fetch(path, {cache:"no-store"});
    const text = await res.text();
    return {path, ok:res.ok, status:res.status, size:text.length};
  }catch(e){
    return {path, ok:false, status:"ERROR", size:0, error:e.message};
  }
}
function parseCsvCount(text){
  return text.split(/\r?\n/).filter(x=>x.trim()).length - 1;
}
document.getElementById("runBtn").addEventListener("click", async()=>{
  const rows = [];
  for(const f of files) rows.push(await checkFile(f));

  let eCount = "未確認", iCount = "未確認";
  try{
    eCount = parseCsvCount(await (await fetch("data/jinpo_eiketsu_master.csv?check="+Date.now())).text());
    iCount = parseCsvCount(await (await fetch("data/jinpo_inen_master.csv?check="+Date.now())).text());
  }catch(e){}

  const html = `
    <table>
      <thead><tr><th>ファイル</th><th>状態</th><th>HTTP</th><th>サイズ</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${r.path}</td>
          <td class="${r.ok?'ok':'ng'}">${r.ok?'OK':'NG'}</td>
          <td>${r.status}</td>
          <td>${r.size}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <p>英傑CSV件数: <b>${eCount}</b></p>
    <p>因縁CSV件数: <b>${iCount}</b></p>
    <p class="${rows.every(r=>r.ok)?'ok':'ng'}">${rows.every(r=>r.ok)?'必要ファイル確認OK':'不足ファイルあり'}</p>
  `;
  document.getElementById("result").innerHTML = html;
});
</script>
</body>
</html>
