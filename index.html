<script>
const video = document.getElementById("video");
const overlay = document.getElementById("videoOverlay");

function playVideo() {
    const selectedVideo = Math.random() < 0.1 ? "video2.mp4" : "video.mp4";

    video.src = selectedVideo;
    video.controls = false;

    overlay.style.display = "flex";
    video.currentTime = 0;

    video.play();
}

video.addEventListener("ended", () => {
    video.pause();
    overlay.style.display = "none";
});

document.querySelectorAll('.imgbtn').forEach(btn => {
    btn.addEventListener('touchstart', () => {
        btn.classList.add('active');
    }, { passive: true });

    btn.addEventListener('touchend', () => {
        setTimeout(() => {
            btn.classList.remove('active');
        }, 150);
    }, { passive: true });
});

const downloadBtn = document.getElementById("downloadBtn");
const filePath = "test.xlsx";

function checkDownloadFile() {
    fetch(filePath, { method: "HEAD" })
      .then(res => {
        if (res.ok) {
          downloadBtn.style.display = "block";
          downloadBtn.onclick = () => {
            window.location.href = filePath;
          };
        }
      })
      .catch(() => {});
}

window.addEventListener("load", () => {
    if ("requestIdleCallback" in window) {
        requestIdleCallback(checkDownloadFile);
    } else {
        setTimeout(checkDownloadFile, 500);
    }
});
</script>
