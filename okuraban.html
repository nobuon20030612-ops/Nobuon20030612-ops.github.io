<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御蔵番</title>

<style>

/* 戻るボタン（右上） */
.back-btn{
  position:fixed;
  top:14px;
  right:18px;
  padding:10px 22px;
  font-size:24px;
  font-weight:bold;
  color:#ff3333;
  background:#111;
  border:3px solid #ff3333;
  cursor:pointer;
  z-index:9999;
}

.back-btn:hover{
  box-shadow:
    0 0 18px #ff3333,
    0 0 36px #ff3333,
    0 0 70px #ff3333;
}

/* 名物ボタン（右下・被らない位置） */
.meibutsu-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:9999;

  padding:14px 28px;
  font-size:22px;
  font-weight:bold;

  color:#fff;
  background:#ff3b3b;
  border:2px solid #ff0000;
  border-radius:6px;
  cursor:pointer;
}

.meibutsu-btn:hover{
  box-shadow:
    0 0 20px #ff0000,
    0 0 40px #ff0000,
    0 0 80px #ff0000;
}
html, body{
  margin:0;
  padding:0;
  background:black;
  overflow-y:auto;
  overflow-x:hidden;
}

.wrapper{
  width:100%;
  padding-top:70px;
  box-sizing:border-box;
}

img{
  display:block;
  width:100%;
  height:auto;
}

@media (orientation: landscape){
  img{
    width:70%;
    margin:0 auto;
  }
}
</style>
</head>

<body>

<button class="back-btn" onclick="location.href='index.html'">戻る</button>

<button class="meibutsu-btn" onclick="location.href='meibutsu.html'">名物</button>

<div class="wrapper">
  <img src="okuraban.png">
</div>

</body>
</html>
