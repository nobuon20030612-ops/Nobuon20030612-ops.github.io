<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>鬼神石ツール</title>

<style>
body{
  background:#000;
  color:#ccc;
  font-family:sans-serif;
}

.title{
  text-align:center;
  font-size:40px;
  margin:12px 0;
  color:#ddd;
}
.top-buttons{
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 12px 20px 0 0;
  box-sizing: border-box;
}

.top-reset,
.top-zoom,
.top-save,
.top-back,
.top-info{
  padding: 10px 20px;
  font-size: 20px;
  border: 2px solid #ff3b3b;
  color: #ff3b3b;
  background: rgba(0,0,0,0.6);
  cursor: pointer;
  transition: all 0.2s;
}

.top-reset:hover,
.top-zoom:hover,
.top-save:hover,
.top-back:hover,
.top-info:hover{
  color: #fff;
  border-color: #ff0000;
  box-shadow:
    0 0 8px rgba(255,80,80,0.9),
    0 0 20px rgba(255,0,0,0.9),
    0 0 40px rgba(255,0,0,0.8);
  transform:none !important;
}
h3{
  font-size:24px;
  margin-top:16px;
}
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #333;
  padding:4px;
  text-align:center;
  font-size:11px;
}

th{
  cursor:pointer;
}

/* ★ここに追加 */
tr:hover{
  background:#222;

  box-shadow:
    0 0 6px rgba(255,255,200,0.5),
    0 0 12px rgba(255,230,120,0.5);
}

.selected{
  background:#2a2a2a;
}

/* 選択中の一覧行を常時光らせる */
tr.selected{
  background:#3a202b !important;
  box-shadow:
    inset 0 0 10px rgba(255,196,214,0.82),
    0 0 10px rgba(255,168,196,0.72);
}

/* 選択中の行にカーソルを置いた時は少し強く光る */
tr.selected:hover{
  background:#542b3b !important;
  box-shadow:
    inset 0 0 14px rgba(255,220,231,1),
    0 0 16px rgba(255,182,207,0.92),
    0 0 28px rgba(255,150,188,0.82);
}

.replaceTarget{
  outline:3px solid #fff;
  background:#444 !important;
}

button{
  background:#222;
  color:#aaa;
  border:1px solid #444;
  margin:4px;
  padding:12px 20px;
  font-size:18px;
  cursor:pointer;
}
button:hover{
  transform: scale(1.05);
  filter:
    brightness(1.2)
    drop-shadow(0 0 6px rgba(255,255,200,0.9))
    drop-shadow(0 0 14px rgba(255,230,120,0.9))
    drop-shadow(0 0 24px rgba(255,200,80,0.8));
}
button.active{
  background:#444;
  color:#fff;

  box-shadow:
    0 0 10px rgba(255,255,200,1),
    0 0 20px rgba(255,230,120,0.9),
    0 0 40px rgba(255,200,80,0.8);

  transform: scale(1.03);
}	
/* ★クリック時 */
button:active{
  transform: scale(0.95);
  filter:
    brightness(1.4)
    drop-shadow(0 0 10px rgba(255,255,200,1))
    drop-shadow(0 0 20px rgba(255,200,80,1));
}

.totalRow{
  background:#1e2f1e;
  font-weight:bold;
}

/* ★追加：ソート列（縦） */
.sorted-col-1 td:nth-child(1),
.sorted-col-2 td:nth-child(2),
.sorted-col-3 td:nth-child(3),
.sorted-col-4 td:nth-child(4),
.sorted-col-5 td:nth-child(5),
.sorted-col-6 td:nth-child(6),
.sorted-col-7 td:nth-child(7),
.sorted-col-8 td:nth-child(8),
.sorted-col-9 td:nth-child(9),
.sorted-col-10 td:nth-child(10),
.sorted-col-11 td:nth-child(11),
.sorted-col-12 td:nth-child(12),
.sorted-col-13 td:nth-child(13),
.sorted-col-14 td:nth-child(14){
  box-shadow:inset 0 0 0 2px #2f3b2f !important;
}

.kishinseki-info-modal{
  position:fixed;
  inset:30px;
  background:#050505;
  border:2px solid #ff3b3b;
  z-index:99999;
  overflow:hidden;
  padding:12px;
  color:#ccc;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
}

.kishinseki-info-modal.hidden{
  display:none;
}

.kishinseki-info-actions{
  background:#050505;
  padding:8px;
  display:flex;
  justify-content:flex-end;
}

.kishinseki-info-close{
  padding:10px 20px;
  font-size:20px;
  border:2px solid #ff3b3b;
  color:#ff3b3b;
  background:rgba(0,0,0,0.6);
  cursor:pointer;
}

.kishinseki-info-img{
  display:block;
  margin:10px auto 0;
  max-width:80vw;
  max-height:62vh;
  width:auto;
  height:auto;
  object-fit:contain;
  flex:0 1 auto;
}

/* カーソル */
*{
  cursor:pointer !important;
}

/* ===== 2026-09 優先条件・倍率・選択数・優先並び替え ===== */
.top-zoom[data-zoom].zoom-active{
  color:#fff3a6;
  border-color:#ffd966;
  background:#352900;
  box-shadow:
    0 0 8px rgba(255,230,120,.95),
    0 0 18px rgba(255,200,60,.85),
    inset 0 0 10px rgba(255,220,80,.18);
}

.priority-box{
  margin:10px 0 14px;
  padding:8px 10px 10px;
  border:2px solid #555;
  background:#080808;
  box-sizing:border-box;
}
.priority-block{
  display:grid;
  grid-template-columns:88px minmax(0,1fr);
  align-items:center;
  gap:8px;
  margin:4px 0;
}
.priority-block h3{
  margin:0;
  font-size:18px;
  white-space:nowrap;
}
.priority-stat-row{
  display:grid;
  grid-template-columns:repeat(11,minmax(0,1fr));
  gap:2px;
  min-width:0;
}
.priority-stat-row button{
  width:100%;
  min-width:0;
  margin:0;
  padding:8px 2px;
  font-size:14px;
  line-height:1.1;
  white-space:nowrap;
  box-sizing:border-box;
}

.selected-count-heading{
  margin-top:14px;
}
.selected-count-number{
  display:inline-block;
  min-width:1.2em;
  margin:0 2px;
  font-size:1.35em;
  line-height:1;
  text-align:center;
  color:#ffc6d9;
  text-shadow:
    0 0 5px rgba(255,190,210,.95),
    0 0 12px rgba(255,145,185,.72);
}

.list-heading-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:12px;
  margin-top:10px;
}
.list-title-with-count{
  display:flex;
  align-items:flex-end;
  gap:18px;
  justify-self:start;
  min-width:0;
}
.list-title-with-count > h3{
  margin:16px 0 4px;
}
.list-title-with-count .selected-count-inline{
  margin:0 0 4px;
  white-space:nowrap;
}
.list-heading-row > .priority-sort-controls{
  position:static;
  justify-self:end;
  align-self:end;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
}
.priority-sort-controls .priority-sort-buttons-line{
  margin-top:0;
}
.selection-clear-trigger{
  position:static;
  order:2;
  white-space:nowrap;
  flex:0 0 auto;
}
.selection-clear-trigger:hover{
  transform:scale(1.05);
}
.priority-sort-buttons-line{
  order:1;
  flex:0 0 auto;
}
.list-heading-spacer{
  display:none;
}
.selected-count-inline{
  font-size:16px;
  font-weight:700;
  color:#ddd;
  margin-bottom:2px;
}
.selected-count-inline .selected-count-number{
  font-size:22px;
}

.priority-sort-buttons-line{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:2px;
}
.priority-sort-trigger{
  margin:0;
  min-width:118px;
  padding:6px 10px;
  font-size:14px;
  line-height:1.2;
  border:1px solid #777;
  background:#151515;
  color:#ddd;
  font-weight:700;
  text-align:center;
}
.priority-sort-trigger:hover{
  border-color:#ffd966;
  color:#fff;
}
.priority-sort-trigger .priority-sort-stat{
  margin-left:5px;
  font-weight:900;
  text-shadow:0 0 6px currentColor;
}

.priority-sort-modal{
  position:fixed;
  inset:0;
  z-index:100000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
  box-sizing:border-box;
}
.priority-sort-modal.hidden{
  display:none;
}
.priority-sort-panel{
  width:min(520px,92vw);
  padding:18px;
  border:2px solid #777;
  background:#080808;
  box-shadow:
    0 0 18px rgba(255,220,100,.28),
    inset 0 0 18px rgba(255,255,255,.04);
  box-sizing:border-box;
}
.priority-sort-modal-buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.priority-sort-modal-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  width:100%;
}
.priority-sort-modal-buttons button{
  min-width:68px;
  margin:0;
  padding:10px 8px;
  font-size:16px;
  white-space:nowrap;
}
.priority-sort-modal-buttons button.active{
  border-color:#ffd966;
  box-shadow:
    0 0 8px rgba(255,230,120,.9),
    0 0 16px rgba(255,190,60,.7);
}
.priority-sort-modal-buttons button:disabled{
  opacity:.28;
  filter:none;
  transform:none;
}
.priority-sort-clear{
  min-width:72px !important;
  color:#ff6868 !important;
  border-color:#b90000 !important;
  background:#2a0000 !important;
  font-weight:900 !important;
  box-shadow:
    0 0 7px rgba(255,60,60,.45),
    inset 0 0 8px rgba(255,0,0,.15);
}
.priority-sort-clear:hover{
  color:#fff !important;
  border-color:#ff3030 !important;
  background:#650000 !important;
  box-shadow:
    0 0 8px rgba(255,90,90,.9),
    0 0 16px rgba(255,0,0,.65) !important;
}
.priority-sort-col{
  position:relative;
  box-shadow:
    inset 0 0 0 2px var(--priority-col-color),
    inset 0 0 10px rgba(255,255,255,.035) !important;
}
th.priority-sort-col{
  font-weight:900;
  text-shadow:0 0 6px var(--priority-col-color);
}

@media (max-width:900px){
  .priority-block{
    grid-template-columns:72px minmax(0,1fr);
    gap:5px;
  }
  .priority-block h3{font-size:15px;}
  .priority-stat-row{gap:1px;}
  .priority-stat-row button{
    padding:7px 1px;
    font-size:12px;
  }
}


/* 小さい画面では上部ボタンを1列のまま収め、横スクロールさせない */
@media (max-width:900px){
  .top-buttons{
    gap:4px !important;
    padding:8px 8px 0 !important;
    overflow-x:hidden !important;
    justify-content:flex-end !important;
    flex-wrap:nowrap !important;
    white-space:nowrap;
  }
  .top-buttons .top-reset,
  .top-buttons .top-zoom,
  .top-buttons .top-save,
  .top-buttons .top-back,
  .top-buttons .top-info{
    padding:8px 10px !important;
    font-size:16px !important;
    flex:0 0 auto !important;
  }
}
@media (max-width:700px){
  .top-buttons{gap:3px !important;}
  .top-buttons .top-reset,
  .top-buttons .top-zoom,
  .top-buttons .top-save,
  .top-buttons .top-back,
  .top-buttons .top-info{
    padding:7px 7px !important;
    font-size:14px !important;
  }
}


/* ===== 3ツール共通列幅：鬼神石の元仕様を基準 ===== */
#table, #selectedTable{
  width:100% !important;
  table-layout:auto !important;
}
#table th, #table td,
#selectedTable th, #selectedTable td{
  white-space:nowrap !important;
}
#table th:first-child, #table td:first-child,
#selectedTable th:first-child, #selectedTable td:first-child{
  width:42px !important;
}
#table th:nth-child(14), #table td:nth-child(14),
#selectedTable th:nth-child(14), #selectedTable td:nth-child(14){
  width:70px !important;
  max-width:70px !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
}

/* ===== 九十九と同仕様：鬼神の力 名前検索 ===== */
.kishin-search-guide{
  margin:12px 0 6px;
  padding:10px 14px;
  box-sizing:border-box;
  text-align:center;
  font-size:22px;
  line-height:1.35;
  font-weight:900;
  color:#ffd8e7;
  border:2px solid #ffb8d1;
  background:rgba(24,8,16,.82);
  text-shadow:
    0 0 7px rgba(255,216,231,.98),
    0 0 16px rgba(255,170,205,.88),
    0 0 28px rgba(255,135,185,.62);
  box-shadow:
    0 0 10px rgba(255,184,209,.60),
    0 0 22px rgba(255,150,195,.34),
    inset 0 0 12px rgba(255,190,215,.12);
}
.kishin-search-row{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0 4px;
}
.kishin-search-input{
  width:min(430px,100%);
  box-sizing:border-box;
  padding:9px 12px;
  border:2px solid #666;
  background:rgba(0,0,0,.82);
  color:#eee;
  font-size:16px;
  outline:none;
}
.kishin-search-input:focus{
  border-color:#ffb8d1;
  box-shadow:
    0 0 8px rgba(255,190,215,.82),
    0 0 16px rgba(255,150,195,.40),
    inset 0 0 8px rgba(255,190,215,.10);
}
.kishin-search-input::placeholder{color:#888;}
.kishin-search-results{margin:8px 0 14px;}
.kishin-search-results.hidden{display:none;}
.kishin-search-results h3{margin:8px 0 4px;}

#kishinSearchResultTable{
  width:100% !important;
  table-layout:auto !important;
}
#kishinSearchResultTable th,
#kishinSearchResultTable td{
  white-space:nowrap !important;
}
#kishinSearchResultTable th:first-child,
#kishinSearchResultTable td:first-child{
  width:42px !important;
}
#kishinSearchResultTable th:nth-child(14),
#kishinSearchResultTable td:nth-child(14){
  width:70px !important;
  max-width:70px !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
}

/* ===== 九十九と同仕様：右下固定ズーム操作 ===== */
.fixed-zoom-controls{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:999999;
  display:flex;
  align-items:center;
  gap:12px;
}
.fixed-zoom-btn{
  min-width:112px;
  margin:0 !important;
  padding:12px 18px !important;
  border-radius:8px;
  font-size:18px !important;
  font-weight:900;
  line-height:1.1;
  color:#fff;
  background:rgba(0,0,0,.86);
  cursor:pointer;
  transition:filter .15s ease, box-shadow .15s ease, transform .15s ease;
}
.fixed-zoom-btn:hover{
  transform:scale(1.05) !important;
  filter:brightness(1.16);
}
.fixed-zoom-out{
  border:2px solid #55bfff !important;
  color:#bfe9ff !important;
  box-shadow:
    0 0 8px rgba(90,195,255,.95),
    0 0 18px rgba(40,145,255,.85),
    0 0 34px rgba(0,95,255,.65),
    inset 0 0 12px rgba(75,175,255,.14) !important;
}
.fixed-zoom-out:hover{
  border-color:#a7e2ff !important;
  box-shadow:
    0 0 10px rgba(165,225,255,1),
    0 0 24px rgba(65,165,255,.95),
    0 0 42px rgba(0,100,255,.78) !important;
}
.fixed-zoom-in{
  border:2px solid #ff4f5f !important;
  color:#ffd0d5 !important;
  box-shadow:
    0 0 8px rgba(255,90,105,.98),
    0 0 18px rgba(255,35,55,.88),
    0 0 34px rgba(205,0,25,.68),
    inset 0 0 12px rgba(255,70,90,.14) !important;
}
.fixed-zoom-in:hover{
  border-color:#ff9da8 !important;
  box-shadow:
    0 0 10px rgba(255,170,180,1),
    0 0 24px rgba(255,70,90,.98),
    0 0 42px rgba(220,0,25,.8) !important;
}
@media (max-width:700px){
  .fixed-zoom-controls{right:10px;bottom:10px;gap:8px;}
  .fixed-zoom-btn{min-width:92px;padding:10px 12px !important;font-size:16px !important;}
}



/* 2026-10-02 左下固定 能力数値＋選択中バッジ＋リセット（単一路線） */
#tsukumoQuickBoard{
  position:fixed;left:8px;bottom:8px;z-index:4000;
  width:1100px;height:351px;box-sizing:border-box;overflow:hidden;
  pointer-events:none;background:transparent;transform-origin:left bottom;
  --tsukumo-board-scale:.5;
  transform:scale(var(--tsukumo-board-scale));
  box-shadow:none;
}
#tsukumoQuickAbility{
  position:absolute;left:355px;top:0;width:590px;height:145px;
  background:none;
  box-sizing:border-box;border-bottom:none;
}
.tsukumo-ability-label,
.tsukumo-ability-value{
  position:absolute;height:31px;line-height:31px;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:25px;font-weight:800;letter-spacing:.02em;white-space:nowrap;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
}
.tsukumo-ability-label{
  text-align:left;
  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
     0   -1px 0 #000,
     0    1px 0 #000,
    -1px  0   0 #000,
     1px  0   0 #000;
}
.tsukumo-ability-value{text-align:left;background:none;border-radius:0;box-shadow:none}
.tsukumo-ability-value.has-value{
  display:inline-block;width:max-content!important;min-width:0!important;padding:0 5px;color:#fff!important;
  background:rgba(0,0,0,.84);border-radius:4px;
  box-shadow:0 0 0 1px rgba(255,255,255,.04);
  text-shadow:0 2px 0 #000,0 0 2px #000;
}
.tsukumo-ability-label.col-1{left:140px;width:56px}
.tsukumo-ability-label.col-2{left:320px;width:56px}
.tsukumo-ability-label.col-3{left:470px;width:38px}
.tsukumo-ability-value.col-1{left:200px;width:104px}
.tsukumo-ability-value.col-2{left:382px;width:96px}
.tsukumo-ability-value.col-3{left:512px;width:78px}
.tsukumo-ability-label.row-1,.tsukumo-ability-value.row-1{top:0}
.tsukumo-ability-label.row-2,.tsukumo-ability-value.row-2{top:31px}
.tsukumo-ability-label.row-3,.tsukumo-ability-value.row-3{top:63px}
.tsukumo-ability-label.row-4,.tsukumo-ability-value.row-4{top:95px}
.tsukumo-ability-label.stat-life,.tsukumo-ability-value.stat-life{color:#ffffff}
.tsukumo-ability-label.stat-ki,.tsukumo-ability-value.stat-ki{color:#8bdcff}
.tsukumo-ability-label.stat-arm,.tsukumo-ability-value.stat-arm{color:#ef7373}
.tsukumo-ability-label.stat-end,.tsukumo-ability-value.stat-end{color:#6d97f0}
.tsukumo-ability-label.stat-dex,.tsukumo-ability-value.stat-dex{color:#73d973}
.tsukumo-ability-label.stat-int,.tsukumo-ability-value.stat-int{color:#e6de79}
.tsukumo-ability-label.stat-cha,.tsukumo-ability-value.stat-cha{color:#b884f2}
.tsukumo-ability-label.stat-earth,.tsukumo-ability-value.stat-earth{color:#e6de79}
.tsukumo-ability-label.stat-water,.tsukumo-ability-value.stat-water{color:#8bdcff}
.tsukumo-ability-label.stat-fire,.tsukumo-ability-value.stat-fire{color:#f0a3a3}
.tsukumo-ability-label.stat-wind,.tsukumo-ability-value.stat-wind{color:#9edb96}
#tsukumoBadgeGrid{position:absolute;left:0;top:150px;width:1100px;height:201px}
#tsukumoBadgeResetBtn{
  position:absolute;
  left:930px;
  top:69px;
  width:150px;
  height:62px;
  box-sizing:border-box;
  border:2px solid #f0c86b;
  border-radius:8px;
  background:linear-gradient(180deg,#a91e17 0%,#6d0808 58%,#390303 100%);
  color:#fff7df;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:25px;
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  white-space:nowrap;
  text-shadow:0 2px 0 #360000,0 0 4px #ff9a53;
  box-shadow:0 0 9px rgba(255,69,40,.92),inset 0 0 7px rgba(255,220,126,.25);
  cursor:pointer;
  pointer-events:auto;
}
#tsukumoBadgeResetBtn[hidden]{display:none!important}
#tsukumoBadgeResetBtn:hover{filter:brightness(1.12)}
.tsukumo-badge-card{

<script>
let currentKishinsekiZoom = 150;

function setKishinsekiZoom(percent) {
  const next=Math.max(100,Math.min(300,Number(percent)||150));
  currentKishinsekiZoom=next;

  const zoomArea = document.getElementById("zoomArea");
  if(zoomArea){
    zoomArea.style.zoom = next + "%";
    zoomArea.style.width = "100%";
  }
}

function changeKishinsekiZoom(delta){
  setKishinsekiZoom(currentKishinsekiZoom + Number(delta||0));
}

function resetKishinsekiSelection(){
  selected = [];
  mainStat = null;
  subStat = null;
  thirdStat = null;
  replaceTarget = null;
  prioritySortStats = [null,null];
  updateBtnState();
  render();
}

let baseData=[];
let selected=[];
let replaceTarget=null;

let mainStat=null;
let subStat=null;
let thirdStat=null;
let prioritySortStats=[null,null];
let prioritySortTarget=0;

/* ★修正：初期ソート */
let sortKey="番号";
let sortAsc=true;

/* 検索結果は通常一覧とは独立して並び替える */
let kishinSearchSortKey="番号";
let kishinSearchSortAsc=true;

const stats=["生命","気合","腕力","耐久","器用","知力","魅力","土","水","火","風"];

const statColors={
  "生命":"#ddd","気合":"#7fbfd6","腕力":"#cc6666","耐久":"#5f7fbf",
  "器用":"#6fbf6f","知力":"#d6d67f","魅力":"#a87fd6",
  "土":"#d19a66","水":"#4f6fa8","火":"#b35f7a","風":"#9ccc65"
};

function updateSelectedCount(){
  document.querySelectorAll("[data-selected-count]").forEach(el=>{
    el.textContent=selected.length;
  });
}

function clearAllSelected(){
  selected=[];
  replaceTarget=null;
  render();
}


function comparePrioritySort(a,b){
  const active=prioritySortStats.filter(Boolean);

  if(active.length===1){
    const s=active[0];
    const diff=getVal(b,s)-getVal(a,s);
    if(diff!==0)return diff;
    return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
  }

  if(active.length===2){
    const first=prioritySortStats[0];
    const second=prioritySortStats[1];

    const aFirst=getVal(a,first);
    const aSecond=getVal(a,second);
    const bFirst=getVal(b,first);
    const bSecond=getVal(b,second);

    const aFirstOn=aFirst>=10;
    const aSecondOn=aSecond>=10;
    const bFirstOn=bFirst>=10;
    const bSecondOn=bSecond>=10;

    // 優先順位:
    // 1) ①②とも10以上
    // 2) ①のみ10以上
    // 3) ②のみ10以上
    // 4) ①②とも10未満
    const bucket=(firstOn,secondOn)=>{
      if(firstOn && secondOn) return 0;
      if(firstOn) return 1;
      if(secondOn) return 2;
      return 3;
    };

    let diff=bucket(aFirstOn,aSecondOn)-bucket(bFirstOn,bSecondOn);
    if(diff!==0)return diff;

    const sumA=aFirst+aSecond;
    const sumB=bFirst+bSecond;
    diff=sumB-sumA;
    if(diff!==0)return diff;

    diff=bFirst-aFirst;
    if(diff!==0)return diff;

    diff=bSecond-aSecond;
    if(diff!==0)return diff;

    return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
  }

  return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
}

function makePrioritySortButtons(){
  const box=document.getElementById("prioritySortButtons");
  if(!box)return;

  const rows=[
    ["生命","気合"],
    ["腕力","耐久","器用","知力","魅力"],
    ["土","水","火","風"]
  ];

  box.innerHTML=rows.map((row,rowIndex)=>
    `<div class="priority-sort-modal-row">${
      row.map(s=>`<button type="button" data-priority-sort-stat="${s}" style="color:${statColors[s]}" onclick="selectPrioritySortStat('${s}')">${s}</button>`).join("")
    }${rowIndex===0?`<button type="button" class="priority-sort-clear" onclick="clearPrioritySort()">解除</button>`:""}</div>`
  ).join("");

  updatePrioritySortUI();
}

function updatePrioritySortUI(){
  [0,1].forEach(slot=>{
    const trigger=document.getElementById(`prioritySortTrigger${slot+1}`);
    if(!trigger)return;

    const stat=prioritySortStats[slot];
    if(stat){
      trigger.innerHTML=`並び替え${slot===0?"①":"②"}<span class="priority-sort-stat" style="color:${statColors[stat]}">${stat}</span>`;
    }else{
      trigger.textContent=`並び替え${slot===0?"①":"②"}`;
    }
  });

  document.querySelectorAll("[data-priority-sort-stat]").forEach(btn=>{
    const stat=btn.dataset.prioritySortStat;
    const current=prioritySortStats[prioritySortTarget];
    const usedByOther=prioritySortStats.some((s,i)=>i!==prioritySortTarget && s===stat);

    btn.classList.toggle("active",stat===current);
    btn.disabled=usedByOther;
  });
}

function selectPrioritySortStat(stat){
  if(prioritySortStats[prioritySortTarget]===stat){
    prioritySortStats[prioritySortTarget]=null;
  }else{
    const otherSlot=prioritySortTarget===0?1:0;
    if(prioritySortStats[otherSlot]===stat)return;
    prioritySortStats[prioritySortTarget]=stat;
  }

  updatePrioritySortUI();
  closePrioritySortModal();
  render();
}

function openPrioritySortModal(slot){
  prioritySortTarget=slot===1?1:0;
  const modal=document.getElementById("prioritySortModal");
  if(!modal)return;
  modal.classList.remove("hidden");
  modal.setAttribute("aria-hidden","false");
  updatePrioritySortUI();
}

function closePrioritySortModal(){
  const modal=document.getElementById("prioritySortModal");
  if(!modal)return;
  modal.classList.add("hidden");
  modal.setAttribute("aria-hidden","true");
}

function clearPrioritySort(){
  prioritySortStats[prioritySortTarget]=null;
  updatePrioritySortUI();
  closePrioritySortModal();
  render();
}


function getArrow(key){
  if(sortKey!==key) return "";
  return sortAsc ? " ▲" : " ▼";
}

function getKishinSearchArrow(key){
  if(kishinSearchSortKey!==key) return "";
  return kishinSearchSortAsc ? " ▲" : " ▼";
}

function setKishinSearchSort(key){
  if(kishinSearchSortKey===key){
    kishinSearchSortAsc=!kishinSearchSortAsc;
  }else{
    kishinSearchSortKey=key;
    kishinSearchSortAsc=false;
  }
  renderKishinSearchResults();
}

async function loadCSV() {
  const response = await fetch("./鬼神石.csv");

  if (!response.ok) {
    throw new Error("CSV読み込み失敗: " + response.status);
  }

  const text = (await response.text()).replace(/^\uFEFF/, "");

  const rows = text.trim().split(/\r?\n/);

  const csvTable = document.getElementById("csvTable");
  csvTable.innerHTML = "";

  rows.forEach(row => {
    const cols = row.split(",");

    let tr = document.createElement("tr");

    cols.forEach(col => {
      let value = col.trim();

      if(value.startsWith('"') && value.endsWith('"')){
        value = value.slice(1, -1).replace(/""/g, '"');
      }

      let td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    csvTable.appendChild(tr);
  });
}
/* データ読込 */
function loadFromHTML(){
  const rows=document.querySelectorAll("#rawData table tr");
  if(!rows.length)return;

  const headers=[];
  rows[0].querySelectorAll("td").forEach(td=>{
    headers.push(td.innerText.trim());
  });

  for(let i=1;i<rows.length;i++){
    const tds=rows[i].querySelectorAll("td");
    if(!tds.length)continue;

    let obj={};
    headers.forEach((h,idx)=>{
      obj[h]=tds[idx]?.innerText.trim()||"";
    });

    baseData.push(obj);
  }
}

function getVal(d,key){
  let v=d[key];
  if(typeof v==="string")v=v.replace(/[^0-9.-]/g,"");
  v=parseFloat(v);
  return isNaN(v)?0:v;
}

/* ボタン */
function makeBtns(){
  stats.forEach(s=>{
    mainBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setMain('${s}')">${s}</button>`;
    subBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setSub('${s}')">${s}</button>`;
    thirdBtns.innerHTML+=`<button style="color:${statColors[s]}" onclick="setThird('${s}')">${s}</button>`;
  });
}

function updateBtnState(){
  document.querySelectorAll("#mainBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===mainStat);
  });
  document.querySelectorAll("#subBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===subStat);
  });
  document.querySelectorAll("#thirdBtns button").forEach(b=>{
    b.classList.toggle("active",b.textContent===thirdStat);
  });
}

/* 優先 */
function setMain(s){mainStat=s;updateBtnState();showTop();}
function setSub(s){subStat=s;updateBtnState();showTop();}
function setThird(s){thirdStat=s;updateBtnState();showTop();}

/* 自動8個 */
function compare(a,b){
  const priority=[mainStat,subStat,thirdStat,"生命"].filter(Boolean);
  for(let key of priority){
    let diff=getVal(b,key)-getVal(a,key);
    if(diff!==0)return diff;
  }
  return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
}

function showTop(){
  const sorted=[...baseData].sort(compare);
  selected=sorted.slice(0,8).map(d=>d["番号"]);
  replaceTarget=null;
  render();
}

/* ソート */
function setSort(key){
  prioritySortStats=[null,null];
  updatePrioritySortUI();
  if(sortKey===key){
    sortAsc=!sortAsc;
  }else{
    sortKey=key;
    sortAsc=false;
  }
  render();
}

/* 入替対象 */
function setReplace(id){
  replaceTarget = (replaceTarget===id)?null:id;
  render();
}

/* 入替＋選択 */
function keepClickedRowPosition(id,beforeTop){
  if(beforeTop==null)return;

  const rows=document.querySelectorAll("#table tr[data-row-id]");
  let currentRow=null;

  for(const row of rows){
    if(row.dataset.rowId==String(id)){
      currentRow=row;
      break;
    }
  }

  if(!currentRow)return;

  const afterTop=currentRow.getBoundingClientRect().top;
  const delta=afterTop-beforeTop;

  if(Math.abs(delta)>0.5){
    window.scrollBy(0,delta);
  }
}

function toggle(id,rowEl){
  const beforeTop=rowEl ? rowEl.getBoundingClientRect().top : null;

  const finish=()=>{
    render();
    keepClickedRowPosition(id,beforeTop);
  };

  if(replaceTarget!=null){
    if(id==replaceTarget){
      replaceTarget=null;
      finish();
      return;
    }

    if(selected.includes(id)) return;

    const idx=selected.indexOf(replaceTarget);

    if(idx!=-1){
      selected[idx]=id;
    }

    replaceTarget=null;
    finish();
    return;
  }

  const i=selected.indexOf(id);

  if(i>=0){
    selected.splice(i,1);
  }else{
    if(selected.length>=8)return;
    selected.push(id);
  }

  finish();
}

function removeSelectedFromSummary(id){
  const idx = selected.findIndex(v => String(v) === String(id));
  if(idx < 0) return;
  selected.splice(idx,1);
  if(String(replaceTarget) === String(id)) replaceTarget = null;
  render();
}

function escapeAttr(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


function refreshOverflowTitles(){
  requestAnimationFrame(()=>{
    document.querySelectorAll("#table th,#table td,#selectedTable th,#selectedTable td,#kishinSearchResultTable th,#kishinSearchResultTable td").forEach(cell=>{
      const full=(cell.textContent||"").trim();
      if(full && cell.scrollWidth > cell.clientWidth + 1){
        cell.title=full;
      }else{
        cell.removeAttribute("title");
      }
    });
  });
}

function calcTotals(){
  let t={};
  stats.forEach(s=>t[s]=0);

  selected.forEach(id=>{
    const d=baseData.find(x=>x["番号"]==id);
    if(!d)return;
    stats.forEach(s=>t[s]+=getVal(d,s));
  });

  return t;
}


/* ===== 鬼神の力：独立検索 ===== */
function toggleKishinFromSearch(id){
  id=String(id);

  if(replaceTarget!=null){
    if(id==String(replaceTarget)){
      replaceTarget=null;
      render();
      return;
    }

    if(selected.map(String).includes(id)) return;

    const idx=selected.findIndex(v=>String(v)===String(replaceTarget));
    if(idx!==-1){
      selected[idx]=id;
    }
    replaceTarget=null;
    render();
    return;
  }

  const i=selected.findIndex(v=>String(v)===id);
  if(i>=0){
    selected.splice(i,1);
  }else{
    if(selected.length>=8)return;
    selected.push(id);
  }
  render();
}

function getKishinSearchSortedData(){
  const data=[...baseData];
  data.sort((a,b)=>{
    const key=kishinSearchSortKey;
    if(!key) return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);

    let diff=getVal(a,key)-getVal(b,key);
    if(diff!==0) return kishinSearchSortAsc ? diff : -diff;
    return (parseInt(a["番号"])||0)-(parseInt(b["番号"])||0);
  });
  return data;
}

function renderKishinSearchResults(){
  const input=document.getElementById("kishinNameSearch");
  const wrap=document.getElementById("kishinSearchResults");
  const resultTable=document.getElementById("kishinSearchResultTable");
  const countEl=document.getElementById("kishinSearchCount");
  if(!input || !wrap || !resultTable || !countEl)return;

  const query=input.value.trim();
  if(!query){
    wrap.classList.add("hidden");
    resultTable.innerHTML="";
    countEl.textContent="0";
    return;
  }

  const matches=getKishinSearchSortedData().filter(d=>
    String(d["鬼神の力"]||"").includes(query)
  );

  countEl.textContent=matches.length;
  wrap.classList.remove("hidden");

  const colIndexMap={"番号":1,"鬼神の力":2};
  stats.forEach((s,i)=>{colIndexMap[s]=i+3;});
  colIndexMap["入手"]=14;

  let html="<tr>";
  html+=`<th style="width:42px; white-space:nowrap;" onclick="setKishinSearchSort('番号')">番号${getKishinSearchArrow('番号')}</th>`;
  html+=`<th>鬼神の力</th>`;
  stats.forEach(s=>{
    const cls=(kishinSearchSortKey===s)?"priority-sort-col":"";
    const style=(kishinSearchSortKey===s)
      ?` style="--priority-col-color:${statColors[s]};color:${statColors[s]}"`
      :` style="color:${statColors[s]}"`;
    html+=`<th class="${cls}"${style} onclick="setKishinSearchSort('${s}')">${s}${getKishinSearchArrow(s)}</th>`;
  });
  html+=`<th style='width:70px; white-space:nowrap;'>入手</th>`;
  html+="</tr>";

  matches.forEach(d=>{
    const id=String(d["番号"]||"");
    const sel=selected.map(String).includes(id)?"selected":"";
    const rep=(String(replaceTarget)===id)?"replaceTarget":"";
    html+=`<tr class="${sel} ${rep}" data-row-id="${escapeAttr(id)}" onclick="toggleKishinFromSearch('${escapeAttr(id)}')">`;
    html+=`<td style="width:42px; white-space:nowrap;">${d["番号"]||""}</td><td>${d["鬼神の力"]||""}</td>`;
    stats.forEach(s=>{
      const cls=(kishinSearchSortKey===s)?"priority-sort-col":"";
      const style=(kishinSearchSortKey===s)
        ?`color:${statColors[s]};--priority-col-color:${statColors[s]}`
        :`color:${statColors[s]}`;
      html+=`<td class="${cls}" style="${style}">${getVal(d,s)}</td>`;
    });
    html+=`<td style="white-space:nowrap;" title="${escapeAttr(d["入手"]||"")}">${d["入手"]||""}</td>`;
    html+="</tr>";
  });

  resultTable.innerHTML=html;
  if(kishinSearchSortKey){
    resultTable.className="sorted-col-"+colIndexMap[kishinSearchSortKey];
  }else{
    resultTable.className="";
  }
  refreshOverflowTitles();
}

/* 描画 */

/* ===== 左下固定 能力数値＋選択中バッジ＋リセット（単一路線） ===== */
const TSUKUMO_ABILITY_POSITIONS=[
  ["生命",1,1],["気合",1,2],["腕力",1,3],["耐久",1,4],
  ["器用",2,1],["知力",2,2],["魅力",2,3],
  ["土",3,1],["水",3,2],["火",3,3],["風",3,4]
];

function formatTsukumoAbilityValue(val){
  val=Number(val)||0;
  return val ? ((val>0?"+":"")+String(val)) : "------";
}
function getTsukumoAbilityStatClass(key){
  switch(key){
    case "生命": return "stat-life";
    case "気合": return "stat-ki";
    case "腕力": return "stat-arm";
    case "耐久": return "stat-end";
    case "器用": return "stat-dex";
    case "知力": return "stat-int";
    case "魅力": return "stat-cha";
    case "土": return "stat-earth";
    case "水": return "stat-water";
    case "火": return "stat-fire";
    case "風": return "stat-wind";
    default: return "";
  }
}
function escapeTsukumoBadgeText(value){
  return String(value==null?"":value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fitTsukumoQuickBoard(){
  const board=document.getElementById("tsukumoQuickBoard");
  if(!board)return;

  const baseW=1100;
  const baseH=351;
  const leftGap=8;
  const edgeGap=16;
  const zoomControls=document.querySelector(".fixed-zoom-controls");

  let availableW=window.innerWidth-leftGap-edgeGap;
  if(zoomControls){
    const zoomRect=zoomControls.getBoundingClientRect();
    if(zoomRect.width>0){
      availableW=Math.min(availableW,zoomRect.left-leftGap-18);
    }
  }

  const availableH=Math.max(90,window.innerHeight-16);
  const scale=Math.max(.12,Math.min(.5,availableW/baseW,availableH/baseH));
  board.style.setProperty("--tsukumo-board-scale", String(scale));
}
function renderTsukumoQuickBoard(){
  const badgeGrid=document.getElementById("tsukumoBadgeGrid");
  const ability=document.getElementById("tsukumoQuickAbility");
  const resetBtn=document.getElementById("tsukumoBadgeResetBtn");
  if(!badgeGrid || !ability || !resetBtn)return;

  const rows=selected.map(id=>baseData.find(row=>String(row["番号"]||"")===String(id))).filter(Boolean);
  const totals=calcTotals();

  const abilityLabels=TSUKUMO_ABILITY_POSITIONS.map(([key,col,row]) => {
    const statClass=getTsukumoAbilityStatClass(key);
    return `<span class="tsukumo-ability-label ${statClass} col-${col} row-${row}">${key}</span>`;
  }).join("");
  const abilityValues=TSUKUMO_ABILITY_POSITIONS.map(([key,col,row]) => {
    const formatted=formatTsukumoAbilityValue(totals[key]);
    const hasValue=formatted!=="------";
    const statClass=getTsukumoAbilityStatClass(key);
    return `<span class="tsukumo-ability-value ${statClass} col-${col} row-${row}${hasValue ? " has-value" : ""}">${formatted}</span>`;
  }).join("");
  ability.innerHTML=abilityLabels+abilityValues;

  badgeGrid.querySelectorAll(".tsukumo-badge-card").forEach(card=>card.remove());
  badgeGrid.insertAdjacentHTML("afterbegin",rows.slice(0,8).map((row,index)=>{
    const name=String(row["鬼神の力"]||"");
    return `<div class="tsukumo-badge-card slot-${index+1}"><div class="tsukumo-badge-name">${escapeTsukumoBadgeText(name)}</div></div>`;
  }).join(""));
  resetBtn.hidden=selected.length===0;

  fitTsukumoQuickBoard();
}
window.addEventListener("resize", fitTsukumoQuickBoard, { passive:true });

function render(){

  renderKishinSearchResults();

  let list=[...baseData];

  list.sort((a,b)=>{
    if(prioritySortStats.some(Boolean)){
      return comparePrioritySort(a,b);
    }
    if(sortKey){
      let diff=getVal(a,sortKey)-getVal(b,sortKey);
      return sortAsc ? diff : -diff;
    }
    return compare(a,b);
  });

  const colIndexMap = {"番号":1,"鬼神の力":2};
  stats.forEach((s,i)=>{ colIndexMap[s]=i+3; });
  colIndexMap["入手"]=14;

  let html="<tr>";
  html+=`<th style="width:42px; white-space:nowrap;" onclick="setSort('番号')">番号${getArrow('番号')}</th>`;
  html+=`<th>鬼神の力</th>`;
  stats.forEach(s=>{
    const activePriorityCol=prioritySortStats.includes(s);
    const cls=activePriorityCol?"priority-sort-col":"";
    const style=activePriorityCol?` style="--priority-col-color:${statColors[s]};color:${statColors[s]}"`:"";
    html+=`<th class="${cls}"${style} onclick="setSort('${s}')">${s}${getArrow(s)}</th>`;
  });
  html+=`<th style='width:70px; white-space:nowrap;'>入手</th>`;
  html+="</tr>";

  list.forEach(d=>{
    const sel=selected.includes(d["番号"])?"selected":"";
    const rep=(replaceTarget==d["番号"])?"replaceTarget":"";

    html+=`<tr class="${sel} ${rep}" data-row-id="${d["番号"]}" onclick="toggle('${d["番号"]}', this)">`;

    html+=`<td style="width:42px; white-space:nowrap;">${d["番号"]}</td><td>${d["鬼神の力"]||""}</td>`;
    stats.forEach(s=>{
      const activePriorityCol=prioritySortStats.includes(s);
      const cls=activePriorityCol?"priority-sort-col":"";
      const style=activePriorityCol
        ?`color:${statColors[s]};--priority-col-color:${statColors[s]}`
        :`color:${statColors[s]}`;
      html+=`<td class="${cls}" style="${style}">${getVal(d,s)}</td>`;
    });
    html+=`<td style="white-space:nowrap;" title="${escapeAttr(d["入手"]||"")}">${d["入手"]||""}</td>`;
    html+="</tr>";
  });

  table.innerHTML=html;

  if(prioritySortStats.some(Boolean)){
    table.className="";
  }else if(sortKey){
    table.className="sorted-col-"+colIndexMap[sortKey];
  }else{
    table.className="";
  }

  let html2="<tr><th style='width:42px; white-space:nowrap;'>番号</th><th>鬼神の力</th>";
  stats.forEach(s=>html2+=`<th>${s}</th>`);
  html2+=`<th style='width:70px; white-space:nowrap;'>入手</th>`;
  html2+="</tr>";

  selected.forEach(id=>{
    const d=baseData.find(x=>x["番号"]==id);
    if(!d)return;

    const rep=(replaceTarget==id)?"replaceTarget":"";

    html2+=`<tr class="${rep}" onclick="removeSelectedFromSummary('${id}')">`;

    html2+=`<td style="width:42px; white-space:nowrap;">${d["番号"]}</td><td>${d["鬼神の力"]||""}</td>`;
    stats.forEach(s=>{
      html2+=`<td style="color:${statColors[s]}">${getVal(d,s)}</td>`;
    });
    html2+=`<td style="white-space:nowrap;" title="${escapeAttr(d["入手"]||"")}">${d["入手"]||""}</td>`;

    html2+="</tr>";
  });

  const t=calcTotals();

  html2+=`<tr class="totalRow"><td colspan="2">合計</td>`;
  stats.forEach(s=>{
    html2+=`<td style="color:${statColors[s]}">${t[s]}</td>`;
  });
  html2+=`<td></td>`;
  html2+="</tr>";

  selectedTable.innerHTML=html2;
  renderTsukumoQuickBoard();
  refreshOverflowTitles();
  updateSelectedCount();
  updatePrioritySortUI();
}

makeBtns();
updateBtnState();
makePrioritySortButtons();
updateSelectedCount();

  loadFromHTML();
