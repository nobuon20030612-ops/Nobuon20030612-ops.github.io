name: 新陣法 jinpo-next 検証・更新

on:
  push:
    branches:
      - main
    paths:
      - 'source-next/英傑一覧.csv'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jinpo-next-build
  cancel-in-progress: false

jobs:
  build-next:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python準備
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 新陣法を検証・生成
        run: python tools-next/build_jinpo_next.py

      - name: 変更確認
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- jinpo-next tools-next/hero_internal_id_map.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: jinpo-next とID対応表をコミット
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- jinpo-next tools-next/hero_internal_id_map.json
          git commit -m "chore(jinpo-next): 英傑一覧から新陣法を更新"
          git push

      # GITHUB_TOKENでpushしたコミットはPagesビルドを自動起動しないため、
      # branch-based Pagesのまま明示的に再ビルドを要求する。
      - name: GitHub Pages 再ビルド要求
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10"
