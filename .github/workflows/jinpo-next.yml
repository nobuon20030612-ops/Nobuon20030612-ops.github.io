name: 陣法 検証・更新

on:
  push:
    branches:
      - main
    paths:
      - '陣法/source-next/英傑一覧.csv'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jinpo-production-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python準備
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 生成依存パッケージ
        run: python -m pip install --disable-pip-version-check numpy

      - name: 英傑一覧から陣法を全再生成・既存監査
        run: python "陣法/tools-next/build_jinpo_next.py"

      - name: 追加の回帰監査
        run: python "陣法/tools-next/audit_runtime_regressions.py"

      - name: 変更確認
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- "陣法"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 陣法だけコミット
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "陣法"
          git commit -m "chore(陣法): 英傑一覧から検索DBを再生成"
          git push

      - name: GitHub Pages 再ビルド要求
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10"
