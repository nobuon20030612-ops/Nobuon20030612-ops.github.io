name: 陣法 検証・更新

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/jinpo-next.yml'
      - '陣法/source-next/**'
      - '陣法/tools-next/**'
      - '陣法/jinpo.html'
      - '陣法/jinpo-bond-list.js'
      - '陣法/jinpo-internal-save.js'
      - '陣法/jinpo-fast-search.js'
      - '陣法/jinpo-fast-search-worker.js'
      - '陣法/jinpo-activation-engine.js'
      - '陣法/jinpo-formation-config.js'
      - '陣法/data/jinpo_eiketsu_master.csv'
      - '陣法/data/jinpo_inen_master.csv'
      - '陣法/data/compact_search_v2/**'
      - '陣法/data/91因縁_計算式_倍率展開.csv'
      - '陣法/data/formation_bonus.csv'
      - '陣法/data/jinpo_job_mapping.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jinpo-production-build
  cancel-in-progress: false

jobs:
  build:
    # 自動生成コミット自身では再実行しない。手動実行は常に許可する。
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python準備
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 生成依存パッケージ
        run: python -m pip install --disable-pip-version-check numpy

      - name: 英傑一覧から陣法を全再生成・既存監査
        run: python "陣法/tools-next/build_jinpo_next.py"

      - name: compactレコードモデル変更時の全再計算保証
        run: python "陣法/tools-next/ensure_compact_record_freshness.py"

      - name: compactステータス全件監査
        run: python "陣法/tools-next/audit_compact_stats.py"

      - name: 追加の回帰監査
        run: python "陣法/tools-next/audit_runtime_regressions.py"

      - name: 一時監査レポートをコミット対象から除外
        shell: bash
        run: |
          tracked_reports="$(git ls-files -- '陣法/_jinpo-next-report/**')"
          if [ -n "$tracked_reports" ]; then
            echo "陣法/_jinpo-next-report が追跡対象になっています。生成物の誤コミットを防ぐため停止します。" >&2
            printf '%s\n' "$tracked_reports" >&2
            exit 1
          fi
          rm -rf -- "陣法/_jinpo-next-report"

      - name: 変更確認
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- "陣法")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 陣法だけコミット
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "陣法"
          if git diff --cached --quiet; then
            echo "コミット対象の差分なし"
            exit 0
          fi
          git commit -m "chore(陣法): 英傑一覧から検索DBを再生成"
          git push

      - name: GitHub Pages 再ビルド要求
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10"
