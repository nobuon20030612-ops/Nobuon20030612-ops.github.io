<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トーナメント</title>
<style>
:root{
  --bg:#0d1118;
  --panel:#151b27;
  --panel2:#1e2635;
  --text:#f5f7ff;
  --muted:#aab3c5;
  --border:#30394d;
  --accent:#62a8ff;
  --win:#39d98a;
  --danger:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,#0b1018,#121824);
  color:var(--text);
}
header{
  padding:16px;
  border-bottom:1px solid var(--border);
  background:rgba(13,17,24,.96);
}
h1{margin:0 0 8px;font-size:22px}
h2{margin:0 0 12px;font-size:18px}
main{padding:16px}
a{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.layout.view-only{
  grid-template-columns:1fr;
}
.layout.view-only .panel{
  width:100%;
}
.panel{
  border:1px solid var(--border);
  background:rgba(21,27,39,.94);
  border-radius:14px;
  padding:14px;
}
input,button,select{font:inherit}
input,select{
  min-height:40px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0f1420;
  color:var(--text);
  padding:8px 10px;
}
button,.btn{
  min-height:40px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  padding:8px 12px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
button:hover,.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#1f5fbf;border-color:#2f7cff}
.danger{background:#50202a;border-color:#8c3344}
.ghost{background:#101722}
.small{min-height:30px;padding:4px 8px;font-size:12px;border-radius:8px}
.note{color:var(--muted);font-size:13px;line-height:1.55}
.hidden{display:none!important}
.list{display:grid;gap:8px}
.card{
  border:1px solid var(--border);
  border-radius:12px;
  background:#111722;
  padding:10px;
}
.card-title{font-weight:700;margin-bottom:6px}
.badge{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--border);
  border-radius:999px;
  padding:2px 8px;
  font-size:12px;
  color:#d8e2f7;
  background:#111827;
}
.participants{display:grid;gap:6px;max-height:420px;overflow:auto;padding-right:4px}
.participant{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#111722;border:1px solid var(--border);border-radius:10px;padding:7px 8px}
.participant-name{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bracket-shell{
  overflow:auto;
  width:100%;
  max-width:100%;
  min-height:calc(100vh - 230px);
  max-height:calc(100vh - 230px);
  padding:10px;
  background:rgba(10,13,19,.7);
  border:1px solid var(--border);
  border-radius:14px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
  scrollbar-gutter:stable both-edges;
}
.bracket-shell.view-mode{
  min-height:calc(100vh - 170px);
  max-height:calc(100vh - 170px);
}
.bracket{
  position:relative;
  min-width:720px;
  min-height:520px;
  padding:24px 18px 82px;
  transform-origin:top left;
}
.bracket-svg{position:absolute;left:18px;top:24px;overflow:visible;pointer-events:none;z-index:1}
.bracket-line{fill:none;stroke:var(--border);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.bracket-line.win{stroke:var(--win);stroke-width:4;filter:drop-shadow(0 0 5px rgba(57,217,138,.9));opacity:1}
.round-label{position:absolute;height:28px;display:flex;align-items:center;justify-content:center;color:#dbe7ff;font-weight:700;font-size:14px;white-space:nowrap}
.match-wrap{position:absolute;width:var(--matchW);min-height:var(--matchH);z-index:2}
.match{position:relative;width:var(--matchW);min-height:var(--matchH);background:#131927;border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.22);overflow:hidden}
.slot{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:38px;padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:15px;line-height:1.2;letter-spacing:0}
.slot:last-child{border-bottom:0}
.slot:hover{background:#1a2232}
.slot.empty{color:#687284;cursor:default}
.slot.waiting{color:#8d98aa;background:rgba(255,255,255,.025);cursor:default}
.slot.win{
  color:#07110b;
  background:linear-gradient(90deg,rgba(57,217,138,.95),rgba(57,217,138,.55));
  font-weight:700;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,220,.75),
    0 0 10px rgba(57,217,138,.75),
    0 0 22px rgba(57,217,138,.45);
  text-shadow:0 0 8px rgba(255,255,255,.75);
}
.slot.loser{opacity:.62}
.slot-name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;writing-mode:horizontal-tb;text-align:left;line-height:1.25}
.seed-badge{flex:0 0 auto;color:#d8e2f7;font-size:11px;opacity:.8}
.champion{margin-bottom:12px;padding:10px;border:1px solid rgba(57,217,138,.55);background:rgba(57,217,138,.12);border-radius:12px}
.double-layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:16px;
  align-items:start;
  width:100%;
  max-width:100%;
}
.double-layout.view-only{
  grid-template-columns:1fr;
}
.double-layout > .panel{
  min-width:0;
}
.double-board{
  display:grid;
  gap:14px;
  width:100%;
  min-width:0;
}
.grand-final-section{
  border-color:rgba(255,230,109,.72);
  box-shadow:
    0 16px 42px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.16),
    0 0 28px rgba(255,230,109,.16);
}
.double-section{
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(10,13,19,.7);
  padding:12px;
  overflow:auto;
  width:100%;
  max-width:100%;
  min-height:260px;
  max-height:calc(100vh - 230px);
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.double-layout.view-only .double-section{
  min-height:calc((100vh - 210px) / 3);
  max-height:calc(100vh - 190px);
}
.double-status-list{
  display:grid;
  gap:6px;
  max-height:260px;
  overflow:auto;
}
.double-status-row{
  border:1px solid var(--border);
  border-radius:10px;
  padding:7px 8px;
  background:#111722;
  display:flex;
  justify-content:space-between;
  gap:8px;
}
@media(max-width:900px){
  .double-layout{grid-template-columns:1fr}
  .double-section{
    min-height:260px;
    max-height:calc(100vh - 180px);
  }
  .double-layout.view-only .double-section{
    min-height:300px;
    max-height:calc(100vh - 150px);
  }
}
@media(max-width:640px){
  
  
  .double-section{
    min-height:260px;
    max-height:calc(100vh - 150px);
    padding:8px;
    overflow:auto;
    touch-action:pan-x pan-y;
  }
  .double-layout.view-only .double-section{
    min-height:320px;
    max-height:calc(100vh - 130px);
  }
}
@media(max-width:900px){
  main{padding:10px}
  .layout{grid-template-columns:1fr}
  .bracket-shell{
    min-height:calc(100vh - 190px);
    max-height:calc(100vh - 190px);
    padding:8px;
  }
  .bracket-shell.view-mode{
    min-height:calc(100vh - 145px);
    max-height:calc(100vh - 145px);
  }
}
@media(max-width:640px){
  header{padding:12px 10px}
  h1{font-size:19px}
  .row{gap:6px}
  button,.btn{min-height:36px;padding:7px 10px}
  .panel{padding:10px;border-radius:12px}
  .bracket-shell{
    min-height:calc(100vh - 175px);
    max-height:calc(100vh - 175px);
  }
  .bracket-shell.view-mode{
    min-height:calc(100vh - 132px);
    max-height:calc(100vh - 132px);
  }
}


/* double-diagram-layout: 画像のように勝者側と敗者側を左右に分け、最終決勝を最上部へ配置 */
.double-diagram-board{
  display:block;
  width:100%;
  min-width:0;
}
.double-diagram-shell{
  position:relative;
  overflow:auto;
  width:100%;
  max-width:100%;
  min-height:calc(100vh - 205px);
  max-height:calc(100vh - 205px);
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(10,13,19,.7);
  padding:8px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-x pan-y;
  scrollbar-gutter:stable both-edges;
}
.double-diagram{
  position:relative;
  min-width:760px;
  min-height:520px;
  transform-origin:top left;
}
.double-diagram-svg{
  position:absolute;
  left:0;
  top:0;
  overflow:visible;
  pointer-events:none;
  z-index:1;
}
.double-diagram-line{
  fill:none;
  stroke:rgba(170,190,235,.65);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 4px rgba(110,231,255,.16));
}
.double-diagram-line.win{
  stroke:#ff3b3b;
  stroke-width:5;
  filter:drop-shadow(0 0 6px rgba(255,59,59,.65));
}
.double-diagram-title{
  position:absolute;
  z-index:3;
  font-weight:800;
  letter-spacing:.04em;
  text-shadow:0 0 14px rgba(110,231,255,.35);
}
.double-diagram-title.final{
  color:var(--gold);
  font-size:20px;
}
.double-diagram-title.winners{
  color:#6ee7ff;
}
.double-diagram-title.losers{
  color:#ff8bd7;
}
.double-diagram-match{
  position:absolute;
  z-index:2;
  width:190px;
  border:1px solid var(--border);
  border-radius:12px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),
    rgba(14,21,44,.90);
  box-shadow:
    0 12px 30px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.14),
    0 0 20px rgba(124,60,255,.10);
  overflow:hidden;
}
.double-diagram-slot{
  min-height:36px;
  padding:6px 9px;
  border-bottom:1px solid rgba(255,255,255,.10);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.double-diagram-slot:last-child{border-bottom:0}
.double-diagram-slot:hover{
  background:linear-gradient(90deg,rgba(110,231,255,.15),rgba(124,60,255,.12));
}
.double-diagram-slot.win{
  color:#06130e;
  background:
    linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.04)),
    linear-gradient(135deg,#33f5a5,#6ee7ff);
  font-weight:700;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,220,.75),
    0 0 10px rgba(51,245,165,.70),
    0 0 22px rgba(110,231,255,.42);
  text-shadow:0 0 8px rgba(255,255,255,.72);
}
.double-diagram-slot.loser{opacity:.56}
.double-diagram-slot.empty{
  color:#9fb0d0;
  cursor:default;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
}
.double-diagram-name{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  writing-mode:horizontal-tb;
}
.double-diagram-note{
  position:absolute;
  z-index:3;
  color:var(--muted);
  font-size:12px;
  writing-mode:vertical-rl;
  text-orientation:mixed;
}
.double-diagram-bracket-label{
  position:absolute;
  z-index:3;
  width:28px;
  height:28px;
  border:1px solid rgba(255,255,255,.45);
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  background:rgba(255,255,255,.08);
  box-shadow:0 0 14px rgba(110,231,255,.18);
}
@media(max-width:900px){
  .double-diagram-shell{
    min-height:calc(100vh - 190px);
    max-height:calc(100vh - 190px);
  }
}
@media(max-width:640px){
  .double-diagram-shell{
    min-height:calc(100vh - 145px);
    max-height:calc(100vh - 145px);
    padding:8px;
  }
  .double-diagram{
    min-width:700px;
  }
}


/* double-clear-vertical-layout: 横長統合図をやめ、最終決勝→勝者側→敗者側の縦表示にする */
.double-diagram-shell{
  overflow:visible;
  width:100%;
  max-width:100%;
  min-height:auto;
  max-height:none;
  touch-action:pan-y;
  scrollbar-gutter:auto;
}
.double-diagram{
  position:relative;
  width:100%;
  min-width:0;
  min-height:0;
  display:grid;
  gap:16px;
  transform:none!important;
}
.double-clear-section{
  border:1px solid var(--border);
  border-radius:14px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),
    rgba(13,20,42,.74);
  box-shadow:
    0 16px 42px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.13),
    0 0 26px rgba(0,212,255,.08);
  padding:14px;
  min-width:0;
  margin-bottom:18px;
}
.double-clear-section.final{
  border-color:rgba(255,230,109,.72);
}
.double-clear-title{
  font-weight:800;
  margin:0 0 10px;
  color:#f8fbff;
  text-shadow:0 0 14px rgba(110,231,255,.28);
}
.double-clear-section.final .double-clear-title{
  color:var(--gold);
}
.double-clear-rounds{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  align-items:start;
}
.double-clear-round{
  display:grid;
  gap:9px;
  min-width:0;
  border:1px solid rgba(134,167,255,.24);
  border-radius:12px;
  padding:10px;
  background:rgba(255,255,255,.035);
}
.double-clear-round-title{
  font-weight:800;
  color:#dbe7ff;
  text-align:left;
  padding:4px 6px;
  border-left:4px solid var(--accent);
  text-shadow:0 0 12px rgba(110,231,255,.24);
}
.double-clear-match{
  border:1px solid var(--border);
  border-radius:12px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),
    rgba(14,21,44,.90);
  box-shadow:
    0 10px 24px rgba(0,0,0,.26),
    inset 0 1px 0 rgba(255,255,255,.12);
  overflow:hidden;
}
.double-clear-slot{
  min-height:36px;
  padding:6px 9px;
  border-bottom:1px solid rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
}
.double-clear-slot:last-child{border-bottom:0}
.double-clear-slot:hover{
  background:linear-gradient(90deg,rgba(110,231,255,.15),rgba(124,60,255,.12));
}
.double-clear-slot.win{
  color:#06130e;
  background:
    linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.04)),
    linear-gradient(135deg,#33f5a5,#6ee7ff);
  font-weight:700;
}
.double-clear-slot.loser{opacity:.56}
.double-clear-slot.empty{
  color:#9fb0d0;
  cursor:default;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
}
.double-clear-name{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  writing-mode:horizontal-tb;
}
.double-clear-note{
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
}
.double-clear-match-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:6px 9px;
  font-size:12px;
  color:#c3d0ed;
  background:rgba(255,255,255,.045);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.double-clear-match-head span{
  color:var(--muted);
}
@media(max-width:640px){
  .double-diagram-shell{
    overflow:visible;
    min-height:auto;
    max-height:none;
    padding:0;
  }
  .double-clear-section{padding:9px}
  .double-clear-rounds{
    grid-template-columns:1fr;
    gap:10px;
  }
}

.double-clear-section.final .double-tree-shell{

.double-clear-section.final .double-tree{

@media(max-width:640px){
  .double-tree-shell{
    min-height:250px;
    max-height:calc(100vh - 160px);
    padding:8px;
  }
  .double-tree{
    min-width:560px;
  }
  .double-tree-match{

  }

/* colorful-glossy-theme: 見た目だけ変更。機能JSには触らない。 */
:root{
  --bg:#070a16;
  --panel:rgba(17,22,42,.82);
  --panel2:rgba(37,48,92,.78);
  --text:#f8fbff;
  --muted:#b8c4de;
  --border:rgba(126,156,255,.38);
  --accent:#6ee7ff;
  --win:#33f5a5;
  --danger:#ff4d8d;
  --gloss-a:#7c3cff;

    }
    const localUpdated = Number(localTournament.updatedAt || localTournament.createdAt || 0);
    const remoteUpdated = Number(remoteTournament.updatedAt || remoteTournament.createdAt || 0);
    if(localUpdated >= remoteUpdated){
      mergedMap.set(localTournament.id, localTournament);
    }
  }

  return { tournaments: Array.from(mergedMap.values()) };
}
function currentLocalStore(){
  return normalizeStore(store);
}
function isLocalFileMode(){
  return location.protocol === "file:";
}
function firebaseStatusText(){
  if(isLocalFileMode()) return "ローカル確認中（この端末内保存）";
  if(firebaseReady) return "同期：接続中";
  return "未接続（この端末内保存）";
}
function updateFirebaseStatus(){
  // Firebase同期状態の表示はしない。
}
function initFirebaseSync(){
  try{
    if(isLocalFileMode()){
      console.warn("ローカルファイルではこの端末内保存で動作します。");
      firebaseReady = false;
      firebaseDb = null;
      return false;
    }
    if(!window.firebase || !firebase.initializeApp || !firebase.database){
      console.warn("同期SDKが読み込めません。localStorage保存で動作します。");
      return false;
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDb = firebase.database();
    firebaseReady = true;
    bindFirebaseStore();
    return true;
  }catch(error){
    console.error("同期初期化に失敗しました。localStorage保存で動作します。", error);
    firebaseReady = false;
    firebaseDb = null;
    return false;
  }
}
function bindFirebaseStore(){
  if(!firebaseDb) return;
  firebaseDb.ref(FIREBASE_STORE_PATH).on("value", snapshot => {
    const remoteStore = normalizeStore(snapshot.val());
    const localStore = currentLocalStore();
    const mergedStore = mergeTournamentStores(localStore, remoteStore);

    // Firebase側が空/nullでも、今この端末で作成・追加した大会は消さない。
    firebaseApplyingRemote = true;
    store = mergedStore;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));

    if(currentTournament){
      const refreshed = store.tournaments.find(t => t.id === currentTournament.id && t.status !== "削除");
      if(refreshed){
        currentTournament = refreshed;
      }else{
        currentTournament = null;
        currentMode = "hub";
      }
    }

    firebaseFirstSnapshotReceived = true;
    firebaseApplyingRemote = false;

    // remoteが古い/空でmergeによりローカルを保持した場合、Firebase側へ再保存して同期を直す。
    const remoteJson = JSON.stringify(remoteStore);
    const mergedJson = JSON.stringify(mergedStore);
    if(firebaseReady && remoteJson !== mergedJson){
      saveStoreToFirebase(true);
    }

    refreshCurrentView();
  }, error => {
    console.error("同期読込に失敗しました。", error);
  });
}
function saveStoreToFirebase(force = false){
  if(!firebaseReady || !firebaseDb || (firebaseApplyingRemote && !force)) return;
  clearTimeout(firebaseSaveTimer);
  firebaseSaveTimer = setTimeout(() => {
    firebaseDb.ref(FIREBASE_STORE_PATH).set(store).catch(error => {
      console.error("同期保存に失敗しました。", error);
    });
  }, 120);
}

    showOnly("singleView");
    renderSingle();
  }
  updateFirebaseStatus();
}

function autoDeleteAtOf(tournament){

  return Number(tournament.autoDeleteAt || (fallbackCreatedAt + TOURNAMENT_EXPIRE_MS));

  const hours = Math.floor((rest % AUTO_DELETE_EXTENSION_DAY_MS) / (60 * 60 * 1000));
  const minutes = Math.floor((rest % (60 * 60 * 1000)) / (60 * 1000));
  if(days > 0) return `自動削除まで ${days}日${hours}時間${minutes}分`;
  return `自動削除まで ${hours}時間${minutes}分`;
}

function shuffle(arr){
  const copy = [...arr];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function getParticipant(id){ return (currentTournament.participants || []).find(p => p.id === id) || null; }
function getName(id){ const p = getParticipant(id); return p ? p.name : ""; }
function findMatch(id){ return currentTournament.matches.find(m => m.id === id) || null; }
function getNextMatch(match){ return currentTournament.matches.find(m => m.round === match.round + 1 && Math.ceil(match.index / 2) === m.index) || null; }
function setNextSlot(match, winnerId){
  const next = getNextMatch(match);
  if(!next) return;
  if(match.index % 2 === 1) next.player1Id = winnerId;
  else next.player2Id = winnerId;
}
function nextPowerOfTwo(value){
  let size = 1;
  while(size < Math.max(2, value)) size *= 2;
  return size;
}
function balancedMatchOrder(count){
  const order = [];
  let left = 0;
  let right = count - 1;
  while(left <= right){
    order.push(left);
    if(left !== right) order.push(right);
    left += 1;
    right -= 1;
  }
  return order;
}
function balancedFirstRoundPairs(ids){
  const entries = ids.slice();
  const targetSize = nextPowerOfTwo(entries.length);
  const matchCount = targetSize / 2;
  const byeCount = targetSize - entries.length;
  const byeMatches = new Set(balancedMatchOrder(matchCount).slice(0, byeCount));
  const pairs = [];
  let index = 0;

  for(let matchIndex = 0; matchIndex < matchCount; matchIndex++){
    if(byeMatches.has(matchIndex)){
      pairs.push([entries[index] || null, null]);
      index += 1;
    }else{
      pairs.push([entries[index] || null, entries[index + 1] || null]);
      index += 2;
    }
  }
  return pairs;
}
function roundsFor(){
  if(currentTournament.matches && currentTournament.matches.length){
    return Math.max(...currentTournament.matches.map(m => m.round));
  }
  return Math.log2(nextPowerOfTwo(currentTournament.participants.length));
}
function makeEmptyMatches(){
  const participantCount = Math.min(MAX_TEAMS, currentTournament.participants.length);
  const bracketSize = nextPowerOfTwo(participantCount);
  const totalRounds = Math.log2(bracketSize);
  const matches = [];

  for(let r = 1; r <= totalRounds; r++){
    const count = bracketSize / Math.pow(2, r);
    for(let m = 1; m <= count; m++){
      matches.push({
        id: `r${r}_m${m}`,
        round: r,
        index: m,
        player1Id: null,
        player2Id: null,
        winnerId: null,
        isBye: false
      });
    }
  }
  return matches;
}
function autoAdvanceFirstRoundByes(){
  // 表基準：シードは2回戦開始まで。上位ラウンドの片側空きは試合結果待ちにする。
  const matches = currentTournament.matches
    .filter(match => match.round === 1)
    .sort((a,b) => a.index - b.index);

  for(const match of matches){
    if(match.winnerId) continue;
    const p1 = match.player1Id;
    const p2 = match.player2Id;
    if((p1 && !p2) || (!p1 && p2)){
      const next = getNextMatch(match);
      if(!next) continue;
      const winner = p1 || p2;
      match.winnerId = winner;
      match.isBye = true;
      setNextSlot(match, winner);
    }
  }
}
function clearDownstream(match){
  const next = getNextMatch(match);
  if(!next) return;
  if(match.index % 2 === 1) next.player1Id = null;
  else next.player2Id = null;
  next.winnerId = null;
  next.isBye = false;
  clearDownstream(next);
}
function addParticipant(){

  const p = { id: uid("p"), name, createdAt: Date.now() };

  $("nameInput").value = "";
  if(currentTournament.created) insertParticipantIntoBye(p.id);

}
function insertParticipantIntoBye(participantId){
  const firstRound = currentTournament.matches.filter(m => m.round === 1).sort((a,b) => a.index - b.index);
  const target = firstRound.find(m => (m.player1Id && !m.player2Id) || (!m.player1Id && m.player2Id));
  if(!target){ alert("空いているシード枠がありません。追加する場合は再抽選または作り直しが必要です。"); return; }
  const oldWinner = target.winnerId;
  if(target.player1Id && !target.player2Id) target.player2Id = participantId;
  else if(!target.player1Id && target.player2Id) target.player1Id = participantId;
  target.winnerId = null;
  target.isBye = false;
  if(oldWinner){
    const next = getNextMatch(target);
    if(next){
      if(target.index % 2 === 1 && next.player1Id === oldWinner) next.player1Id = null;
      if(target.index % 2 === 0 && next.player2Id === oldWinner) next.player2Id = null;
      next.winnerId = null;
      clearDownstream(next);
    }
  }
}
function removeParticipant(id){
  if(currentMode !== "admin") return;
  if(!confirm("この登録名を削除しますか？ 関連する勝敗もリセットされます。")) return;
  currentTournament.participants = currentTournament.participants.filter(p => p.id !== id);
  if(currentTournament.created){
    for(const m of currentTournament.matches){
      if(m.player1Id === id) m.player1Id = null;
      if(m.player2Id === id) m.player2Id = null;
      if(m.winnerId === id) m.winnerId = null;
    }
    rebuildProgressFromCurrentFirstRound();
  }
  saveTournament();
  renderSingle();
}
function rebuildProgressFromCurrentFirstRound(){
  const first = currentTournament.matches.filter(m => m.round === 1);
  for(const m of currentTournament.matches){
    if(m.round > 1){
      m.player1Id = null;
      m.player2Id = null;
      m.winnerId = null;
      m.isBye = false;
    }else if(m.player1Id && m.player2Id){
      m.isBye = false;
    }
  }
  for(const m of first){
    if(m.winnerId) setNextSlot(m, m.winnerId);
  }
  autoAdvanceFirstRoundByes();
}
function buildTournament(){
  if(currentMode !== "admin") return;
  if(currentTournament.participants.length < 2){ alert("登録名を2件以上入力してください。"); return; }
  const entryIds = shuffle(currentTournament.participants.map(p => p.id));
  const firstRoundPairs = balancedFirstRoundPairs(entryIds);
  currentTournament.matches = makeEmptyMatches();
  currentTournament.created = true;
  const firstRound = currentTournament.matches.filter(m => m.round === 1).sort((a,b) => a.index - b.index);
  firstRound.forEach((match, index) => {
    const pair = firstRoundPairs[index] || [null, null];
    match.player1Id = pair[0];
    match.player2Id = pair[1];
  });
  autoAdvanceFirstRoundByes();
  saveTournament();
  renderSingle();
}
function shuffleTournament(){
  if(currentMode !== "admin") return;
  if(currentTournament.participants.length < 2){
    alert("登録名を2件以上入力してください。");
    return;
  }
  if(currentTournament.created){
    const hasResult = currentTournament.matches.some(m => m.winnerId && !m.isBye);
    if(hasResult && !confirm("勝敗結果があります。リセットして組み合わせをシャッフルしますか？")) return;
  }
  buildTournament();
}

function chooseWinner(matchId, playerId){
  const match = findMatch(matchId);
  if(!match || !playerId){
    if(currentMode === "admin") alert("この枠はまだ勝者待ちです。");
    return;
  }
  if(currentMode !== "admin") return;
  if(!match.player1Id || !match.player2Id) return;
  if(match.winnerId === playerId) return;
  if(match.winnerId && !confirm("勝敗結果を修正すると、この試合より上の結果をリセットします。変更しますか？")) return;
  clearDownstream(match);
  match.winnerId = playerId;
  setNextSlot(match, playerId);
  autoAdvanceFirstRoundByes();
  saveTournament();
  renderSingle();
}
function resetResults(){
  if(currentMode !== "admin" || !currentTournament.created) return;
  if(!confirm("勝敗結果をすべてリセットしますか？")) return;
  for(const m of currentTournament.matches){

      m.player1Id = null;

    }

  autoAdvanceFirstRoundByes();
  saveTournament();
  renderSingle();
}
function extendAutoDelete(){
  if(currentMode !== "admin" || !currentTournament) return;
  const raw = prompt(`自動削除を何日延長しますか？ 1〜${AUTO_DELETE_EXTENSION_MAX_DAYS}日の数字で入力してください。`);
  if(raw === null) return;
  const days = Number(raw);
  if(!Number.isInteger(days) || days < 1 || days > AUTO_DELETE_EXTENSION_MAX_DAYS){
    alert(`延長できる日数は1日〜${AUTO_DELETE_EXTENSION_MAX_DAYS}日までです。`);
    return;
  }

  const createdAt = Number(currentTournament.createdAt || currentTournament.updatedAt || Date.now());
  const maxDeleteAt = createdAt + AUTO_DELETE_EXTENSION_MAX_DAYS * AUTO_DELETE_EXTENSION_DAY_MS + TOURNAMENT_EXPIRE_MS;
  const requestedDeleteAt = Date.now() + days * AUTO_DELETE_EXTENSION_DAY_MS + TOURNAMENT_EXPIRE_MS;
  if(requestedDeleteAt > maxDeleteAt){
    alert(`自動削除延長は作成日時から最大${AUTO_DELETE_EXTENSION_MAX_DAYS}日までです。これ以上は延長できません。`);
    return;
  }

  if(!confirm(`${days}日延長します。延長期間終了後、さらに48時間後に自動で完全削除されます。よろしいですか？`)) return;
  currentTournament.autoDeleteAt = requestedDeleteAt;
  saveTournament();
  alert(`自動削除を${days}日延長しました。`);
  if(currentTournament.type === "double") renderDouble();
  else renderSingle();
}
function deleteTournament(){

  saveStore();
  currentTournament = null;
  showHub();
}
function champion(){
  if(!currentTournament.created || !currentTournament.matches.length) return null;
  const lastRound = Math.max(...currentTournament.matches.map(m => m.round));
  const final = currentTournament.matches.find(m => m.round === lastRound);
  return final && final.winnerId ? getParticipant(final.winnerId) : null;
}
function roundLabel(round, totalRounds){
  if(round === totalRounds) return "決勝";
  if(round === totalRounds - 1) return "準決勝";
  return `${round}回戦`;
}
function slotClass(match, playerId){
  if(!playerId) return match.round > 1 ? "waiting" : "empty";
  if(match.winnerId === playerId) return "win";
  if(match.winnerId && match.winnerId !== playerId) return "loser";
  return "";
}
function renderParticipants(){
  const box = $("participants");
  box.innerHTML = "";
  currentTournament.participants.forEach((p,i) => {
    const row = document.createElement("div");

  const pos = new Map();
  for(let r = 1; r <= totalRounds; r++){
    const y = contentHeight - r * matchH - (r - 1) * gapY;
    const matches = currentTournament.matches.filter(m => m.round === r).sort((a,b) => a.index - b.index);

    for(const [matchIndex, m] of matches.entries()){
      const groupLeft = (m.index - 1) * span * baseStep;
      const groupWidth = span * matchW + Math.max(0, span - 1) * gapX;
      const centerX = groupLeft + groupWidth / 2;
      const x = centerX - matchW / 2;
      const label = document.createElement("div");
      label.className = "round-label";
      label.textContent = roundLabel(r, totalRounds);

      const isFirstRoundBye = m.round === 1 && m.isBye;
      const bye1 = isFirstRoundBye && m.player1Id && !m.player2Id ? `<span class="seed-badge">シード</span>` : "";

      wrap.innerHTML = `
        <div class="match">

          <div class="slot ${p2Class}" data-player="${m.player2Id || ""}"><span class="slot-name">${p2Name ? escapeHtml(p2Name) : p2EmptyLabel}</span>${bye2}</div>
        </div>`;
      wrap.querySelectorAll(".slot").forEach(slot => {

    }
  }
  for(const m of currentTournament.matches){
    const next = getNextMatch(m);
    if(!next) continue;
    if(!m.winnerId && m.round > 1) continue;
    const a = pos.get(m.id), b = pos.get(next.id);
    if(!a || !b) continue;
    const startX = a.centerX;
    const startY = a.y;
    const endX = b.centerX;
    const endY = b.y + matchH;
    const midY = startY - gapY / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", `bracket-line ${m.winnerId ? "win" : ""}`);
    path.setAttribute("d", `M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`);
    svg.appendChild(path);
  }
}
function ensureDoubleState(){
  if(!currentTournament.doubleState){
    currentTournament.doubleState = {
      participants: {},
      winnersRounds: [],
      losersRounds: [],
      grandFinal: [],
      roundNumber: 0,
      championId: null
    };
  }
  if(!currentTournament.participants) currentTournament.participants = [];
}
function doubleActiveIds(losses){
  ensureDoubleState();
  return currentTournament.participants
    .map(p => p.id)
    .filter(id => {
      const st = currentTournament.doubleState.participants[id] || {losses:0, eliminated:false};
      return !st.eliminated && st.losses === losses;
    });
}
function doubleGetStatus(id){
  ensureDoubleState();
  if(!currentTournament.doubleState.participants[id]){
    currentTournament.doubleState.participants[id] = {losses:0, eliminated:false};
  }
  return currentTournament.doubleState.participants[id];
}
function doublePair(ids){
  const pairs = balancedFirstRoundPairs(ids);
  return pairs.map(pair => ({
    id: "dm_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8),
    player1Id: pair[0] || null,
    player2Id: pair[1] || null,
    winnerId: null,
    loserId: null,
    isBye: Boolean((pair[0] && !pair[1]) || (!pair[0] && pair[1]))
  }));
}
function doubleAutoByes(matches){
  for(const m of matches){
    if(m.isBye && !m.winnerId){
      const winner = m.player1Id || m.player2Id;
      if(winner){
        m.winnerId = winner;
        m.loserId = null;
      }
    }
  }
}

function doubleChooseWinner(matchId, playerId, bracketType){
  if(currentMode !== "admin") return;
  ensureDoubleState();
  const match = findDoubleMatch(matchId);
  if(!match || !playerId) return;
  if(!match.player1Id || !match.player2Id) return;
  if(match.winnerId === playerId) return;
  if(match.winnerId && !confirm("この試合の勝敗を修正すると、以降のラウンドを作り直す必要があります。変更しますか？")) return;
  match.winnerId = playerId;
  match.loserId = match.player1Id === playerId ? match.player2Id : match.player1Id;
  doubleAutoGenerateNextRoundIfReady();
  saveTournament();
  renderDouble();
}
function findDoubleMatch(matchId){
  ensureDoubleState();
  for(const round of currentTournament.doubleState.winnersRounds){
    const found = round.matches.find(m => m.id === matchId);
    if(found) return found;
  }
  for(const round of currentTournament.doubleState.losersRounds){
    const found = round.matches.find(m => m.id === matchId);
    if(found) return found;
  }
  for(const round of currentTournament.doubleState.grandFinal){
    const found = round.matches.find(m => m.id === matchId);
    if(found) return found;
  }
  return null;
}
function doubleAllMatchesDecided(rounds){
  const last = rounds[rounds.length - 1];
  if(!last) return true;
  return last.matches.every(m => m.winnerId);
}
function applyDoubleRoundResults(rounds, bracket){
  const last = rounds[rounds.length - 1];
  if(!last || last.applied) return;
  for(const m of last.matches){
    if(!m.winnerId) continue;
    if(m.loserId){
      const loserStatus = doubleGetStatus(m.loserId);
      loserStatus.losses += 1;
      if(loserStatus.losses >= 2) loserStatus.eliminated = true;
    }
  }
  last.applied = true;
}
function doubleGenerateNextRound(){
  if(currentMode !== "admin") return;
  ensureDoubleState();
  if(!currentTournament.created){ alert("先に初回組み合わせを作成してください。"); return; }
  if(currentTournament.doubleState.championId){ alert("優勝者が決定済みです。"); return; }

  if(!doubleAllMatchesDecided(currentTournament.doubleState.winnersRounds)){
    alert("勝者側の未入力試合があります。");
    return;
  }
  if(!doubleAllMatchesDecided(currentTournament.doubleState.losersRounds)){
    alert("敗者側の未入力試合があります。");
    return;
  }
  if(!doubleAllMatchesDecided(currentTournament.doubleState.grandFinal)){
    alert("最終決勝の未入力試合があります。");
    return;
  }

  applyDoubleRoundResults(currentTournament.doubleState.winnersRounds, "W");
  applyDoubleRoundResults(currentTournament.doubleState.losersRounds, "L");

  const loss0 = doubleActiveIds(0);
  const loss1 = doubleActiveIds(1);

  if(currentTournament.doubleState.grandFinal.length){
    const finalMatch = currentTournament.doubleState.grandFinal[currentTournament.doubleState.grandFinal.length - 1].matches[0];
    if(finalMatch && finalMatch.winnerId){
      const loserId = finalMatch.loserId;
      if(loserId){
        const loserStatus = doubleGetStatus(loserId);
        loserStatus.losses += 1;
        if(loserStatus.losses >= 2){
          loserStatus.eliminated = true;
          currentTournament.doubleState.championId = finalMatch.winnerId;
        }else{
          const resetMatch = {
            id: "gf_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8),
            player1Id: finalMatch.winnerId,
            player2Id: loserId,
            winnerId: null,
            loserId: null,
            isBye: false
          };
          currentTournament.doubleState.grandFinal.push({round:currentTournament.doubleState.grandFinal.length + 1, title:"最終決勝リセット", matches:[resetMatch]});
        }
      }else{
        currentTournament.doubleState.championId = finalMatch.winnerId;
      }
      saveTournament();
      renderDouble();
      return;
    }
  }

  if(loss0.length === 1 && loss1.length === 1){
    const gf = {
      id: "gf_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8),
      player1Id: loss0[0],
      player2Id: loss1[0],
      winnerId: null,
      loserId: null,
      isBye: false
    };
    currentTournament.doubleState.grandFinal.push({round:1, title:"最終決勝", matches:[gf]});
    saveTournament();
    renderDouble();
    return;
  }

  currentTournament.doubleState.roundNumber += 1;
  if(loss0.length > 1){
    const wMatches = doublePair(shuffle(loss0));
    doubleAutoByes(wMatches);
    currentTournament.doubleState.winnersRounds.push({
      round: currentTournament.doubleState.winnersRounds.length + 1,
      title: "勝者側 " + (currentTournament.doubleState.winnersRounds.length + 1) + "回戦",
      matches: wMatches
    });
  }
  if(loss1.length > 1){
    const lMatches = doublePair(shuffle(loss1));
    doubleAutoByes(lMatches);
    currentTournament.doubleState.losersRounds.push({
      round: currentTournament.doubleState.losersRounds.length + 1,
      title: "敗者側 " + (currentTournament.doubleState.losersRounds.length + 1) + "回戦",
      matches: lMatches
    });
  }
  saveTournament();
  renderDouble();
}
function doubleAutoGenerateNextRoundIfReady(){
  if(currentMode !== "admin") return;
  ensureDoubleState();
  if(!currentTournament.created) return;
  if(currentTournament.doubleState.championId) return;
  if(!doubleAllMatchesDecided(currentTournament.doubleState.winnersRounds)) return;
  if(!doubleAllMatchesDecided(currentTournament.doubleState.losersRounds)) return;
  if(!doubleAllMatchesDecided(currentTournament.doubleState.grandFinal)) return;

  // 手動ボタンと同じ生成処理を使い、勝敗が揃った瞬間だけ自動で次へ進める。
  doubleGenerateNextRound();
}

function renderDoubleTreeInto(root, rounds, type, fixedBar){
  const isFinal = type === "final";
  const matchW = isFinal ? 210 : 210;
  const matchH = 76;
  const gapX = isFinal ? 56 : 70;
  const gapY = isFinal ? 18 : 34;
  const topPad = 34;
  const leftPad = 18;
  const roundsCount = Math.max(1, rounds.length);
  const maxMatches = Math.max(1, ...rounds.map(r => r.matches.length));
  const contentWidth = leftPad * 2 + roundsCount * matchW + Math.max(0, roundsCount - 1) * gapX;
  const contentHeight = topPad + maxMatches * matchH + Math.max(0, maxMatches - 1) * gapY + 36;

  if(fixedBar){
    fixedBar.style.width = `${contentWidth}px`;
    fixedBar.style.minWidth = `${contentWidth}px`;
    fixedBar.innerHTML = "";
  }

  root.style.width = `${contentWidth}px`;
  root.style.height = `${contentHeight}px`;
  root.style.minWidth = `${contentWidth}px`;
  root.style.minHeight = `${contentHeight}px`;

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "double-tree-svg");
  svg.setAttribute("width", contentWidth);
  svg.setAttribute("height", contentHeight);
  svg.setAttribute("viewBox", `0 0 ${contentWidth} ${contentHeight}`);
  root.appendChild(svg);

  const pos = new Map();

  rounds.forEach((round, roundIndex) => {
    const x = leftPad + roundIndex * (matchW + gapX);

    const label = document.createElement("div");
    label.className = "double-tree-round-label";
    label.textContent = round.title;
    label.style.left = `${x}px`;
    label.style.top = `4px`;
    label.style.width = `${matchW}px`;
    root.appendChild(label);

    if(fixedBar){
      const fixedLabel = document.createElement("div");
      fixedLabel.className = "double-fixed-round-label";
      fixedLabel.textContent = round.title;
      fixedLabel.style.left = `${x}px`;
      fixedLabel.style.width = `${matchW}px`;
      fixedBar.appendChild(fixedLabel);
    }

    const matches = round.matches || [];
    const span = Math.max(1, Math.pow(2, roundIndex));
    matches.forEach((match, matchIndex) => {
      let y;
      if(isFinal){
        y = topPad + matchIndex * (matchH + gapY);
      }else{
        const groupTop = matchIndex * span * (matchH + gapY);
        const groupHeight = span * matchH + Math.max(0, span - 1) * gapY;
        y = topPad + groupTop + groupHeight / 2 - matchH / 2;
      }
      addDoubleTreeMatch(root, match, x, y, matchW);
      pos.set(match.id, {x, y, centerX:x + matchW / 2, centerY:y + matchH / 2});
    });
  });

  for(let r = 0; r < rounds.length - 1; r++){
    const from = rounds[r].matches || [];
    const to = rounds[r + 1].matches || [];
    from.forEach((match, index) => {
      const next = to[Math.floor(index / 2)];
      if(!next) return;
      drawDoubleTreeConnector(svg, pos, match.id, next.id, matchW, Boolean(match.winnerId));
    });
  }
}

  const p2Class = !match.player2Id ? "empty" : (match.winnerId === match.player2Id ? "win" : (match.winnerId ? "loser" : ""));
  const bye1 = match.isBye && match.player1Id && !match.player2Id ? `<span class="seed-badge">シード</span>` : "";
  const card = document.createElement("div");
  card.className = "double-tree-match";
  card.style.left = `${x}px`;
  card.style.top = `${y}px`;
  card.style.width = `${matchW}px`;
  card.innerHTML = `
    <div class="double-tree-slot ${p1Class}" data-match="${match.id}" data-player="${match.player1Id || ""}">
      <span class="double-tree-name">${p1 ? escapeHtml(p1) : "空き"}</span>${bye1}
    </div>
    <div class="double-tree-slot ${p2Class}" data-match="${match.id}" data-player="${match.player2Id || ""}">
      <span class="double-tree-name">${p2 ? escapeHtml(p2) : "空き"}</span>
    </div>`;
  root.appendChild(card);
}
function drawDoubleTreeConnector(svg, pos, fromId, toId, matchW, active){
  const a = pos.get(fromId);
  const b = pos.get(toId);
  if(!a || !b) return;
  const startX = a.x + matchW;
  const startY = a.centerY;
  const endX = b.x;
  const endY = b.centerY;
  const midX = startX + Math.max(24, (endX - startX) / 2);
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("class", `double-tree-line ${active ? "win" : ""}`);
  path.setAttribute("d", `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`);
  svg.appendChild(path);
}

function renderDouble(){
  const pageScroll = capturePageScroll();
  ensureDoubleState();
  const isAdmin = currentMode === "admin";
  $("doubleAdminPanel").classList.toggle("hidden", !isAdmin);
  $("doubleView").classList.toggle("view-only", !isAdmin);
  $("mainTitle").textContent = currentTournament.title + "｜ダブル";

  $("doubleStatusText").textContent = `登録数：${currentTournament.participants.length}/${MAX_TEAMS} / 状態：${currentTournament.status || "開催中"}`;
  $("doubleBuildBtn").disabled = currentTournament.participants.length < 2;
  $("doubleResetBtn").disabled = !currentTournament.created;
  renderDoubleParticipants();
  renderDoubleStatusList();
  renderDoubleDiagram();

  const champ = doubleChampion();
  const champBox = $("doubleChampion");
  if(champ){
    champBox.classList.remove("hidden");
    champBox.innerHTML = `優勝：<strong>${escapeHtml(champ.name)}</strong>`;
  }else{
    champBox.classList.add("hidden");
    champBox.innerHTML = "";
  }
}

function syncSingleStickyScrollBar(){
  const control = $("singleScrollControl");
  const range = $("singleScrollRange");
  const bracket = $("bracket");
  const shell = bracket ? bracket.closest(".bracket-shell") : null;
  const shouldShow = Boolean(
    shell &&
    bracket &&
    control &&
    range &&
    currentTournament &&
    currentTournament.type === "single" &&
    currentMode !== "hub" &&
    currentTournament.created
  );

  if(!shouldShow){
    if(control) control.classList.add("hidden");
    document.body.classList.remove("single-sticky-scroll-active");
    return;
  }

  const bracketStyleWidth = parseInt(bracket.style.width || "0", 10) || 0;
  const cssVarWidth = parseInt(bracket.style.props?.["--singleScrollWidth"] || bracket.style.getPropertyValue?.("--singleScrollWidth") || "0", 10) || 0;
  const realWidth = Math.max(shell.scrollWidth || 0, bracket.scrollWidth || 0, bracketStyleWidth, cssVarWidth, shell.clientWidth + 520);
  const maxLeft = Math.max(0, realWidth - shell.clientWidth);

  document.body.classList.add("single-sticky-scroll-active");
  control.classList.remove("hidden");
  control.style.display = "flex";
  range.max = String(maxLeft);
  range.value = String(Math.min(Math.max(0, shell.scrollLeft), maxLeft));
}
function bindSingleStickyScrollBar(){
  const control = $("singleScrollControl");
  const range = $("singleScrollRange");
  const leftBtn = $("singleScrollLeftBtn");
  const rightBtn = $("singleScrollRightBtn");
  const bracket = $("bracket");
  const shell = bracket ? bracket.closest(".bracket-shell") : null;
  if(!control || !range || !shell) return;

  if(control.dataset.bound !== "1"){
    control.dataset.bound = "1";
    range.addEventListener("input", () => {
      const currentShell = $("bracket") ? $("bracket").closest(".bracket-shell") : null;
      if(!currentShell) return;
      currentShell.scrollLeft = Number(range.value || 0);
      syncSingleStickyScrollBar();
    });
    if(leftBtn){
      leftBtn.addEventListener("click", () => {
        const currentShell = $("bracket") ? $("bracket").closest(".bracket-shell") : null;
        if(!currentShell) return;
        currentShell.scrollLeft = Math.max(0, currentShell.scrollLeft - 280);
        syncSingleStickyScrollBar();
      });
    }
    if(rightBtn){
      rightBtn.addEventListener("click", () => {
        const currentShell = $("bracket") ? $("bracket").closest(".bracket-shell") : null;
        if(!currentShell) return;
        currentShell.scrollLeft = currentShell.scrollLeft + 280;
        syncSingleStickyScrollBar();
      });
    }
  }

  if(shell.dataset.stickyBound !== "1"){
    shell.dataset.stickyBound = "1";
    shell.addEventListener("scroll", () => {
      syncSingleStickyScrollBar();
    });
  }
}
function fitBracketToShell(root, shell, outerWidth, outerHeight, keepScrollLeft = 0, keepScrollTop = 0){
  if(!root || !shell || !outerWidth || !outerHeight) return;
  // シングルトーナメントは縮小表示せず、同じ枠内で上下左右スクロールさせる。
  root.style.transform = "";
  root.style.width = `${outerWidth}px`;
  root.style.minWidth = `${outerWidth}px`;
  root.style.height = `${outerHeight}px`;

  const maxLeft = Math.max(0, shell.scrollWidth - shell.clientWidth);
  const maxTop = Math.max(0, shell.scrollHeight - shell.clientHeight);
  shell.scrollLeft = Math.min(Math.max(0, keepScrollLeft), maxLeft);
  shell.scrollTop = Math.min(Math.max(0, keepScrollTop), maxTop);
}

function capturePageScroll(){
  return {
    x: window.scrollX || window.pageXOffset || 0,
    y: window.scrollY || window.pageYOffset || 0
  };
}
function restorePageScroll(pos){
  if(!pos) return;
  requestAnimationFrame(() => {
    window.scrollTo(pos.x, pos.y);
  });
}
function renderSingle(){
  const pageScroll = capturePageScroll();
  const isAdmin = currentMode === "admin";
  $("adminPanel").classList.toggle("hidden", !isAdmin);
  $("singleView").classList.toggle("view-only", !isAdmin);
  renderParticipants();
  renderStatus();
  renderBracket();
  restorePageScroll(pageScroll);
}

function init(){
  store = loadStore();
  initFirebaseSync();
  purgeExpiredTournaments();
  const params = getHashParams();
  const id = params.get("id");
  const mode = params.get("mode") || "view";
  if(id) openTournament(id, mode);
  else showHub();
}

$("createDoubleBtn").onclick = () => createTournament("double");
$("hubBtn").onclick = showHub;
$("addBtn").onclick = addParticipant;
$("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") addParticipant(); });
$("buildBtn").onclick = buildTournament;
$("resetResultsBtn").onclick = resetResults;
$("shuffleBtn").onclick = shuffleTournament;
$("deleteBtn").onclick = deleteTournament;
$("extendDeleteBtn").onclick = extendAutoDelete;
$("doubleAddBtn").onclick = doubleAddParticipant;
$("doubleNameInput").addEventListener("keydown", e => { if(e.key === "Enter") doubleAddParticipant(); });
$("doubleBuildBtn").onclick = doubleBuildTournament;
$("doubleResetBtn").onclick = () => { if(confirm("ダブルの勝敗をすべてリセットしますか？")) resetDoubleState(true); };
$("doubleShuffleBtn").onclick = doubleShuffleTournament;
$("doubleExtendDeleteBtn").onclick = extendAutoDelete;
$("doubleDeleteBtn").onclick = deleteTournament;
$("doubleDeleteBtn").onclick = deleteTournament;
window.addEventListener("hashchange", init);
document.addEventListener("wheel", (event) => {
  const shell = event.target.closest ? event.target.closest(".bracket-shell") : null;
  if(!shell) return;
  if(Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
  if(event.shiftKey){
    shell.scrollLeft += event.deltaY;
    event.preventDefault();
  }
}, {passive:false});
document.addEventListener("click", (event) => {
  const button = event.target.closest ? event.target.closest("button") : null;
  if(button && !button.type) button.type = "button";
});
window.addEventListener("resize", () => {
  if(currentTournament && currentTournament.type === "single") renderBracket();
  syncSingleStickyScrollBar();
});
setInterval(() => {
  const openId = currentTournament ? currentTournament.id : null;
  purgeExpiredTournaments();
  if(openId && !store.tournaments.some(t => t.id === openId && t.status !== "削除")){
    alert("このトーナメントは作成から48時間が経過したため完全削除されました。");
    showHub();
  }else if(currentMode === "hub"){
    renderHub();
  }else if(currentTournament && currentMode === "admin"){
    if(currentTournament.type === "double") renderAdminAutoDeleteBadge("headerAutoDeleteBadge");
    else renderAdminAutoDeleteBadge("headerAutoDeleteBadge");
  }
}, 60 * 1000);
init();
</script>
