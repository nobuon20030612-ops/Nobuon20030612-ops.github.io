<!doctype html>
<html lang="ja">
<head>

<title>鎮魂符</title>
<style>
:root {
  --bg:#070909;
  --panel:rgba(10,13,12,.78);
  --line:rgba(172,255,65,.22);
  --green:#83ff34;
  --green2:#37ff89;
  --cyan:#56eaff;
  --gold:#f4d987;
  --red:#ff5b78;
  --purple:#d78cff;

}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; background:#050706; color:#eee; font-family:"Yu Mincho","Hiragino Mincho ProN","Yu Gothic",Meiryo,serif; }
body { overflow:auto; }
body::before {
  content:""; position:fixed; inset:0; z-index:-3;
  background:
    radial-gradient(circle at 20% 18%, rgba(86,234,255,.11), transparent 34%),
    radial-gradient(circle at 76% 24%, rgba(133,255,52,.10), transparent 30%),
    linear-gradient(90deg, rgba(18,20,15,.94), rgba(25,28,20,.78)),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="260" height="260" filter="url(%23n)" opacity=".55"/></svg>');
  background-blend-mode:screen,screen,normal,overlay;
}
body::after {
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.025), rgba(255,255,255,.025) 1px, transparent 2px, transparent 5px);
  opacity:.45;
}
.app {

  border:1px solid rgba(220,220,200,.32); border-radius:4px;
  box-shadow: inset 0 0 60px rgba(0,0,0,.8), 0 0 24px rgba(0,0,0,.6);
}
.topbar { position:absolute; left:0; right:0; top:0; height:8px; background:linear-gradient(90deg, #20251d, #b8b8a0, #1b211b); opacity:.6; }
.side { position:absolute; left:0; top:8px; bottom:0; width:clamp(360px, 22vw, 430px); padding:clamp(18px, 2.1vh, 28px) clamp(14px, 1.1vw, 20px); border-right:1px solid rgba(255,255,255,.10); }
.side-title { display:none; font-size:32px; color:#e8e8df; letter-spacing:.08em; text-shadow:0 2px 2px #000, 0 0 10px rgba(255,255,255,.14); margin-bottom:10px; }
.menu-item { display:none; font-size:29px; line-height:1.05; margin:5px 0; white-space:nowrap; color:#fffdf0; text-shadow:0 2px 1px #000, 0 0 7px rgba(255,255,255,.22); }
.menu-current {
  position:relative; color:#fff; margin-top:7px; padding:3px 0 3px 7px;

    0 0 18px rgba(100,255,40,.85),

.menu-current::before {

  background:linear-gradient(90deg, rgba(130,255,42,.88), rgba(130,255,42,.64), rgba(130,255,42,0));
  clip-path:polygon(0 14%,83% 0,100% 28%,78% 47%,100% 68%,74% 100%,0 86%);
  filter:drop-shadow(0 0 9px rgba(135,255,55,.75));
}

.index-back-btn {
  position:absolute; left:clamp(12px, 1vw, 18px); right:clamp(8px, .7vw, 14px); top:clamp(14px, 2.1vh, 28px);
  height:clamp(42px, 5vh, 58px); display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(133,255,52,.42); border-radius:8px;
  background:linear-gradient(180deg, rgba(45,82,38,.96), rgba(7,12,7,.96));
  color:#fff7d0; text-decoration:none; font-size:clamp(22px, 2.2vh, 30px); font-weight:800; letter-spacing:.08em;
  text-shadow:0 2px 2px #000, 0 0 8px rgba(244,217,135,.32);

}
.index-back-btn:hover { border-color:#baff42; box-shadow:0 0 10px rgba(186,255,66,.52), 0 0 22px rgba(86,234,255,.22), inset 0 0 14px rgba(133,255,52,.20); }
.side-total-panel {
  position:absolute; left:clamp(12px, 1vw, 18px); right:clamp(8px, .7vw, 14px); top:clamp(72px, 9.2vh, 104px);
  max-height:calc(100vh - 150px); overflow:auto; padding:clamp(12px, 1.5vh, 16px) clamp(10px, .9vw, 14px) clamp(13px, 1.6vh, 18px);

}
.side-total-title { color:#fff3b8; font-size:clamp(24px, 2.45vh, 32px); letter-spacing:.08em; text-shadow:0 2px 2px #000, 0 0 8px rgba(244,217,135,.38); border-bottom:1px solid rgba(255,255,255,.13); padding-bottom:8px; margin-bottom:10px; }
.side-total-empty, .side-total-row, .side-skill-row, .side-effect-row { font-size:clamp(20px, 2.05vh, 27px); line-height:1.34; text-shadow:0 2px 2px #000, 0 0 7px rgba(255,255,255,.16); }
.side-total-empty { color:rgba(255,255,255,.66); }
.side-total-row { display:flex; justify-content:space-between; gap:10px; white-space:nowrap; }
.side-job-head { color:#fff3b8; font-size:clamp(21px, 2.1vh, 28px); margin:12px 0 4px; padding-top:8px; border-top:1px solid rgba(255,255,255,.10); text-shadow:0 2px 2px #000, 0 0 7px rgba(244,217,135,.30); }
.side-job-head:first-of-type { border-top:0; padding-top:0; }
.side-total-row .value { color:inherit; }
.side-total-sub { color:#fff3b8; font-size:clamp(22px, 2.18vh, 29px); margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,.10); text-shadow:0 2px 2px #000, 0 0 7px rgba(244,217,135,.30); }
.side-skill-row, .side-effect-row { color:#f2f2ea; overflow-wrap:normal; word-break:keep-all; line-break:strict; margin-top:4px; padding-left:.25em; }
.side-effect-row { font-size:clamp(18px, 1.85vh, 24px); line-height:1.26; }
.side-skill-row { color:#ffffff; }
.side-effect-row { color:#dce8d8; }
.main { position:absolute; left:clamp(360px, 22vw, 430px); top:8px; bottom:0; width:clamp(520px, 42vw, 720px); border-right:1px solid rgba(255,255,255,.10); padding:clamp(8px, 1.2vh, 14px) clamp(8px, 1vw, 14px); }
.status { position:absolute; left:calc(clamp(360px, 22vw, 430px) + clamp(520px, 42vw, 720px)); top:8px; right:0; bottom:0; padding:clamp(8px, 1.2vh, 14px) clamp(18px, 2vw, 30px); display:flex; flex-direction:column; min-width:0; }
.heading { text-align:center; font-size:clamp(32px, 3.2vh, 42px); color:#fff3b8; letter-spacing:.1em; text-shadow:0 2px 2px #000, 0 0 10px rgba(244,217,135,.55), 0 0 18px rgba(255,255,255,.18); margin-bottom:clamp(5px, 1vh, 12px); }
.equip-stage { position:relative; height:min(68vh, 650px); min-height:500px; margin:0 auto; width:min(100%, 680px); }
.top-list-actions {
  height:clamp(42px, 5.2vh, 56px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:clamp(6px, .8vw, 12px);
  padding:0;
  position:relative;
  z-index:5;
}
.top-list-btn {
  position:static;
  flex:0 0 auto;
  white-space:nowrap;
}
.equip-stage.with-top-actions {
  height:calc(min(68vh, 650px) - clamp(42px, 5.2vh, 56px));
  min-height:444px;
}
.bg-lines { position:absolute; left:11%; right:8%; top:7%; bottom:8%; opacity:.45; border-radius:8px; background:repeating-linear-gradient(0deg, rgba(120,140,255,.22), rgba(120,140,255,.22) 2px, rgba(20,20,35,.08) 6px, rgba(20,20,35,.08) 9px); box-shadow:inset 0 0 38px rgba(45,60,255,.18); }
.silhouette {
  position:absolute; left:50%; top:17%; width:19%; max-width:130px; min-width:108px; height:58%; max-height:370px; min-height:310px;
  transform:translateX(-50%);
  display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 0 7px rgba(133,255,52,.95)) drop-shadow(0 0 18px rgba(70,255,70,.58)) drop-shadow(0 0 28px rgba(70,255,70,.35));
}
.silhouette::before,
.silhouette::after { content:none; }
.silhouette img { width:100%; height:100%; object-fit:contain; display:block; }
.slot {
  position:absolute; width:clamp(96px, 8.5vw, 124px); height:clamp(96px, 8.5vw, 124px); border:2px solid rgba(40,255,92,.34); background:rgba(0,0,0,.82); color:#f9ffe9; cursor:pointer; overflow:hidden;
  box-shadow:inset 0 0 14px rgba(0,0,0,.8), 0 0 6px rgba(110,255,35,.26); transition:transform .12s, border-color .12s, box-shadow .12s, filter .12s;
}
.slot:hover {
  transform:scale(1.055); border-color:#9cff25;
  box-shadow:0 0 7px #d8ff64, 0 0 18px #89ff22, 0 0 34px #47ff8c, 0 0 54px rgba(86,234,255,.72), inset 0 0 26px rgba(125,255,51,.30);
  animation:violentGlow .55s infinite alternate;
}
@keyframes violentGlow {
  from { filter:saturate(1.15) brightness(1.1); }
  to { filter:saturate(1.85) brightness(1.55); }
}
.slot .label { position:absolute; top:4px; left:5px; font-size:18px; color:#f4ffbd; text-shadow:0 0 8px rgba(143,255,37,.95), 0 2px 2px #000; }
.slot .content { position:absolute; left:4px; right:4px; bottom:6px; text-align:center; font-size:clamp(18px, 2vh, 24px); line-height:1.18; color:#ffffff; text-shadow:0 0 8px rgba(86,234,255,.7), 0 2px 2px #000, 0 0 10px rgba(255,255,255,.18); }
.slot.empty .content { color:rgba(255,255,255,.72); }
.slot[data-pos="頭"] { left:18%; top:8%; }
.slot[data-pos="胴"] { left:18%; top:29%; }
.slot[data-pos="左"] { left:18%; top:50%; }
.slot[data-pos="腕"] { left:18%; top:71%; }
.slot[data-pos="首"] { right:18%; top:8%; }
.slot[data-pos="腰"] { right:18%; top:29%; }
.slot[data-pos="右"] { right:18%; top:50%; }
.slot[data-pos="足"] { right:18%; top:71%; }
.slot-name { position:absolute; min-width:58px; height:35px; display:flex; align-items:center; justify-content:center; padding:0 8px; color:#111018; font-size:30px; font-weight:bold; background:rgba(222,218,255,.82); text-shadow:0 1px rgba(255,255,255,.7), 0 0 8px rgba(255,255,255,.28); box-shadow:0 0 10px rgba(133,255,52,.24); }
.name-head { left:2%; top:9%; } .name-body { left:2%; top:30%; } .name-left { left:2%; top:51%; } .name-arm { left:2%; top:72%; }
.name-neck { right:2%; top:9%; } .name-waist { right:2%; top:30%; } .name-right { right:2%; top:51%; } .name-foot { right:2%; top:72%; }
.status-title { display:block; flex:0 0 auto; font-size:clamp(24px, 2.6vh, 34px); color:#fff3b8; text-align:center; letter-spacing:.12em; text-shadow:0 2px 2px #000, 0 0 11px rgba(244,217,135,.52), 0 0 18px rgba(255,255,255,.16); margin-bottom:clamp(6px, 1vh, 10px); }
.status-blank { display:none; margin-top:28vh; width:clamp(96px, 8.5vw, 124px); height:clamp(96px, 8.5vw, 124px); background:#000; border:1px solid rgba(255,255,255,.16); box-shadow:inset 0 0 10px #000; }
.status-line { display:block; flex:0 0 auto; position:static; height:1px; background:rgba(255,255,255,.18); box-shadow:0 0 8px rgba(255,255,255,.10); margin-bottom:clamp(6px, 1vh, 10px); }
.status-summary { flex:0 0 auto; color:#f6f6ef; font-size:clamp(15px, 1.55vh, 20px); line-height:1.35; text-shadow:0 2px 2px #000, 0 0 8px rgba(255,255,255,.16); margin-bottom:clamp(6px, 1vh, 10px); overflow-wrap:anywhere; }
.status-summary b { color:#fff3b8; text-shadow:0 0 8px rgba(244,217,135,.45), 0 2px 2px #000; }
.status-detail-list { position:static; flex:1 1 auto; min-height:0; overflow:auto; padding-right:6px; border-top:1px solid rgba(255,255,255,.10); }
.status-empty { height:100%; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.78); font-size:clamp(22px, 2.4vh, 30px); line-height:1.55; text-align:center; text-shadow:0 2px 2px #000, 0 0 10px rgba(86,234,255,.22); border:1px solid rgba(255,255,255,.10); background:rgba(0,0,0,.22); }
.status-job-block { border-top:1px solid rgba(255,255,255,.16); padding:clamp(8px, 1.2vh, 14px) 0 clamp(10px, 1.5vh, 16px); }
.status-job-name { display:flex; align-items:center; gap:10px; color:#ffffff; font-size:clamp(21px, 2.35vh, 30px); letter-spacing:.08em; text-shadow:0 2px 2px #000, 0 0 10px rgba(255,255,255,.22), 0 0 16px rgba(133,255,52,.22); margin-bottom:clamp(4px, .7vh, 7px); }
.status-job-name::before { content:""; width:12px; height:12px; background:#c7ff3e; box-shadow:0 0 8px rgba(199,255,62,.85); }
.status-effect-row { display:grid; grid-template-columns:minmax(48px, 4.8vw) 1fr; gap:clamp(7px, .8vw, 12px); align-items:start; font-size:clamp(16px, 1.9vh, 25px); line-height:1.22; color:#f5f5ef; text-shadow:0 2px 2px #000, 0 0 7px rgba(255,255,255,.12); padding:1px 0; }
.status-effect-row .need { color:#d7d7d0; text-align:right; }

/* effect colors are defined below and shared by the top screen and modal. */
.status-detail-list::-webkit-scrollbar { width:9px; }
.status-detail-list::-webkit-scrollbar-thumb { background:rgba(199,255,62,.36); border-radius:999px; }
.total { position:absolute; left:clamp(20px, 2vw, 30px); right:clamp(20px, 2vw, 30px); bottom:clamp(16px, 2vh, 26px); min-height:52px; border:1px solid rgba(133,255,52,.34); background:rgba(0,0,0,.34); padding:10px 12px; color:#f4ffe7; text-shadow:0 0 9px rgba(133,255,52,.42), 0 2px 2px #000; }
.total b { color:#f4d987; }
.screen-actions { display:flex; align-items:center; justify-content:center; gap:clamp(16px, 2vw, 28px); }
.screen-action { min-width:clamp(150px, 13vw, 220px); border:1px solid rgba(133,255,52,.42); border-radius:8px; padding:8px 18px; font-family:"Yu Mincho","Hiragino Mincho ProN",serif; font-size:clamp(22px, 2.2vh, 30px); font-weight:800; color:#fff7d0; cursor:pointer; background:linear-gradient(180deg, rgba(45,82,38,.96), rgba(7,12,7,.96)); text-shadow:0 2px 2px #000, 0 0 8px rgba(244,217,135,.32); box-shadow:0 0 11px rgba(133,255,52,.18), inset 0 0 12px rgba(255,255,255,.04); }

.modal { width:min(1120px, 96vw); max-height:96vh; overflow:hidden; border:1px solid rgba(133,255,52,.42); background:linear-gradient(135deg, rgba(5,10,9,.98), rgba(23,22,15,.96)); border-radius:12px; box-shadow:0 0 30px rgba(133,255,52,.34), inset 0 0 35px rgba(86,234,255,.08); padding:12px; display:flex; flex-direction:column; }

.grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; min-height:0; }
.box { border:1px solid rgba(255,255,255,.13); background:rgba(0,0,0,.25); border-radius:10px; padding:9px; }

.job-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
.job-btn {
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif; font-size:clamp(18px, 2.1vh, 24px); font-weight:800; letter-spacing:.08em; color:#fff7d0; cursor:pointer;
  background:linear-gradient(180deg, rgba(52,72,49,.92), rgba(6,8,8,.92)); border:1px solid rgba(133,255,52,.35); border-radius:10px; padding:clamp(6px, .95vh, 10px) 6px;
  text-shadow:2px 3px 0 #000, 0 0 9px rgba(255,255,255,.18), 0 0 15px rgba(86,234,255,.22); box-shadow:inset 0 0 13px rgba(255,255,255,.04), 0 0 8px rgba(86,234,255,.12);
}
.job-btn:hover, .job-btn.selected { border-color:#8dff25; box-shadow:0 0 10px #c8ff62, 0 0 26px rgba(86,234,255,.55), inset 0 0 17px rgba(133,255,52,.24); transform:translateY(-1px); }

.note { color:#d8e8d1; font-size:13px; line-height:1.34; }
.selection-grid { flex:0 0 auto; }
.unlock-box { margin-top:8px; flex:1 1 auto; min-height:0; overflow:hidden; }

    0 0 30px rgba(255,255,255,0.08),
    inset 0 0 18px rgba(255,255,255,0.025);
}
/* 家臣計算機の通常入力モーダルと同じ幅 */
#nouryokuNumberModal .nouryoku-shared-digit-box{
  width:min(540px, calc(100vw - 32px));
}
.nouryoku-digit-top-close{
  position:absolute;
  top:10px;
  right:10px;
  min-width:78px;
  height:34px;
  padding:0 14px;
  border:2px solid #ff4f5f;
  border-radius:6px;
  background:#260006;
  color:#ffd0d5;
  font-size:15px;
  font-weight:900;
  line-height:30px;
  cursor:pointer;
  box-shadow:0 0 8px rgba(255,79,95,.75);
  z-index:2;
}
.nouryoku-digit-top-close:hover{
  color:#fff;
  border-color:#ff9da8;
  background:#52000d;
  box-shadow:0 0 14px rgba(255,79,95,.95);
  filter:brightness(1.15);
}
.nouryoku-digit-context{
  text-align:center;
  font-weight:900;
  line-height:1.25;
}
.nouryoku-digit-frame-name{
  font-size:27px;
  color:#fff;
  margin-bottom:6px;
}
.nouryoku-digit-row-name{
  font-size:22px;
  color:#ddd;
  margin-bottom:7px;
}
.nouryoku-digit-stat-name{
  font-size:28px;
  color:var(--nouryoku-active-color);
  text-shadow:0 0 10px currentColor;
  margin-bottom:16px;
}
.nouryoku-digit-step-grid{
  display:grid;
  grid-template-columns:repeat(4, 70px);
  justify-content:center;
  gap:12px;
  margin:4px auto 14px;
}
.nouryoku-digit-step-grid.digits-2{
  grid-template-columns:repeat(2,70px);
}
.nouryoku-digit-step-grid.digits-3{
  grid-template-columns:repeat(3,70px);
  gap:12px;
}
.nouryoku-digit-step-grid.digits-5{
  grid-template-columns:repeat(5,70px);
  gap:10px;
}
.nouryoku-digit-step-grid.digits-6{
  grid-template-columns:repeat(6,58px);
  gap:7px;
}
.nouryoku-digit-step-col{
  display:grid;
  grid-template-rows:44px 58px 44px;
  gap:6px;
  min-width:0;
}
.nouryoku-digit-arrow{
  width:100%;
  height:44px;
  padding:0;
  border:2px solid var(--nouryoku-active-color);
  border-radius:7px;
  background:#101010;
  color:var(--nouryoku-active-color);
  font-size:28px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:inset 0 0 8px rgba(255,255,255,0.035),0 0 8px var(--nouryoku-active-color);
}
.nouryoku-digit-arrow:hover:not(:disabled){
  color:#fff;
  background:#1b1b1b;
  filter:brightness(1.2);
  box-shadow:0 0 14px var(--nouryoku-active-color);
}
.nouryoku-digit-arrow:disabled{
  opacity:.28;
  cursor:default;
  filter:none;
  box-shadow:none;
}
.nouryoku-digit-input{
  width:100%;
  height:58px;
  box-sizing:border-box;
  padding:0;
  border:2px solid var(--nouryoku-active-color);
  border-radius:7px;
  outline:none;
  background:#000;
  color:var(--nouryoku-active-color);
  font-size:36px;
  font-weight:900;
  line-height:58px;
  text-align:center;
  text-shadow:0 0 9px currentColor;
  caret-color:var(--nouryoku-active-color);
  ime-mode:disabled;
}
.nouryoku-digit-input:focus{
  color:#fff;
  border-color:#fff;
  box-shadow:0 0 14px var(--nouryoku-active-color), inset 0 0 10px rgba(255,255,255,0.08);
}
.nouryoku-digit-help{
  margin:0 0 10px;
  color:#aaa;
  font-size:12px;
  line-height:1.45;
  text-align:center;
}
.nouryoku-digit-actions{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:8px;
}
.nouryoku-digit-clear-btn,
.nouryoku-digit-close-btn{
  padding:9px 18px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  border-radius:6px;
}
.nouryoku-digit-clear-btn{
  background:#111;
  color:#ddd;
  border:1px solid #666;
}
.nouryoku-digit-close-btn{
  background:#111;
  color:var(--nouryoku-active-color);
  border:2px solid var(--nouryoku-active-color);
  box-shadow:0 0 10px var(--nouryoku-active-color);
}
.nouryoku-digit-clear-btn:hover,
.nouryoku-digit-close-btn:hover{
  color:#fff;
  filter:brightness(1.2);
}

@media (max-width:620px){
  .nouryoku-shared-digit-box{padding:52px 10px 12px;}
  .nouryoku-digit-top-close{top:8px;right:8px;min-width:72px;height:32px;font-size:14px;line-height:28px;}
  .nouryoku-digit-frame-name{font-size:23px;}
  .nouryoku-digit-row-name{font-size:19px;}
  .nouryoku-digit-stat-name{font-size:24px;margin-bottom:12px;}
  .nouryoku-digit-step-grid{grid-template-columns:repeat(4, minmax(54px,64px));gap:7px;}
  .nouryoku-digit-step-grid.digits-5{grid-template-columns:repeat(5,minmax(44px,56px));gap:5px;}
  .nouryoku-digit-step-grid.digits-6{grid-template-columns:repeat(6,minmax(38px,48px));gap:4px;}
  .nouryoku-digit-input{font-size:31px;}
  .nouryoku-digit-arrow{font-size:25px;}
}

/* 数値入力：押す入力形式をやめて、いつもの入力モーダルを開く */
.digit-value-picker .digit-value-head{cursor:pointer;}
.digit-value-picker .digit-value-current{cursor:pointer;border:1px solid rgba(133,255,52,.55);border-radius:8px;padding:2px 10px;box-shadow:0 0 8px rgba(133,255,52,.25);}
.digit-value-picker .digit-value-head:hover .digit-value-current{border-color:#9cff25;box-shadow:0 0 12px rgba(133,255,52,.6);}
.digit-value-picker.value-locked .digit-value-head{cursor:default;}
.digit-value-picker.value-locked .digit-value-current{cursor:default;}
.nouryoku-digit-step-grid.digits-dec{grid-template-columns:70px 70px 26px 70px;justify-content:center;gap:12px;margin:4px auto 14px;}
.nouryoku-digit-spacer{min-width:0;}
@media (max-width:620px){.nouryoku-digit-step-grid.digits-dec{grid-template-columns:minmax(54px,64px) minmax(54px,64px) 16px minmax(54px,64px);gap:7px;}}
.navi-head { color:#ffd27a; font-size:clamp(19px, 1.95vh, 26px); margin-top:8px; text-shadow:0 2px 2px #000, 0 0 7px rgba(255,200,90,.35); }
.navi-row { color:#e8f6d8; font-size:clamp(15px, 1.55vh, 21px); line-height:1.3; margin-top:3px; padding-left:.4em; overflow-wrap:anywhere; text-shadow:0 2px 2px #000; }
</style>

function layoutSoulPanel() {

  const n = panel.querySelectorAll('.soul-row').length;
  if (!n) { panel.style.display = 'none'; return; }
  const gap = 8;
  /* 枠・人型・背景の線の一番下から、リセットの上までを使う（stage全体の下端ではなく、実際に見えている部分の下） */
  let contentBottom = 0;

<script>
(function(){
  'use strict';
  var MIN_ZOOM = 0.46;

  function viewportSize(){
    return {
      w: Math.max(320, window.innerWidth || document.documentElement.clientWidth || 0),
      h: Math.max(320, window.innerHeight || document.documentElement.clientHeight || 0)
    };
  }

  function fitMainApp(){
    var app = document.querySelector('.app');
    if (!app) return false;
    app.style.setProperty('--app-fit-zoom', '1');
    app.style.removeProperty('width');
    app.style.removeProperty('height');
    var naturalW = Math.max(1180, app.offsetWidth || 900, app.scrollWidth || 0);
    var naturalH = Math.max(app.offsetHeight || 720, app.scrollHeight || 0);
    app.style.width = naturalW + 'px';
    app.style.height = naturalH + 'px';
    naturalW = Math.max(app.offsetWidth || naturalW, app.scrollWidth || naturalW);
    naturalH = Math.max(app.offsetHeight || naturalH, app.scrollHeight || naturalH);
    app.style.width = naturalW + 'px';
    app.style.height = naturalH + 'px';
    var vp = viewportSize();
    var ideal = Math.min(1, vp.w / naturalW, vp.h / naturalH);
    var zoom = Math.max(MIN_ZOOM, ideal);
    app.style.setProperty('--app-fit-zoom', String(zoom));
    var needsScroll = ideal < MIN_ZOOM;
    /* 窓の高さが縮小後の画面より余るときは、下の余白の分だけ画面を縦に伸ばす（左右の欄が下まで長くなる） */
    var fillH = Math.floor(vp.h / zoom);
    if (fillH > naturalH) app.style.height = fillH + 'px';
    document.documentElement.classList.toggle('app-fit-scroll-needed', needsScroll);
    return needsScroll;
  }

  function fitSurface(backdropId, modalSelector, baseW, baseH, minZoom){
    var backdrop = document.getElementById(backdropId);
    var modal = backdrop && backdrop.querySelector(modalSelector);
    if (!backdrop || !modal) return;
    backdrop.classList.add('fit-backdrop');
    modal.classList.add('fit-surface');
    modal.style.setProperty('--surface-fit-zoom', '1');
    var vp = viewportSize();
    var margin = 12;
    var ideal = Math.min(1, (vp.w - margin) / baseW, (vp.h - margin) / baseH);
    if (!isFinite(ideal) || ideal <= 0) ideal = 1;
    var zoom = Math.max(minZoom, ideal);
    modal.style.setProperty('--surface-fit-zoom', String(zoom));
    backdrop.classList.toggle('fit-scroll-needed', ideal < minZoom);
  }

  function fitAll(){
    var mainNeedsScroll = fitMainApp();
    fitSurface('modalBackdrop', '.modal', 1500, 760, MIN_ZOOM);
    fitSurface('bonusListBackdrop', '.bonus-list-modal', 1500, 860, MIN_ZOOM);
    fitSurface('skillListBackdrop', '.skill-list-modal', 1500, 820, MIN_ZOOM);
    var overlayOpen = ['modalBackdrop','bonusListBackdrop','skillListBackdrop','requiemAboutBackdrop'].some(function(id){
      var el = document.getElementById(id);
      return !!(el && el.classList.contains('open'));
    });
    document.body.style.overflow = overlayOpen ? 'hidden' : (mainNeedsScroll ? 'auto' : 'hidden');
  }

  window.addEventListener('resize', fitAll, { passive:true });
  window.addEventListener('orientationchange', function(){ setTimeout(fitAll, 120); }, { passive:true });
  document.addEventListener('click', function(){ setTimeout(fitAll, 0); }, true);
  document.addEventListener('DOMContentLoaded', fitAll);
})();
</script>

  if(!event) return;

  const allowed = ["Backspace","Delete","Tab","ArrowLeft","ArrowRight","Home","End"];

function stepNouryokuNumberDigit(index,delta){
  if(!nouryokuNumberTarget) return;
  const digits = getNouryokuNumberDigits();
  const current = digits[index] || 0;
  const next = Math.max(0,Math.min(9,current + (delta > 0 ? 1 : -1)));
  if(next === current) return;
  digits[index] = next;
  applyNouryokuNumberDigits(digits);
  renderNouryokuNumberModal();
}
function setNouryokuNumberDigitInput(input,index){
  if(!input || !nouryokuNumberTarget) return;
  const t = normalizeSharedOneDigit(input.value);
  const digits = getNouryokuNumberDigits();
  digits[index] = t === "" ? 0 : Number(t);
  applyNouryokuNumberDigits(digits);
  renderNouryokuNumberModal();
  const next = document.querySelector(`#nouryokuNumberControls [data-nouryoku-number-index="${index}"]`);
  if(next){ next.focus(); try{next.select();}catch(e){} }
}
function clearNouryokuNumberValue(){
  if(!nouryokuNumberTarget) return;
  applyNouryokuNumberDigits([0,0,0]);
  closeNouryokuNumberModal();
}
document.querySelectorAll('.digit-value-picker').forEach(holder => {
  const target = holder.dataset.target;
  const head = holder.querySelector('.digit-value-head');
  if(!head) return;
  head.addEventListener('click', () => openNouryokuNumberModal(target));
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && nouryokuNumberTarget){ e.stopPropagation(); closeNouryokuNumberModal(); }
}, true);
</script>
</body>
