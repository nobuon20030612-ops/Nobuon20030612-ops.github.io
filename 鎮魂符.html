* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#050706; color:#eee; font-family:"Yu Mincho","Hiragino Mincho ProN","Yu Gothic",Meiryo,serif; }

.silhouette {

.slot {
  position:absolute; width:clamp(96px, 8.5vw, 124px); height:clamp(96px, 8.5vw, 124px); border:2px solid rgba(40,255,92,.34); background:rgba(0,0,0,.82); color:#f9ffe9; cursor:pointer; overflow:hidden;

.modal {
  width:calc(100vw - 32px) !important;
  max-width:none !important;
  height:calc(100vh - 44px) !important;
  max-height:calc(100vh - 44px) !important;
}


/* 余白活用：モーダル内の文字・数値・選択ボタン・解放表を拡大 */
.modal-head { padding-bottom:6px !important; margin-bottom:7px !important; }
.modal-title { font-size:clamp(27px, 3.0vh, 36px) !important; }
.close { font-size:18px !important; padding:7px 14px !important; }
.list-open-btn { font-size:18px !important; padding:7px 13px !important; }
.selection-grid { gap:10px !important; }
.box { padding:10px !important; }
.box h3 { margin:0 0 6px !important; font-size:clamp(21px, 2.45vh, 28px) !important; line-height:1.15 !important; }
.job-grid { gap:7px !important; }
.job-btn { font-size:clamp(18px, 2.15vh, 25px) !important; padding:clamp(6px, .9vh, 10px) 6px !important; border-radius:9px !important; }
.note { font-size:clamp(13px, 1.45vh, 16px) !important; line-height:1.22 !important; margin:7px 0 0 !important; }
.digit-value-picker { margin-top:7px !important; }
.digit-value-head { min-height:clamp(48px, 5.7vh, 66px) !important; margin-bottom:7px !important; font-size:clamp(16px, 1.7vh, 19px) !important; gap:14px !important; }
.digit-value-current { gap:7px !important; font-size:clamp(28px, 3.2vh, 38px) !important; }
.digit-current-plus { font-size:clamp(43px, 5.0vh, 60px) !important; }
.digit-current-box { width:clamp(34px, 2.55vw, 42px) !important; height:clamp(34px, 3.9vh, 44px) !important; border-radius:8px !important; font-size:clamp(22px, 2.5vh, 30px) !important; }
.digit-current-dot { font-size:clamp(44px, 5.1vh, 62px) !important; margin:0 -1px !important; }
.digit-row { gap:8px !important; }
.digit-title { font-size:clamp(14px, 1.55vh, 18px) !important; margin-bottom:4px !important; line-height:1.1 !important; }
.digit-options { grid-template-columns:repeat(5, clamp(32px, 2.2vw, 40px)) !important; gap:4px !important; }
.digit-btn { min-width:clamp(32px, 2.2vw, 40px) !important; width:clamp(32px, 2.2vw, 40px) !important; height:clamp(29px, 3.1vh, 36px) !important; border-radius:7px !important; padding:2px 0 !important; font-size:clamp(17px, 1.95vh, 23px) !important; line-height:1 !important; }
.unlock-box { margin-top:8px !important; padding:8px 9px !important; }
.unlock-box h3 { margin:0 0 5px !important; font-size:clamp(20px, 2.2vh, 26px) !important; line-height:1.1 !important; }
#unlockPreview { font-size:clamp(13px, 1.45vh, 16px) !important; }
.unlock-table { font-size:clamp(12px, 1.48vh, 16px) !important; line-height:1.09 !important; }
.unlock-table th, .unlock-table td { padding:2px 5px !important; line-height:1.09 !important; }
.actions { margin-top:8px !important; }
.action { padding:8px 18px !important; font-size:clamp(18px, 2vh, 24px) !important; border-radius:9px !important; }



/* 解放表の下切れ対策：不要な説明文と見出しだけ非表示にして上へ詰める */
.selection-grid .box > p.note,
.selection-grid .box > div.note {
  display:none !important;
}
.unlock-box h3 {
  display:none !important;
}
.unlock-box {
  margin-top:4px !important;
  padding-top:6px !important;
}
.unlock-box #unlockPreview {
  margin-top:0 !important;
}



/* 安全な自動縮小：通常は基準サイズで表示し、画面に入りきらない時だけ全体を縮小 */
.modal-backdrop.open {
  overflow:hidden !important;
  padding:0 !important;
}
.modal.auto-fit-modal {
  width:var(--modal-fit-width, 1500px) !important;
  height:var(--modal-fit-height, 760px) !important;
  max-width:none !important;
  max-height:none !important;
  transform:scale(var(--modal-fit-scale, 1)) !important;
  transform-origin:center center !important;
  flex:0 0 auto !important;
}
@media (max-width:900px) {
  .modal.auto-fit-modal {
    width:var(--modal-fit-width, 900px) !important;
    height:var(--modal-fit-height, 720px) !important;
  }
}


/* 解放欄の文字拡大と下余白削減：解放表だけを広げて余白を使う */
.modal.auto-fit-modal .unlock-box {
  flex:1 1 auto !important;
  min-height:0 !important;
  display:flex !important;
  flex-direction:column !important;
  margin-top:7px !important;
  padding:7px 9px !important;
}
.modal.auto-fit-modal .unlock-box #unlockPreview {
  flex:1 1 auto !important;
  min-height:0 !important;
  display:flex !important;
  overflow:visible !important;
  padding-right:0 !important;
}
.modal.auto-fit-modal .unlock-table {
  height:100% !important;
  font-size:clamp(15px, 1.78vh, 19px) !important;
  line-height:1.14 !important;
}
.modal.auto-fit-modal .unlock-table th,
.modal.auto-fit-modal .unlock-table td {
  padding:3px 7px !important;
  line-height:1.14 !important;
}
.modal.auto-fit-modal .actions {
  margin-top:7px !important;
  flex:0 0 auto !important;
}

/* 小さい画面用：背景側ではなく、モーダル内の内容だけをスクロール可能にする */
@media (max-height:760px), (max-width:900px) {
  .modal-backdrop.open {
    overflow:hidden !important;
    align-items:center !important;
    justify-content:center !important;
    padding:0 !important;
  }
  .modal.auto-fit-modal {
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }
  .modal.auto-fit-modal::-webkit-scrollbar { width:8px; }
  .modal.auto-fit-modal::-webkit-scrollbar-thumb { background:rgba(199,255,62,.36); border-radius:999px; }
}


/* 現在合計の位置復旧：unlockPreview内を縦並びに戻し、現在合計を表の上へ固定 */
.modal.auto-fit-modal .unlock-box #unlockPreview {
  display:block !important;
}
.modal.auto-fit-modal .unlock-box #unlockPreview > .note {
  display:block !important;
  margin:0 0 4px !important;
  flex:none !important;
}
.modal.auto-fit-modal .unlock-box #unlockPreview > .unlock-table {
  width:100% !important;
}


/* 枠内表示の重なり防止：登録内容が2段でも枠内に収める */
.slot .content {
  top:clamp(8px, 1.1vh, 14px) !important;
  bottom:clamp(7px, .9vh, 10px) !important;
  gap:clamp(1px, .22vh, 3px) !important;
  overflow:hidden !important;
}
.slot-line {
  flex:1 1 0 !important;
  min-height:0 !important;
  max-height:50% !important;
  justify-content:center !important;
  overflow:hidden !important;
}
.slot-job {
  font-size:clamp(14px, 1.45vh, 18px) !important;
  line-height:1.02 !important;
}
.slot-value {
  font-size:clamp(22px, 2.35vh, 29px) !important;
  line-height:1.0 !important;
}



/* 枠同士の被り防止：枠の高さと枠内表示だけを調整して上下の隙間を確保 */
.slot {
  height:clamp(82px, 7.4vw, 108px) !important;
}
.slot .content {
  top:clamp(4px, .65vh, 8px) !important;
  bottom:clamp(4px, .65vh, 8px) !important;
  gap:0 !important;
  overflow:hidden !important;
}
.slot-line {
  flex:0 1 auto !important;
  max-height:calc(50% - 1px) !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
}
.slot-job {
  font-size:clamp(12px, 1.25vh, 16px) !important;
  line-height:1 !important;
}
.slot-value {
  font-size:clamp(18px, 1.95vh, 24px) !important;
  line-height:.96 !important;
}



/* 鎮魂符一覧モーダルのみ拡大（その他レイアウト・機能は変更なし） */
.bonus-list-backdrop.open {
  align-items:flex-start !important;
  justify-content:center !important;
  padding:4px !important;
}
.bonus-list-modal {
  width:calc(100vw - 8px) !important;
  max-width:none !important;
  max-height:calc(100vh - 8px) !important;
  padding:12px !important;
}
.bonus-list-head {
  padding-bottom:10px !important;
  margin-bottom:2px !important;
}
.bonus-list-title {
  font-size:clamp(30px, 3.4vh, 42px) !important;
}
.bonus-list-modal .close {
  font-size:clamp(22px, 2.45vh, 30px) !important;
  padding:10px 18px !important;
}
.bonus-table-wrap {
  padding-top:10px !important;
}
.bonus-table {
  font-size:clamp(16px, 1.9vh, 22px) !important;
  line-height:1.24 !important;
}
.bonus-table th,
.bonus-table td {
  padding:6px 8px !important;
  line-height:1.24 !important;
}
.bonus-table thead th {
  font-size:clamp(17px, 2.05vh, 24px) !important;
}
.bonus-table .bonus-cell {
  line-height:1.25 !important;
}

/* 鎮魂符についてモーダル（添付画像を原文のまま表示） */
.requiem-about-backdrop { display:none; position:fixed; inset:0; z-index:37; background:rgba(0,0,0,.76); align-items:center; justify-content:center; padding:10px; }
.requiem-about-backdrop.open { display:flex; }
.requiem-about-modal {
  width:min(1600px, calc(100vw - 20px));
  max-height:calc(100vh - 20px);
  overflow:hidden;
  border:1px solid rgba(133,255,52,.48);
  background:linear-gradient(135deg, rgba(4,8,7,.99), rgba(18,18,12,.98));
  border-radius:12px;
  box-shadow:0 0 30px rgba(133,255,52,.34), inset 0 0 35px rgba(86,234,255,.08);
  padding:10px;
  display:flex;
  flex-direction:column;
}
.requiem-about-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:7px; border-bottom:1px solid rgba(255,255,255,.13); }
.requiem-about-title { font-size:clamp(22px, 2.7vh, 32px); color:#f4d987; letter-spacing:.06em; text-shadow:0 2px #000, 0 0 12px rgba(244,217,135,.38); }
.requiem-about-image-wrap { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding-top:8px; overflow:auto; }
.requiem-about-image { display:block; width:100%; height:auto; max-height:calc(100vh - 100px); object-fit:contain; }

</style>
</head>

const SKILL_LIST_DATA = [

  {job:'薬師', name:'上騰命癒', need:'最大気合の約１５％', desc:'選択した味方１人を大回復。味方全体の生命力を回復し、物理・術耐性と生命力の最大値を上昇させる。'},

const STORAGE_KEY = 'chinkonfu-equips-v1';
const POSITIONS = ['頭','胴','左','腕','足','右','腰','首'];
const state = { equips: {}, activePos: null, draft: null };
for (const pos of POSITIONS) state.equips[pos] = null;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function normalizeValue(value, fallback=0) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(0, Math.min(200, Math.round(n * 10) / 10));
}
function formatValue(value) {
  const n = normalizeValue(value, 0);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function emptyEquip() { return { primary:'', primaryLevel:0, addons:['','',''], addonLevels:[0,0,0], level:0 }; }
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    for (const pos of POSITIONS) {
      const v = saved[pos];
      if (v && typeof v === 'object') {
        const addons = Array.isArray(v.addons) ? [v.addons[0]||'', v.addons[1]||'', v.addons[2]||''] : ['', '', ''];
        const oldLevel = Number(v.level) || 0;
        const addonLevels = Array.isArray(v.addonLevels) ? [normalizeValue(v.addonLevels[0], 0), normalizeValue(v.addonLevels[1], 0), normalizeValue(v.addonLevels[2], 0)] : [oldLevel, oldLevel, oldLevel];
        state.equips[pos] = { primary:v.primary || '', primaryLevel:normalizeValue(v.primaryLevel, oldLevel), addons:addons, addonLevels:addonLevels, level:oldLevel };
      }
    }
  } catch(e) { console.warn('鎮魂符の保存データ読込に失敗しました', e); }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.equips)); }
function totalLevel() { return POSITIONS.reduce((sum,pos)=>sum + ((state.equips[pos] && Number(state.equips[pos].level)) || 0), 0); }
function classifyEffect(text) {
  if (!text) return '';
  if (text.includes('生命')) return 'effect-life';
  if (text.includes('気合')) return 'effect-ki';
  if (text.includes('腕力')) return 'effect-str';
  if (text.includes('耐久')) return 'effect-dur';
  if (text.includes('器用')) return 'effect-dex';
  if (text.includes('知力')) return 'effect-int';
  if (text.includes('魅力')) return 'effect-cha';
  if (text.includes('四象')) return 'effect-four';
  return '';
}

function normalizeEffectText(text) {
  const s = String(text || '').trim();
  if (!s) return '';
  const skill = s.match(/^技能[：:](.+)$/);
  if (skill) return `技能「${skill[1]}」解放`;
  const stat = s.match(/^(生命力?|気合|腕力|耐久力|器用さ|知力|魅力|四象)(\d+)$/);
  if (stat) {
    const name = stat[1] === '生命' ? '生命力' : stat[1];
    return `${name}+${stat[2]}`;
  }
  return s;
}
function registeredJobs() {
  return registeredJobLevels().map(item => item.job);
}
function registeredJobLevels() {
  const levels = new Map();
  for (const pos of POSITIONS) {
    const eq = state.equips[pos];
    if (!eq || !eq.primary) continue;
    const fallback = Number(eq.level) || 0;
    const primaryLevel = Number(eq.primaryLevel);
    addJobLevel(levels, eq.primary, Number.isFinite(primaryLevel) ? primaryLevel : fallback);
    const addonLevels = Array.isArray(eq.addonLevels) ? eq.addonLevels : [fallback, fallback, fallback];
    (eq.addons || []).forEach((job, idx) => {
      if (!job) return;
      addJobLevel(levels, job, normalizeValue(addonLevels[idx], 0));
    });
  }
  return Array.from(levels, ([job, level]) => ({ job, level: Math.min(level, 200) }));
}
function addJobLevel(levels, job, level) {
  if (!job) return;
  levels.set(job, (levels.get(job) || 0) + normalizeValue(level, 0));
}
function collectActiveEffects(jobLevels) {
  const stats = new Map();
  const skills = [];
  const effects = [];
  const statName = name => name === '生命' ? '生命力' : name;
  for (const item of jobLevels) {
    const job = item.job;
    const level = Number(item.level) || 0;
    for (const r of CHINKONFU_DATA.unlocks) {
      if (level < r.level) continue;
      const raw = String(r[job] || '').trim();
      if (!raw) continue;
      const stat = raw.match(/^(生命力?|気合|腕力|耐久力|器用さ|知力|魅力|四象)(\d+)$/);
      if (stat) {
        const name = statName(stat[1]);
        const current = stats.get(name) || { value:0, raw:name };
        current.value += Number(stat[2]) || 0;
        current.raw = raw;
        stats.set(name, current);
      } else if (Number(r.level) === 100) {
        skills.push({ job, text: normalizeEffectText(raw), raw });
      } else {
        effects.push({ job, text: normalizeEffectText(raw), raw });
      }
    }
  }
  return { stats, skills, effects };
}
function renderSideTotalPanel(jobLevels) {
  const panel = $('#sideTotalEffects');
  if (!panel) return;
  if (!jobLevels.length) {
    panel.innerHTML = '<div class="side-total-title">合計一覧</div><div class="side-total-empty">鎮魂符を登録すると表示します</div>';
    return;
  }
  const active = collectActiveEffects(jobLevels);
  let html = '<div class="side-total-title">合計一覧</div>';
  if (!active.stats.size && !active.skills.length && !active.effects.length) {
    html += '<div class="side-total-empty">+25以上で有効内容を表示します</div>';
    panel.innerHTML = html;
    return;
  }
  if (active.stats.size) {
    html += '<div class="side-total-sub">ステータス</div>';
    for (const [name, item] of active.stats) {
      html += `<div class="side-total-row ${classifyEffect(item.raw)}"><span>${escapeHtml(name)}</span><span class="value">+${item.value}</span></div>`;
    }
  }
  if (active.skills.length) {
    html += '<div class="side-total-sub">技能</div>';
    for (const skill of active.skills) {
      html += `<div class="side-skill-row">${escapeHtml(skill.job)}：${escapeHtml(skill.text)}</div>`;
    }
  }
  if (active.effects.length) {
    html += '<div class="side-total-sub">効果</div>';
    for (const effect of active.effects) {
      html += `<div class="side-effect-row">${escapeHtml(effect.job)}：${escapeHtml(effect.text)}</div>`;
    }
  }
  panel.innerHTML = html;
}
function renderStatusPanel() {
  const summary = $('#statusSummary');
  const details = $('#statusDetails');
  if (!summary || !details) return;
  const slots = POSITIONS.filter(pos => state.equips[pos] && state.equips[pos].primary).length;
  const jobLevels = registeredJobLevels();
  summary.innerHTML = `<b>登録枠：</b>${slots} / 8<br><b>登録：</b>${jobLevels.length ? jobLevels.map(item => `${escapeHtml(item.job)} +${formatValue(item.level)}`).join(' / ') : 'なし'}`;
  renderSideTotalPanel(jobLevels);
  if (!jobLevels.length) {
    details.innerHTML = '<div class="status-empty">鎮魂符を登録すると<br>解放内容を表示します</div>';
    return;
  }
  let html = '';
  for (const item of jobLevels) {
    const job = item.job;
    const level = Number(item.level) || 0;
    html += `<div class="status-job-block"><div class="status-job-name">${escapeHtml(job)}</div>`;
    for (const r of CHINKONFU_DATA.unlocks) {
      const reached = level >= r.level;
      const raw = r[job] || '';
      html += `<div class="status-effect-row ${reached ? 'reached' : 'unreached'}"><div class="need">+${r.level}</div><div class="effect ${classifyEffect(raw)}">${escapeHtml(normalizeEffectText(raw))}</div></div>`;
    }
    html += '</div>';
  }
  details.innerHTML = html;
}
function renderSlots() {
  for (const pos of POSITIONS) {
    const btn = $(`.slot[data-pos="${pos}"]`);
    const content = $('.content', btn);
    const eq = state.equips[pos];
    if (!eq || !eq.primary) {
      btn.classList.add('empty');
      content.textContent = '空欄';
    } else {
      btn.classList.remove('empty');
      const fallback = Number(eq.level) || 0;
      const primaryLevel = normalizeValue(eq.primaryLevel, fallback);
      const addonLevels = Array.isArray(eq.addonLevels) ? eq.addonLevels : [fallback, fallback, fallback];
      const lines = [{ job:eq.primary, value:primaryLevel }];
      (eq.addons || []).forEach((job, idx) => {
        if (job) lines.push({ job, value:normalizeValue(addonLevels[idx], 0) });
      });
      content.innerHTML = lines.map(line => `<strong class="slot-line"><span class="slot-job">${escapeHtml(line.job)}</span><span class="slot-value">＋${formatValue(line.value)}</span></strong>`).join('');
    }
  }
  renderStatusPanel();
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function buildJobButtons(containerId, kind) {
  const wrap = $('#' + containerId);
  wrap.innerHTML = '';
  for (const job of CHINKONFU_DATA.jobs) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'job-btn'; b.textContent = job; b.dataset.job = job; b.dataset.kind = kind;
    b.addEventListener('click', () => selectJob(kind, job));
    wrap.appendChild(b);
  }
}
function buildDigitPickerOptions() {
  $$('.digit-options').forEach(wrap => {
    const place = Number(wrap.dataset.place) || 1;
    const target = wrap.dataset.target || '';
    const maxDigit = 9;
    wrap.innerHTML = '';
    for (let digit = 0; digit <= maxDigit; digit++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'digit-btn';
      b.textContent = String(digit);
      b.dataset.target = target;
      b.dataset.place = String(place);
      b.dataset.digit = String(digit);
      b.addEventListener('click', () => setDraftDigit(target, place, digit));
      wrap.appendChild(b);
    }
  });
}
function getValueDigits(value) {
  const safeValue = Math.max(0, Math.min(99.9, normalizeValue(value, 0)));
  const scaled = Math.round(safeValue * 10);
  return {
    10: Math.floor(scaled / 100),
    1: Math.floor((scaled % 100) / 10),
    0.1: scaled % 10
  };
}
function setDraftDigit(target, place, digit) {
  if (!state.draft) return;
  const digits = getValueDigits(getDraftValue(target));
  digits[place] = Number(digit) || 0;
  let nextValue = digits[10] * 10 + digits[1] + (digits[0.1] / 10);
  setDraftValue(target, nextValue);
}
function syncDigitPicker(target, value) {
  const digits = getValueDigits(value);
  $$('.digit-btn').forEach(btn => {
    if (btn.dataset.target !== target) return;
    const place = Number(btn.dataset.place) || 1;
    const digit = Number(btn.dataset.digit) || 0;
    btn.classList.toggle('selected', digits[place] === digit);
  });
}
function setDraftValue(target, value) {
  if (!state.draft) return;
  const safeValue = normalizeValue(value, 0);
  if (!Array.isArray(state.draft.addonLevels)) state.draft.addonLevels = [0,0,0];
  if (target === 'primary') {
    state.draft.primaryLevel = safeValue;
    state.draft.level = safeValue;
  } else if (target === 'addon1') {
    state.draft.addonLevels[0] = safeValue;
  }
  renderDraft();
}
function getDraftValue(target) {
  if (!state.draft) return 0;
  const fallback = normalizeValue(state.draft.level, 0);
  if (target === 'primary') return normalizeValue(state.draft.primaryLevel, fallback);
  if (!Array.isArray(state.draft.addonLevels)) state.draft.addonLevels = [0,0,0];
  if (target === 'addon1') return normalizeValue(state.draft.addonLevels[0], 0);
  return 0;
}
function buildValueSelects() {
  buildDigitPickerOptions();
}
function selectJob(kind, job) {
  if (!state.draft) return;
  if (kind === 'primary') {
    state.draft.primary = job;
    state.draft.addons = state.draft.addons.map(a => a === job ? '' : a);
  } else if (kind === 'addon1') {
    state.draft.addons[0] = state.draft.addons[0] === job ? '' : job;
    if (state.draft.addons[0] === state.draft.primary) state.draft.addons[0] = '';
  }
  renderDraft();
}

function renderDigitValueHtml(value) {
  const digits = getValueDigits(value);
  return `<span class="digit-current-plus">＋</span><span class="digit-current-box place-10">${digits[10]}</span><span class="digit-current-box place-1">${digits[1]}</span><span class="digit-current-dot">.</span><span class="digit-current-box place-decimal">${digits[0.1]}</span>`;
}
function renderDraft() {
  const d = state.draft || emptyEquip();
  const fallback = normalizeValue(d.level, 0);
  if (!Array.isArray(d.addonLevels)) d.addonLevels = [fallback, fallback, fallback];
  d.primaryLevel = normalizeValue(d.primaryLevel, fallback);
  const addon1Level = normalizeValue(d.addonLevels[0], 0);
  syncDigitPicker('primary', d.primaryLevel);
  syncDigitPicker('addon1', addon1Level);
  const primaryManual = $('#primaryManualValue'); if (primaryManual) primaryManual.innerHTML = renderDigitValueHtml(d.primaryLevel);
  const addon1Manual = $('#addon1ManualValue'); if (addon1Manual) addon1Manual.innerHTML = renderDigitValueHtml(addon1Level);
  for (const btn of $$('.job-btn')) {
    const kind = btn.dataset.kind, job = btn.dataset.job;
    btn.disabled = false; btn.classList.remove('selected');
    if (kind === 'primary' && d.primary === job) btn.classList.add('selected');
    if (kind === 'addon1') {
      if (d.primary === job) btn.disabled = true;
      if (d.addons[0] === job) btn.classList.add('selected');
    }
    if (kind === 'addon2' || kind === 'addon3') btn.disabled = true;
  }
  renderUnlockPreview();
}
function draftAdjustedJobLevels() {
  const levels = new Map();
  for (const pos of POSITIONS) {
    const eq = (pos === state.activePos && state.draft) ? state.draft : state.equips[pos];
    if (!eq || !eq.primary) continue;
    const fallback = Number(eq.level) || 0;
    addJobLevel(levels, eq.primary, normalizeValue(eq.primaryLevel, fallback));
    const addonLevels = Array.isArray(eq.addonLevels) ? eq.addonLevels : [fallback, fallback, fallback];
    (eq.addons || []).forEach((job, idx) => {
      if (!job) return;
      addJobLevel(levels, job, normalizeValue(addonLevels[idx], 0));
    });
  }
  return Array.from(levels, ([job, level]) => ({ job, level: Math.min(level, 200) }));
}
function renderUnlockPreview() {
  const d = state.draft || emptyEquip();
  const jobLevels = draftAdjustedJobLevels();
  if (!jobLevels.length && !d.primary) { $('#unlockPreview').innerHTML = '<div class="note">メインを選択すると、+25〜+200で解放される内容を表示します。</div>'; return; }
  if (!jobLevels.length) { $('#unlockPreview').innerHTML = '<div class="note">現在の合計対象はありません。</div>'; return; }
  let html = `<div class="note">現在合計：${jobLevels.map(item => `${escapeHtml(item.job)} +${formatValue(item.level)}`).join(' / ')}</div>`;
  html += '<table class="unlock-table"><thead><tr><th>必要値</th>' + jobLevels.map(item=>`<th>${escapeHtml(item.job)} +${formatValue(item.level)}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of CHINKONFU_DATA.unlocks) {
    html += `<tr><th>+${r.level}</th>` + jobLevels.map(item => {
      const reached = Number(item.level) >= r.level;
      const raw = r[item.job] || '';
      return `<td class="${reached ? 'reached' : 'unreached'} ${classifyEffect(raw)}">${displayEffectHtml(raw)}</td>`;
    }).join('') + '</tr>';
  }
  html += '</tbody></table>';
  $('#unlockPreview').innerHTML = html;
}
function openModal(pos) {
  state.activePos = pos;
  const current = state.equips[pos];
  state.draft = current ? JSON.parse(JSON.stringify(current)) : emptyEquip();
  $('#modalTitle').textContent = `鎮魂符選択：${pos}`;
  $('#modalBackdrop').classList.add('open');
  $('#modalBackdrop').setAttribute('aria-hidden','false');
  renderDraft();
}
function closeModal() {
  $('#modalBackdrop').classList.remove('open');
  $('#modalBackdrop').setAttribute('aria-hidden','true');
  state.activePos = null; state.draft = null;
}
function saveDraft() {
  if (!state.activePos || !state.draft) return;
  if (!state.draft.primary) { alert('メインを選択してください。'); return; }
  if (!Array.isArray(state.draft.addonLevels)) state.draft.addonLevels = [0,0,0];
  state.draft.level = normalizeValue(state.draft.primaryLevel, 0);
  state.equips[state.activePos] = JSON.parse(JSON.stringify(state.draft));
  saveState(); renderSlots(); closeModal();
}
function clearActiveSlot() {
  if (!state.activePos) return;
  state.equips[state.activePos] = null;
  saveState(); renderSlots(); closeModal();
}
let confirmAction = null;
function openConfirm(message, yesLabel, action, mode) {
  confirmAction = action;
  $('#confirmMessage').textContent = message;
  $('#confirmYes').textContent = yesLabel || 'はい';
  $('#confirmYes').classList.toggle('reset', mode === 'reset');
  $('#confirmBackdrop').classList.add('open');
  $('#confirmBackdrop').setAttribute('aria-hidden','false');
}
function closeConfirm() {
  $('#confirmBackdrop').classList.remove('open');
  $('#confirmBackdrop').setAttribute('aria-hidden','true');
  confirmAction = null;
}
function resetAllSlots() {

function saveScreenImageNow() {
  if (typeof html2canvas !== 'function') {
    alert('画像保存に失敗しました。');
    return;
  }
  html2canvas(document.body, {
    backgroundColor: "#000000",
    scale: 2,

    x: window.scrollX,
    y: window.scrollY,

    width: window.innerWidth,
    height: window.innerHeight,
    windowWidth: window.innerWidth,
    windowHeight: window.innerHeight,

    ignoreElements: (el) => el.classList.contains("no-capture")
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "鎮魂符.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(() => {
    alert('画像保存に失敗しました。');
  });
}
function downloadCanvas(canvas) {
  const filename = 'chinkonfu-screen.png';
  if (canvas.toBlob) {
    canvas.toBlob(blob => {
      if (!blob) {
        downloadDataUrl(canvas, filename);
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = filename;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  } else {
    downloadDataUrl(canvas, filename);
  }
}
function downloadDataUrl(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function jobColumnClass(job) { return 'job-col-' + String(job).replace(/[^\u3040-\u30ff\u3400-\u9fff\w-]/g, ''); }

  const raw = normalizeEffectText(text || '');
  const custom = {
    '一部技能の沈黙成功率上昇':'一部技能の沈黙<br>成功率上昇',

    '技能の物理威力上昇':'技能の物理<br>威力上昇',
    '一部技能の物理・術耐性上昇':'一部技能の物理・<br>術耐性上昇',
    '一部技能の四象変化量上昇':'一部技能の四象<br>変化量上昇',
    '一部技能の結界強度上昇':'一部技能の結界<br>強度上昇',
    '一部技能の属性付与がLVが2に':'一部技能の属性付与<br>がLVが2に',
    '物理・術威力が確率で上昇':'物理・術威力が<br>確率で上昇',
    '魅力に応じて物理・術威力上昇':'魅力に応じて<br>物理・術威力上昇',
    '属性値に応じて物理・術威力上昇':'属性値に応じて<br>物理・術威力上昇',
    '器用さに応じて物理・術威力上昇':'器用さに応じて<br>物理・術威力上昇',
    '耐久力に応じて物理・術威力上昇':'耐久力に応じて<br>物理・術威力上昇',

  };
  return '<span class="bonus-cell">' + (custom[raw] ? custom[raw].split('<br>').map(escapeHtml).join('<br>') : escapeHtml(raw)) + '</span>';

function renderBonusList() {
  const wrap = $('#bonusTableWrap');
  if (!wrap) return;
  const jobs = CHINKONFU_DATA.jobs;
  let html = '<table class="bonus-table"><thead><tr><th class="level-col">値</th>';
  html += jobs.map(job => `<th class="job-head ${jobColumnClass(job)}">${escapeHtml(job)}</th>`).join('');
  html += '</tr></thead><tbody>';
  for (const r of CHINKONFU_DATA.unlocks) {
    html += `<tr><th class="level-col">+${r.level}</th>`;
    html += jobs.map(job => {
      const raw = r[job] || '';
      return `<td class="${jobColumnClass(job)} ${classifyEffect(raw)}">${displayEffectHtml(raw)}</td>`;
    }).join('');
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

}

<script>
(function(){
  'use strict';
  function fitChinkonfuModal(){
    var modal = document.querySelector('#modalBackdrop .modal');
    var backdrop = document.getElementById('modalBackdrop');
    if (!modal || !backdrop) return;
    modal.classList.add('auto-fit-modal');

    var vw = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 0);
    var vh = Math.max(320, window.innerHeight || document.documentElement.clientHeight || 0);
    var isSmall = vw <= 900;
    var baseW = isSmall ? 900 : 1500;
    var baseH = isSmall ? 720 : 760;
    var margin = isSmall ? 8 : 20;
    var scale = Math.min(1, (vw - margin) / baseW, (vh - margin) / baseH);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    scale = Math.max(scale, isSmall ? 0.36 : 0.68);

    modal.style.setProperty('--modal-fit-width', baseW + 'px');
    modal.style.setProperty('--modal-fit-height', baseH + 'px');
    modal.style.setProperty('--modal-fit-scale', String(scale));

    var needsScroll = scale < 0.999 || (baseH * scale) > (vh - margin) || (baseW * scale) > (vw - margin);
    backdrop.classList.toggle('fit-scroll-needed', !!needsScroll);
  }

  window.addEventListener('resize', fitChinkonfuModal, { passive:true });
  window.addEventListener('orientationchange', function(){ setTimeout(fitChinkonfuModal, 120); }, { passive:true });
  document.addEventListener('click', function(){ setTimeout(fitChinkonfuModal, 0); }, true);
  document.addEventListener('DOMContentLoaded', function(){
    fitChinkonfuModal();
    var backdrop = document.getElementById('modalBackdrop');
    if (backdrop && 'MutationObserver' in window) {
      new MutationObserver(fitChinkonfuModal).observe(backdrop, { attributes:true, attributeFilter:['class'] });
    }
  });
})();
</script>
