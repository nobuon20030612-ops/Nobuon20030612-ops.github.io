* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#050706; color:#eee; font-family:"Yu Mincho","Hiragino Mincho ProN","Yu Gothic",Meiryo,serif; }
body::before {

  background-blend-mode:screen,screen,normal,overlay;
}
body::after {
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;

.side-title { display:none; font-size:32px; color:#e8e8df; letter-spacing:.08em; text-shadow:0 2px 2px #000, 0 0 10px rgba(255,255,255,.14); margin-bottom:10px; }
.menu-item { display:none; font-size:29px; line-height:1.05; margin:5px 0; white-space:nowrap; color:#fffdf0; text-shadow:0 2px 1px #000, 0 0 7px rgba(255,255,255,.22); }

.heading { text-align:center; font-size:clamp(32px, 3.2vh, 42px); color:#fff3b8; letter-spacing:.1em; text-shadow:0 2px 2px #000, 0 0 10px rgba(244,217,135,.55), 0 0 18px rgba(255,255,255,.18); margin-bottom:clamp(5px, 1vh, 12px); }

.silhouette {

.silhouette::before,

.silhouette img { width:100%; height:100%; object-fit:contain; display:block; }
.slot {
  position:absolute; width:clamp(96px, 8.5vw, 124px); height:clamp(96px, 8.5vw, 124px); border:2px solid rgba(40,255,92,.34); background:rgba(0,0,0,.82); color:#f9ffe9; cursor:pointer; overflow:hidden;
  box-shadow:inset 0 0 14px rgba(0,0,0,.8), 0 0 6px rgba(110,255,35,.26); transition:transform .12s, border-color .12s, box-shadow .12s, filter .12s;
}
.slot:hover {
  transform:scale(1.055); border-color:#9cff25;
  box-shadow:0 0 7px #d8ff64, 0 0 18px #89ff22, 0 0 34px #47ff8c, 0 0 54px rgba(86,234,255,.72), inset 0 0 26px rgba(125,255,51,.30);

}

.skill-list-backdrop { display:none; position:fixed; inset:0; z-index:36; background:rgba(0,0,0,.72); align-items:flex-start; justify-content:center; padding:10px; }

.skill-job-mark { align-self:center; justify-self:center; font-size:clamp(34px, 4.2vh, 50px); font-weight:900; line-height:1; color:#d71924; -webkit-text-stroke:1px #fff; text-shadow:0 2px 1px #000, 0 0 8px rgba(255,255,255,.38); }
.skill-card.job-col-侍 { background:linear-gradient(90deg, rgba(255,255,255,.035), rgba(16,16,22,.74)); }
.skill-card.job-col-僧 { background:linear-gradient(90deg, rgba(86,234,255,.055), rgba(16,16,22,.74)); }
.skill-card.job-col-神職 { background:linear-gradient(90deg, rgba(255,241,118,.055), rgba(16,16,22,.74)); }
.skill-card.job-col-陰陽師 { background:linear-gradient(90deg, rgba(216,140,255,.06), rgba(16,16,22,.74)); }
.skill-card.job-col-忍者 { background:linear-gradient(90deg, rgba(102,255,143,.055), rgba(16,16,22,.74)); }

.confirm-backdrop { display:none; position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.66); align-items:center; justify-content:center; padding:18px; }
.confirm-backdrop.open { display:flex; }
.confirm-modal { width:min(520px, 92vw); border:1px solid rgba(133,255,52,.48); background:linear-gradient(135deg, rgba(5,10,9,.98), rgba(23,22,15,.97)); border-radius:12px; box-shadow:0 0 28px rgba(133,255,52,.34), inset 0 0 30px rgba(86,234,255,.08); padding:18px; }
.confirm-title { font-size:clamp(24px, 2.7vh, 34px); color:#f4d987; text-shadow:0 2px #000,0 0 12px rgba(244,217,135,.38); margin-bottom:10px; }
.confirm-message { color:#f4ffe7; font-size:clamp(18px, 2vh, 25px); line-height:1.5; text-shadow:0 2px 2px #000, 0 0 8px rgba(255,255,255,.16); margin-bottom:16px; }
.confirm-actions { display:flex; justify-content:flex-end; gap:12px; }
.confirm-btn { min-width:110px; border:1px solid rgba(133,255,52,.42); border-radius:9px; padding:9px 18px; font-family:"Yu Mincho","Hiragino Mincho ProN",serif; font-size:20px; font-weight:800; color:#fff7d0; cursor:pointer; background:linear-gradient(180deg, rgba(45,82,38,.96), rgba(7,12,7,.96)); text-shadow:0 2px 2px #000, 0 0 8px rgba(244,217,135,.32); box-shadow:0 0 11px rgba(133,255,52,.18), inset 0 0 12px rgba(255,255,255,.04); }

/* 解放表をスクロールなしで見切れないようにするため、モーダル内だけ全体を圧縮 */
.modal { width:min(1180px, 98vw); max-height:98vh; padding:8px; }
.modal-head { padding-bottom:5px; margin-bottom:6px; }
.modal-title { font-size:clamp(24px, 2.55vh, 30px); }
.close { font-size:16px; padding:6px 11px; }
.list-open-btn { font-size:16px; padding:6px 10px; }
.selection-grid { gap:8px; }
.box { padding:7px; }
.box h3 { margin:0 0 4px; font-size:17px; }
.job-grid { gap:5px; }
.job-btn { font-size:clamp(16px, 1.85vh, 21px); padding:clamp(4px, .62vh, 7px) 5px; border-radius:8px; }
.note { font-size:12px; line-height:1.18; margin:6px 0 0; }
.digit-value-picker { margin-top:5px; }
.digit-value-head { margin-bottom:3px; font-size:13px; }
.digit-value-current { min-width:62px; font-size:clamp(22px, 2.35vh, 30px); }
.digit-row { gap:4px; }
.digit-title { font-size:11px; margin-bottom:2px; }
.digit-options { gap:2px; }
.digit-btn { min-width:22px; border-radius:5px; padding:2px 0; font-size:12px; }
.unlock-box { margin-top:6px; flex:1 1 auto; overflow:visible; }
.unlock-box h3 { margin:0 0 4px; font-size:17px; }
.unlock-box #unlockPreview { max-height:none; overflow:visible; padding-right:0; }
.unlock-box #unlockPreview::-webkit-scrollbar { width:0; }
.unlock-table { font-size:12px; line-height:1.08; }
.unlock-table th,.unlock-table td { padding:2px 5px; line-height:1.1; vertical-align:middle; }
.unlock-table th { position:static; }
.actions { margin-top:6px; }
.action { padding:6px 14px; font-size:16px; }

/* 枠内表示：部位ラベル非表示・名称と数値を2段で表示 */
.slot .label { display:none !important; }
.slot .content {
  top:clamp(24px, 2.6vh, 34px);
  bottom:clamp(5px, .8vh, 8px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(2px, .35vh, 5px);
  font-size:inherit;
  line-height:1.02;
}
.slot-line {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.02;
  width:100%;
  min-height:0;
}
.slot-job {
  display:block;
  font-size:clamp(15px, 1.75vh, 22px);
  font-weight:900;
  line-height:1.02;
  max-width:100%;
  white-space:nowrap;
}
.slot-value {
  display:block;
  font-size:clamp(23px, 2.85vh, 36px);
  font-weight:900;
  line-height:1.02;
  white-space:nowrap;
}
.digit-value-head { align-items:baseline; gap:14px; min-height:clamp(34px, 4.2vh, 52px); margin-bottom:8px; }
.digit-value-current { min-width:clamp(108px, 7vw, 148px); font-size:clamp(34px, 4.4vh, 54px); line-height:1; }


/* 解放表の背景ズレ対策：表エリアだけ背景を濃くして文字を読みやすくする */
.unlock-box {
  background:rgba(0,0,0,.68) !important;
  border-color:rgba(133,255,52,.40) !important;
  box-shadow:inset 0 0 14px rgba(0,0,0,.78), 0 0 10px rgba(133,255,52,.12);
}
.unlock-box #unlockPreview {
  background:rgba(0,0,0,.44);
}
.unlock-table {
  background:rgba(0,0,0,.76);
}
.unlock-table th,
.unlock-table td {
  background:rgba(0,0,0,.62);
}
.unlock-table thead th {
  background:rgba(18,26,18,.92);
}
.actions {
  position:relative;
  z-index:2;
}

 .app { width:900px; height:720px; }
 .modal { width:96vw; }
 .grid { grid-template-columns:1fr; }
 .job-grid { grid-template-columns:repeat(2,1fr); }
}

const STORAGE_KEY = 'chinkonfu-equips-v1';
const POSITIONS = ['頭','胴','左','腕','足','右','腰','首'];
const state = { equips: {}, activePos: null, draft: null };
for (const pos of POSITIONS) state.equips[pos] = null;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function normalizeValue(value, fallback=0) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(0, Math.min(200, Math.round(n * 10) / 10));
}
function formatValue(value) {
  const n = normalizeValue(value, 0);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function emptyEquip() { return { primary:'', primaryLevel:0, addons:['','',''], addonLevels:[0,0,0], level:0 }; }
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    for (const pos of POSITIONS) {
      const v = saved[pos];
      if (v && typeof v === 'object') {
        const addons = Array.isArray(v.addons) ? [v.addons[0]||'', v.addons[1]||'', v.addons[2]||''] : ['', '', ''];
        const oldLevel = Number(v.level) || 0;
        const addonLevels = Array.isArray(v.addonLevels) ? [normalizeValue(v.addonLevels[0], 0), normalizeValue(v.addonLevels[1], 0), normalizeValue(v.addonLevels[2], 0)] : [oldLevel, oldLevel, oldLevel];
        state.equips[pos] = { primary:v.primary || '', primaryLevel:normalizeValue(v.primaryLevel, oldLevel), addons:addons, addonLevels:addonLevels, level:oldLevel };
      }
    }
  } catch(e) { console.warn('鎮魂符の保存データ読込に失敗しました', e); }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.equips)); }
function totalLevel() { return POSITIONS.reduce((sum,pos)=>sum + ((state.equips[pos] && Number(state.equips[pos].level)) || 0), 0); }
function classifyEffect(text) {
  if (!text) return '';
  if (text.includes('生命')) return 'effect-life';
  if (text.includes('気合')) return 'effect-ki';
  if (text.includes('腕力')) return 'effect-str';
  if (text.includes('耐久')) return 'effect-dur';
  if (text.includes('器用')) return 'effect-dex';
  if (text.includes('知力')) return 'effect-int';
  if (text.includes('魅力')) return 'effect-cha';
  if (text.includes('四象')) return 'effect-four';
  return '';
}

function normalizeEffectText(text) {
  const s = String(text || '').trim();
  if (!s) return '';
  const skill = s.match(/^技能[：:](.+)$/);
  if (skill) return `技能「${skill[1]}」解放`;
  const stat = s.match(/^(生命力?|気合|腕力|耐久力|器用さ|知力|魅力|四象)(\d+)$/);
  if (stat) {
    const name = stat[1] === '生命' ? '生命力' : stat[1];
    return `${name}+${stat[2]}`;
  }
  return s;
}
function registeredJobs() {
  return registeredJobLevels().map(item => item.job);
}
function registeredJobLevels() {
  const levels = new Map();
  for (const pos of POSITIONS) {
    const eq = state.equips[pos];
    if (!eq || !eq.primary) continue;
    const fallback = Number(eq.level) || 0;
    const primaryLevel = Number(eq.primaryLevel);
    addJobLevel(levels, eq.primary, Number.isFinite(primaryLevel) ? primaryLevel : fallback);
    const addonLevels = Array.isArray(eq.addonLevels) ? eq.addonLevels : [fallback, fallback, fallback];
    (eq.addons || []).forEach((job, idx) => {
      if (!job) return;
      addJobLevel(levels, job, normalizeValue(addonLevels[idx], 0));
    });
  }
  return Array.from(levels, ([job, level]) => ({ job, level: Math.min(level, 200) }));
}
function addJobLevel(levels, job, level) {
  if (!job) return;
  levels.set(job, (levels.get(job) || 0) + normalizeValue(level, 0));
}
function collectActiveEffects(jobLevels) {
  const stats = new Map();
  const skills = [];
  const effects = [];
  const statName = name => name === '生命' ? '生命力' : name;
  for (const item of jobLevels) {
    const job = item.job;
    const level = Number(item.level) || 0;
    for (const r of CHINKONFU_DATA.unlocks) {
      if (level < r.level) continue;
      const raw = String(r[job] || '').trim();
      if (!raw) continue;
      const stat = raw.match(/^(生命力?|気合|腕力|耐久力|器用さ|知力|魅力|四象)(\d+)$/);
      if (stat) {
        const name = statName(stat[1]);
        const current = stats.get(name) || { value:0, raw:name };
        current.value += Number(stat[2]) || 0;
        current.raw = raw;
        stats.set(name, current);
      } else if (Number(r.level) === 100) {
        skills.push({ job, text: normalizeEffectText(raw), raw });
      } else {
        effects.push({ job, text: normalizeEffectText(raw), raw });
      }
    }
  }
  return { stats, skills, effects };
}
function renderSideTotalPanel(jobLevels) {
  const panel = $('#sideTotalEffects');
  if (!panel) return;
  if (!jobLevels.length) {
    panel.innerHTML = '<div class="side-total-title">合計一覧</div><div class="side-total-empty">鎮魂符を登録すると表示します</div>';
    return;
  }
  const active = collectActiveEffects(jobLevels);
  let html = '<div class="side-total-title">合計一覧</div>';
  if (!active.stats.size && !active.skills.length && !active.effects.length) {
    html += '<div class="side-total-empty">+25以上で有効内容を表示します</div>';
    panel.innerHTML = html;
    return;
  }
  if (active.stats.size) {
    html += '<div class="side-total-sub">ステータス</div>';
    for (const [name, item] of active.stats) {
      html += `<div class="side-total-row ${classifyEffect(item.raw)}"><span>${escapeHtml(name)}</span><span class="value">+${item.value}</span></div>`;
    }
  }
  if (active.skills.length) {
    html += '<div class="side-total-sub">技能</div>';
    for (const skill of active.skills) {
      html += `<div class="side-skill-row">${escapeHtml(skill.job)}：${escapeHtml(skill.text)}</div>`;
    }
  }
  if (active.effects.length) {
    html += '<div class="side-total-sub">効果</div>';
    for (const effect of active.effects) {
      html += `<div class="side-effect-row">${escapeHtml(effect.job)}：${escapeHtml(effect.text)}</div>`;
    }
  }
  panel.innerHTML = html;
}
function renderStatusPanel() {
  const summary = $('#statusSummary');
  const details = $('#statusDetails');
  if (!summary || !details) return;
  const slots = POSITIONS.filter(pos => state.equips[pos] && state.equips[pos].primary).length;
  const jobLevels = registeredJobLevels();
  summary.innerHTML = `<b>登録枠：</b>${slots} / 8<br><b>登録：</b>${jobLevels.length ? jobLevels.map(item => `${escapeHtml(item.job)} +${formatValue(item.level)}`).join(' / ') : 'なし'}`;
  renderSideTotalPanel(jobLevels);
  if (!jobLevels.length) {
    details.innerHTML = '<div class="status-empty">鎮魂符を登録すると<br>解放内容を表示します</div>';
    return;
  }
  let html = '';
  for (const item of jobLevels) {
    const job = item.job;
    const level = Number(item.level) || 0;
    html += `<div class="status-job-block"><div class="status-job-name">${escapeHtml(job)}</div>`;
    for (const r of CHINKONFU_DATA.unlocks) {
      const reached = level >= r.level;
      const raw = r[job] || '';
      html += `<div class="status-effect-row ${reached ? 'reached' : 'unreached'}"><div class="need">+${r.level}</div><div class="effect ${classifyEffect(raw)}">${escapeHtml(normalizeEffectText(raw))}</div></div>`;
    }
    html += '</div>';
  }
  details.innerHTML = html;
}
function renderSlots() {
  for (const pos of POSITIONS) {
    const btn = $(`.slot[data-pos="${pos}"]`);
    const content = $('.content', btn);
    const eq = state.equips[pos];
    if (!eq || !eq.primary) {
      btn.classList.add('empty');
      content.textContent = '空欄';
    } else {
      btn.classList.remove('empty');
      const fallback = Number(eq.level) || 0;
      const primaryLevel = normalizeValue(eq.primaryLevel, fallback);
      const addonLevels = Array.isArray(eq.addonLevels) ? eq.addonLevels : [fallback, fallback, fallback];
      const lines = [{ job:eq.primary, value:primaryLevel }];
      (eq.addons || []).forEach((job, idx) => {
        if (job) lines.push({ job, value:normalizeValue(addonLevels[idx], 0) });
      });
      content.innerHTML = lines.map(line => `<strong class="slot-line"><span class="slot-job">${escapeHtml(line.job)}</span><span class="slot-value">＋${formatValue(line.value)}</span></strong>`).join('');
    }
  }
  renderStatusPanel();
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function buildJobButtons(containerId, kind) {
  const wrap = $('#' + containerId);
  wrap.innerHTML = '';
  for (const job of CHINKONFU_DATA.jobs) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'job-btn'; b.textContent = job; b.dataset.job = job; b.dataset.kind = kind;
    b.addEventListener('click', () => selectJob(kind, job));
    wrap.appendChild(b);
  }
}
function buildDigitPickerOptions() {
  $$('.digit-options').forEach(wrap => {
    const place = Number(wrap.dataset.place) || 1;
    const target = wrap.dataset.target || '';
    const maxDigit = 9;
    wrap.innerHTML = '';
    for (let digit = 0; digit <= maxDigit; digit++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'digit-btn';
      b.textContent = String(digit);
      b.dataset.target = target;
      b.dataset.place = String(place);
      b.dataset.digit = String(digit);
      b.addEventListener('click', () => setDraftDigit(target, place, digit));
      wrap.appendChild(b);
    }
  });
}
function getValueDigits(value) {
  const safeValue = Math.max(0, Math.min(99.9, normalizeValue(value, 0)));
  const scaled = Math.round(safeValue * 10);
  return {
    10: Math.floor(scaled / 100),
    1: Math.floor((scaled % 100) / 10),
    0.1: scaled % 10
  };
}
function setDraftDigit(target, place, digit) {
  if (!state.draft) return;
  const digits = getValueDigits(getDraftValue(target));
  digits[place] = Number(digit) || 0;
  let nextValue = digits[10] * 10 + digits[1] + (digits[0.1] / 10);
  setDraftValue(target, nextValue);
}
function syncDigitPicker(target, value) {
  const digits = getValueDigits(value);
  $$('.digit-btn').forEach(btn => {
    if (btn.dataset.target !== target) return;
    const place = Number(btn.dataset.place) || 1;
    const digit = Number(btn.dataset.digit) || 0;
    btn.classList.toggle('selected', digits[place] === digit);
  });
}
function setDraftValue(target, value) {
  if (!state.draft) return;
  const safeValue = normalizeValue(value, 0);
  if (!Array.isArray(state.draft.addonLevels)) state.draft.addonLevels = [0,0,0];
  if (target === 'primary') {
    state.draft.primaryLevel = safeValue;
    state.draft.level = safeValue;
  } else if (target === 'addon1') {
    state.draft.addonLevels[0] = safeValue;
  }
  renderDraft();
}
function getDraftValue(target) {
  if (!state.draft) return 0;
  const fallback = normalizeValue(state.draft.level, 0);
  if (target === 'primary') return normalizeValue(state.draft.primaryLevel, fallback);
  if (!Array.isArray(state.draft.addonLevels)) state.draft.addonLevels = [0,0,0];
  if (target === 'addon1') return normalizeValue(state.draft.addonLevels[0], 0);
  return 0;
}
function buildValueSelects() {
  buildDigitPickerOptions();
}
function selectJob(kind, job) {
  if (!state.draft) return;
  if (kind === 'primary') {
    state.draft.primary = job;
    state.draft.addons = state.draft.addons.map(a => a === job ? '' : a);
  } else if (kind === 'addon1') {
    state.draft.addons[0] = state.draft.addons[0] === job ? '' : job;
    if (state.draft.addons[0] === state.draft.primary) state.draft.addons[0] = '';
  }
  renderDraft();
}
function renderDraft() {
  const d = state.draft || emptyEquip();
  const fallback = normalizeValue(d.level, 0);
  if (!Array.isArray(d.addonLevels)) d.addonLevels = [fallback, fallback, fallback];
  d.primaryLevel = normalizeValue(d.primaryLevel, fallback);
  const addon1Level = normalizeValue(d.addonLevels[0], 0);
  syncDigitPicker('primary', d.primaryLevel);
  syncDigitPicker('addon1', addon1Level);
  const primaryManual = $('#primaryManualValue'); if (primaryManual) primaryManual.textContent = `+${formatValue(d.primaryLevel)}`;
  const addon1Manual = $('#addon1ManualValue'); if (addon1Manual) addon1Manual.textContent = `+${formatValue(addon1Level)}`;
  for (const btn of $$('.job-btn')) {
    const kind = btn.dataset.kind, job = btn.dataset.job;
    btn.disabled = false; btn.classList.remove('selected');
    if (kind === 'primary' && d.primary === job) btn.classList.add('selected');
    if (kind === 'addon1') {
      if (d.primary === job) btn.disabled = true;
      if (d.addons[0] === job) btn.classList.add('selected');
    }
    if (kind === 'addon2' || kind === 'addon3') btn.disabled = true;
  }
  renderUnlockPreview();
}
function draftAdjustedJobLevels() {
  const levels = new Map();
  for (const pos of POSITIONS) {
    const eq = (pos === state.activePos && state.draft) ? state.draft : state.equips[pos];
    if (!eq || !eq.primary) continue;
    const fallback = Number(eq.level) || 0;
    addJobLevel(levels, eq.primary, normalizeValue(eq.primaryLevel, fallback));
    const addonLevels = Array.isArray(eq.addonLevels) ? eq.addonLevels : [fallback, fallback, fallback];
    (eq.addons || []).forEach((job, idx) => {
      if (!job) return;
      addJobLevel(levels, job, normalizeValue(addonLevels[idx], 0));
    });
  }
  return Array.from(levels, ([job, level]) => ({ job, level: Math.min(level, 200) }));
}
function renderUnlockPreview() {
  const d = state.draft || emptyEquip();
  const jobLevels = draftAdjustedJobLevels();
  if (!jobLevels.length && !d.primary) { $('#unlockPreview').innerHTML = '<div class="note">メインを選択すると、+25〜+200で解放される内容を表示します。</div>'; return; }
  if (!jobLevels.length) { $('#unlockPreview').innerHTML = '<div class="note">現在の合計対象はありません。</div>'; return; }
  let html = `<div class="note">現在合計：${jobLevels.map(item => `${escapeHtml(item.job)} +${formatValue(item.level)}`).join(' / ')}</div>`;
  html += '<table class="unlock-table"><thead><tr><th>必要値</th>' + jobLevels.map(item=>`<th>${escapeHtml(item.job)} +${formatValue(item.level)}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of CHINKONFU_DATA.unlocks) {
    html += `<tr><th>+${r.level}</th>` + jobLevels.map(item => {
      const reached = Number(item.level) >= r.level;
      const raw = r[item.job] || '';
      return `<td class="${reached ? 'reached' : 'unreached'} ${classifyEffect(raw)}">${displayEffectHtml(raw)}</td>`;
    }).join('') + '</tr>';
  }
  html += '</tbody></table>';
  $('#unlockPreview').innerHTML = html;
}
function openModal(pos) {
  state.activePos = pos;
  const current = state.equips[pos];
  state.draft = current ? JSON.parse(JSON.stringify(current)) : emptyEquip();
  $('#modalTitle').textContent = `鎮魂符選択：${pos}`;
  $('#modalBackdrop').classList.add('open');
  $('#modalBackdrop').setAttribute('aria-hidden','false');
  renderDraft();
}
function closeModal() {
  $('#modalBackdrop').classList.remove('open');
  $('#modalBackdrop').setAttribute('aria-hidden','true');
  state.activePos = null; state.draft = null;
}
function saveDraft() {
  if (!state.activePos || !state.draft) return;
  if (!state.draft.primary) { alert('メインを選択してください。'); return; }
  if (!Array.isArray(state.draft.addonLevels)) state.draft.addonLevels = [0,0,0];
  state.draft.level = normalizeValue(state.draft.primaryLevel, 0);
  state.equips[state.activePos] = JSON.parse(JSON.stringify(state.draft));
  saveState(); renderSlots(); closeModal();
}
function clearActiveSlot() {
  if (!state.activePos) return;
  state.equips[state.activePos] = null;
  saveState(); renderSlots(); closeModal();
}
let confirmAction = null;
function openConfirm(message, yesLabel, action, mode) {
  confirmAction = action;
  $('#confirmMessage').textContent = message;
  $('#confirmYes').textContent = yesLabel || 'はい';
  $('#confirmYes').classList.toggle('reset', mode === 'reset');
  $('#confirmBackdrop').classList.add('open');
  $('#confirmBackdrop').setAttribute('aria-hidden','false');
}
function closeConfirm() {
  $('#confirmBackdrop').classList.remove('open');
  $('#confirmBackdrop').setAttribute('aria-hidden','true');
  confirmAction = null;
}
function resetAllSlots() {
  openConfirm('登録枠8個と数値をすべて未選択状態に戻します。実行しますか？', 'はい', () => {
    for (const pos of POSITIONS) state.equips[pos] = null;
    saveState();
    renderSlots();
  }, 'reset');
}
function saveScreenImage() {
  openConfirm('現在の画面を画像として保存します。実行しますか？', 'はい', () => saveScreenImageNow(), 'save');
}
function saveScreenImageNow() {
  if (typeof html2canvas !== 'function') {
    alert('画像保存に失敗しました。');
    return;
  }
  html2canvas(document.body, {
    backgroundColor: "#000000",
    scale: 2,

    x: window.scrollX,
    y: window.scrollY,

    width: window.innerWidth,
    height: window.innerHeight,
    windowWidth: window.innerWidth,
    windowHeight: window.innerHeight,

    ignoreElements: (el) => el.classList.contains("no-capture")
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "鎮魂符.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(() => {
    alert('画像保存に失敗しました。');
  });
}
function downloadCanvas(canvas) {
  const filename = 'chinkonfu-screen.png';
  if (canvas.toBlob) {
    canvas.toBlob(blob => {
      if (!blob) {
        downloadDataUrl(canvas, filename);
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = filename;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  } else {
    downloadDataUrl(canvas, filename);
  }
}
function downloadDataUrl(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function captureAppBySvg(app) {
  return new Promise((resolve, reject) => {
    const rect = app.getBoundingClientRect();
    const clone = app.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.minHeight = '0';
    clone.style.margin = '0';
    clone.querySelectorAll('.modal-backdrop,.bonus-list-backdrop,.confirm-backdrop').forEach(el => el.remove());
    let styleText = Array.from(document.styleSheets).map(sheet => {
      try { return Array.from(sheet.cssRules).map(rule => rule.cssText).join('\n'); }
      catch(e) { return ''; }
    }).join('\n');
    styleText = styleText.replace(/url\(["']?data:image\/svg\+xml[^)]*\)/g, 'none');
    const htmlText = `<div xmlns="http://www.w3.org/1999/xhtml"><style>${styleText}</style>${new XMLSerializer().serializeToString(clone)}</div>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(rect.width)}" height="${Math.ceil(rect.height)}"><foreignObject width="100%" height="100%">${htmlText}</foreignObject></svg>`;
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(rect.width);
        canvas.height = Math.ceil(rect.height);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        downloadCanvas(canvas);
        resolve();
      } catch(e) { reject(e); }
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function jobColumnClass(job) { return 'job-col-' + String(job).replace(/[^\u3040-\u30ff\u3400-\u9fff\w-]/g, ''); }

function displayEffectHtml(text) {
  const raw = normalizeEffectText(text || '');
  const custom = {
    '一部技能の沈黙成功率上昇':'一部技能の沈黙<br>成功率上昇',
    '一部技能の気合消費軽減':'一部技能の気合<br>消費軽減',
    '一部技能の術威力上昇':'一部技能の術威力<br>上昇',
    '技能の物理威力上昇':'技能の物理<br>威力上昇',
    '一部技能の物理・術耐性上昇':'一部技能の物理・<br>術耐性上昇',
    '一部技能の四象変化量上昇':'一部技能の四象<br>変化量上昇',
    '一部技能の結界強度上昇':'一部技能の結界<br>強度上昇',
    '一部技能の属性付与がLVが2に':'一部技能の属性付与<br>がLVが2に',
    '物理・術威力が確率で上昇':'物理・術威力が<br>確率で上昇',
    '魅力に応じて物理・術威力上昇':'魅力に応じて<br>物理・術威力上昇',
    '属性値に応じて物理・術威力上昇':'属性値に応じて<br>物理・術威力上昇',
    '器用さに応じて物理・術威力上昇':'器用さに応じて<br>物理・術威力上昇',
    '耐久力に応じて物理・術威力上昇':'耐久力に応じて<br>物理・術威力上昇',
    '場の四象に応じて物理・術威力上昇':'場の四象に応じて<br>物理・術威力上昇'
  };
  return '<span class="bonus-cell">' + (custom[raw] ? custom[raw].split('<br>').map(escapeHtml).join('<br>') : escapeHtml(raw)) + '</span>';
}
function renderBonusList() {
  const wrap = $('#bonusTableWrap');
  if (!wrap) return;
  const jobs = CHINKONFU_DATA.jobs;
  let html = '<table class="bonus-table"><thead><tr><th class="level-col">値</th>';
  html += jobs.map(job => `<th class="job-head ${jobColumnClass(job)}">${escapeHtml(job)}</th>`).join('');
  html += '</tr></thead><tbody>';
  for (const r of CHINKONFU_DATA.unlocks) {
    html += `<tr><th class="level-col">+${r.level}</th>`;
    html += jobs.map(job => {
      const raw = r[job] || '';
      return `<td class="${jobColumnClass(job)} ${classifyEffect(raw)}">${displayEffectHtml(raw)}</td>`;
    }).join('');
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
function openBonusList() {
  renderBonusList();
  $('#bonusListBackdrop').classList.add('open');
  $('#bonusListBackdrop').setAttribute('aria-hidden','false');
}
function closeBonusList() {
  $('#bonusListBackdrop').classList.remove('open');
  $('#bonusListBackdrop').setAttribute('aria-hidden','true');
}


function renderSkillList() {
  const grid = $('#skillListGrid');
  if (!grid) return;
  const order = ['僧','薬師','忍者','陰陽師','傾奇者','侍','鍛冶屋','神職'];
  const ordered = order.map(job => SKILL_LIST_DATA.find(item => item.job === job)).filter(Boolean);
  grid.innerHTML = ordered.map(item => {
    const jobClass = jobColumnClass(item.job);
    return `<div class="skill-card ${jobClass}">
      <div class="skill-job-mark">${escapeHtml(item.job.slice(0,1))}</div>
      <div class="skill-meta">
        <div class="skill-name">${escapeHtml(item.name)}</div>
        <div class="skill-need">必要気合　${escapeHtml(item.need)}</div>
        <div class="skill-need">必要アイテム　なし</div>
        <div class="skill-tag">戦闘専用</div>
      </div>
      <div class="skill-desc">${escapeHtml(item.desc)}</div>
    </div>`;
  }).join('');
}
function openSkillList() {
  renderSkillList();
  $('#skillListBackdrop').classList.add('open');
  $('#skillListBackdrop').setAttribute('aria-hidden','false');
}
function closeSkillList() {
  $('#skillListBackdrop').classList.remove('open');
  $('#skillListBackdrop').setAttribute('aria-hidden','true');
}

function init() {
  buildJobButtons('primaryJobs','primary');
  buildJobButtons('addon1Jobs','addon1');
  buildJobButtons('addon2Jobs','addon2');
  buildJobButtons('addon3Jobs','addon3');
  buildValueSelects(); loadState(); renderSlots();
  $$('.slot').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.pos)));
  $('#closeModal').addEventListener('click', closeModal);
  $('#saveSlot').addEventListener('click', saveDraft);
  $('#clearSlot').addEventListener('click', clearActiveSlot);
  $('#resetAll').addEventListener('click', resetAllSlots);
  $('#saveScreen').addEventListener('click', saveScreenImage);
  $('#openBonusList').addEventListener('click', openBonusList);
  $('#closeBonusList').addEventListener('click', closeBonusList);
  $('#openSkillList').addEventListener('click', openSkillList);
  $('#closeSkillList').addEventListener('click', closeSkillList);
  $('#confirmNo').addEventListener('click', closeConfirm);
  $('#confirmYes').addEventListener('click', () => { const action = confirmAction; closeConfirm(); if (typeof action === 'function') action(); });
  $('#confirmBackdrop').addEventListener('click', e => { if (e.target.id === 'confirmBackdrop') closeConfirm(); });
  $('#bonusListBackdrop').addEventListener('click', e => { if (e.target.id === 'bonusListBackdrop') closeBonusList(); });
  $('#skillListBackdrop').addEventListener('click', e => { if (e.target.id === 'skillListBackdrop') closeSkillList(); });
  $('#modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#confirmBackdrop').classList.contains('open')) closeConfirm();
    else if (e.key === 'Escape' && $('#skillListBackdrop').classList.contains('open')) closeSkillList();
    else if (e.key === 'Escape' && $('#bonusListBackdrop').classList.contains('open')) closeBonusList();
    else if (e.key === 'Escape' && $('#modalBackdrop').classList.contains('open')) closeModal();
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
