<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戦国ネオン抽選</title>
<style>
:root{
  --bg:#050817;--panel:#0c1128;--line:rgba(88,241,255,.36);--gold:#ffd76a;
  --text:#fff7ff;--muted:#d5d8ff;--cyan:#24f7ff;--pink:#ff2f9d;--green:#74ff48;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:radial-gradient(circle at 20% 10%,rgba(255,45,219,.26),transparent 32%),radial-gradient(circle at 85% 5%,rgba(0,243,255,.22),transparent 32%),linear-gradient(135deg,#03050f,#0a1029 55%,#061514);
  overflow:auto;
}
button,input{font:inherit}button{cursor:pointer;border:0;color:#fff;font-weight:900;letter-spacing:.04em}button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.app{width:min(1600px,100%);margin:0 auto;padding:10px;display:grid;grid-template-columns:minmax(360px,560px) minmax(760px,1fr);gap:12px;align-items:start}.leftColumn{min-width:0}.externalTopBack{margin:0 0 10px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 0 32px rgba(0,255,255,.14),inset 0 0 38px rgba(0,0,0,.34);overflow:hidden;backdrop-filter:blur(8px)}
.head{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.13);background:linear-gradient(90deg,rgba(177,25,172,.45),rgba(14,137,177,.36));display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:clamp(17px,1.4vw,22px);font-weight:1000;text-shadow:0 0 18px rgba(255,255,255,.32),0 0 30px rgba(255,47,218,.34);white-space:nowrap}.sub{font-size:clamp(11px,.95vw,14px);color:var(--muted);font-weight:800;margin-top:5px}.count{min-width:68px;text-align:center;border-radius:999px;padding:7px 12px;background:linear-gradient(90deg,#061123,#102b39);color:var(--cyan);font-size:clamp(16px,1.4vw,22px);box-shadow:0 0 26px rgba(36,247,255,.42)}
.inputBody{padding:10px 10px 12px}.topBackWrap{margin:0}.topBackBtn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:14px;background:linear-gradient(135deg,#ffe779,#ff8b18);color:#190b00;text-decoration:none;font-size:clamp(14px,1.1vw,18px);font-weight:1000;box-shadow:0 0 17px rgba(255,215,106,.30)}.probBox{display:inline-flex;align-items:center;gap:12px;min-height:42px;padding:0 18px;border-radius:16px;background:linear-gradient(135deg,rgba(6,9,25,.93),rgba(17,55,70,.88));border:1px solid rgba(36,247,255,.42);box-shadow:0 0 22px rgba(36,247,255,.22),inset 0 0 24px rgba(0,0,0,.22);color:#fff;font-weight:1000;font-size:clamp(15px,1.3vw,22px);text-shadow:0 0 12px rgba(36,247,255,.45);white-space:nowrap}.probBox .probLabel{color:var(--gold)}.probBox .probValue{color:#fff}.probBox .probPercent{color:var(--cyan)}
.rows{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto;padding:3px 6px 3px 0}.row{display:grid;grid-template-columns:50px 1fr 42px;align-items:center;gap:8px;border-radius:16px;min-height:49px;padding:6px 8px;background:linear-gradient(90deg,rgba(255,50,220,.55),rgba(38,0,148,.46));border:1px solid rgba(255,255,255,.20);box-shadow:0 0 20px rgba(255,50,220,.16),inset 0 0 26px rgba(0,0,0,.22)}
.row:nth-child(6n+2){background:linear-gradient(90deg,rgba(24,232,255,.50),rgba(0,55,180,.48))}.row:nth-child(6n+3){background:linear-gradient(90deg,rgba(123,255,70,.46),rgba(3,92,54,.48))}.row:nth-child(6n+4){background:linear-gradient(90deg,rgba(255,194,87,.48),rgba(137,65,17,.50))}.row:nth-child(6n+5){background:linear-gradient(90deg,rgba(255,59,104,.48),rgba(99,7,46,.50))}.row:nth-child(6n+6){background:linear-gradient(90deg,rgba(132,90,255,.48),rgba(21,20,126,.50))}
.no{font-size:clamp(17px,1.55vw,23px);font-weight:1000;color:#fff;text-align:center;text-shadow:0 0 14px rgba(255,255,255,.45)}.nameInput{width:100%;min-width:0;border:0;outline:0;background:rgba(3,5,16,.55);color:#fff;border-radius:13px;padding:6px 10px;font-size:clamp(16px,1.55vw,23px);font-weight:1000;text-shadow:0 0 12px rgba(255,255,255,.28)}.nameInput::placeholder{color:rgba(255,255,255,.48)}.del{height:36px;border-radius:13px;background:linear-gradient(135deg,#ff315e,#94153a);box-shadow:0 0 18px rgba(255,49,94,.28);font-size:17px}.blankRow .del{visibility:hidden}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.btn{min-height:42px;border-radius:16px;background:linear-gradient(135deg,#1bdcff,#274dff);box-shadow:0 0 20px rgba(27,220,255,.22);font-size:clamp(14px,1.05vw,17px)}.btn.alt{background:linear-gradient(135deg,#ff3ddf,#7138ff)}.btn.warn{background:linear-gradient(135deg,#ffe779,#ff8b16);color:#160b00}.btn.safe{background:linear-gradient(135deg,#2ffff0,#89ff40);color:#031215}.btn.danger{background:linear-gradient(135deg,#ff3965,#a70c42)}
.stagePanel{padding:10px;display:grid;grid-template-columns:minmax(410px,1fr) minmax(280px,360px);gap:12px;align-items:stretch}.rouletteArea{min-width:0}.winnerBox{position:relative;z-index:4;margin:0 auto 10px;width:min(610px,100%);min-height:60px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,rgba(6,9,25,.91),rgba(11,31,43,.82));box-shadow:0 0 26px rgba(37,247,255,.16),inset 0 0 32px rgba(0,0,0,.40);display:flex;align-items:center;justify-content:center;overflow:hidden}.winnerLabel{position:absolute;left:17px;top:10px;color:var(--muted);font-weight:900;font-size:13px}.winnerName{display:block;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:clip;font-size:clamp(25px,3.4vw,48px);line-height:1;font-weight:1000;text-align:center;color:#fff;text-shadow:0 0 12px #fff,0 0 28px #ff54ff,0 0 48px #25f7ff}.winnerName.idle{font-size:clamp(16px,1.45vw,21px);color:#c9ccff;text-shadow:none}
.wheelWrap{position:relative;margin:auto;width:min(398px,74vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.01) 62%,rgba(255,215,106,.20) 63%,rgba(0,0,0,.14) 68%,transparent 70%);box-shadow:0 0 38px rgba(255,215,106,.26),0 0 70px rgba(37,247,255,.10)}canvas#wheel{width:92%;height:92%;border-radius:50%;filter:drop-shadow(0 0 20px rgba(255,215,106,.28))}.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:58px;height:70px;background:linear-gradient(135deg,#ff2f63 0%,#ffec5c 26%,#31ffe6 54%,#8d55ff 78%,#ff2fe1 100%);clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 0 10px #fff23f) drop-shadow(0 0 18px #25f7ff) drop-shadow(0 0 24px #ff39c6);z-index:6}.centerButton{position:absolute;z-index:5;width:31%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffe27a,#ff8d27 65%,#58150e);color:#180400;display:grid;place-items:center;text-align:center;font-size:clamp(15px,1.55vw,23px);box-shadow:0 0 34px rgba(255,218,94,.65),inset 0 0 20px rgba(255,255,255,.52);border:4px solid rgba(255,255,255,.75)}
.startBig{display:block;margin:12px auto 5px;width:min(398px,100%);min-height:48px;border-radius:999px;background:linear-gradient(90deg,#ff2f63,#ff2fe1,#23f5ff,#72ff4e);background-size:240% 100%;animation:glow 2.5s linear infinite;font-size:clamp(19px,1.9vw,27px);box-shadow:0 0 28px rgba(255,47,225,.35),0 0 40px rgba(35,245,255,.22);text-shadow:0 0 14px rgba(0,0,0,.8)}@keyframes glow{to{background-position:240% 0}}.hint{text-align:center;color:#d7dbff;font-size:clamp(12px,1vw,15px);font-weight:900;margin:7px 0 3px}
.history{height:100%;min-height:420px;margin-top:0;padding:10px;border-radius:24px;background:rgba(3,6,20,.52);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 0 28px rgba(0,0,0,.24)}.historyTop{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin-bottom:10px}.historyTitle{font-size:clamp(17px,1.35vw,21px);font-weight:1000;color:#fff}.historyBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.historyList{display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 245px);overflow:auto}.histItem{display:grid;grid-template-columns:38px 1fr 56px 56px;gap:7px;align-items:center;padding:7px;border-radius:17px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.13)}.histNo{font-size:14px;font-weight:1000;color:var(--gold);text-align:center}.histName{font-size:clamp(14px,1.1vw,18px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.miniBtn{height:33px;border-radius:12px;font-size:12px}.restore{background:linear-gradient(135deg,#1fffe3,#64ff3c);color:#031215}.deleteHist{background:linear-gradient(135deg,#ff3965,#a70c42);color:#fff}.emptyHistory{color:#c9ccff;font-weight:900;font-size:20px;padding:10px}.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media(max-width:980px){.app{grid-template-columns:1fr;padding:8px}.externalTopBack{margin-bottom:8px}.probBox{font-size:15px;min-height:40px;padding:0 12px}.rows{max-height:38vh}.row{grid-template-columns:54px 1fr 44px;min-height:54px}.stagePanel{grid-template-columns:1fr;padding:10px}.history{min-height:auto}.historyTop{flex-direction:column}.historyList{max-height:28vh}.histItem{grid-template-columns:42px 1fr 62px 62px}.wheelWrap{width:min(390px,86vw)}.startBig{min-height:54px}}
</style>
</head>
<body>
<canvas class="confetti" id="confetti"></canvas>
<main class="app">
  <div class="leftColumn">
    <div class="externalTopBack"><a class="topBackBtn" href="index.html">トップに戻る</a><div class="probBox" id="probBox"><span class="probLabel">当選確率</span><span class="probValue">-／-</span><span class="probPercent">0％</span></div></div>
  <section class="panel">
    <div class="head"><div><div class="title">参加者入力</div><div class="sub"></div></div><div class="count" id="count">0名</div></div>
    <div class="inputBody">
      <div class="rows" id="rows" aria-label="参加者入力"></div>
      <div class="controls">
        <button class="btn" id="sampleBtn">見本入力</button>
        <button class="btn warn" id="shuffleBtn">順番シャッフル</button>
        <button class="btn danger" id="clearBtn">入力クリア</button>
        <button class="btn safe" id="soundBtn">音 ON</button>
        <button class="btn safe" id="confettiBtn">紙吹雪 ON</button>
      </div>
    </div>
  </section>
  </div>
  <section class="panel stagePanel">
    <div class="rouletteArea">
      <div class="winnerBox"><div class="winnerLabel">当選者</div><div class="winnerName idle" id="winnerName">抽選前</div></div>
      <div class="wheelWrap" id="wheelWrap" title="ここを1回クリックで抽選開始">
        <div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="1100" height="1100"></canvas><button class="centerButton" id="centerBtn">開始</button>
      </div>
      <button class="startBig" id="startBtn">抽選スタート</button>
      <div class="hint">ルーレット本体・中央・このボタンのどれでも、1回クリックで始動</div>
    </div>
    <aside class="history" aria-label="当選履歴">
      <div class="historyTop"><div class="historyTitle">当選履歴</div><div class="historyBtns"><button class="btn safe" id="restoreAllBtn">全員戻す</button><button class="btn danger" id="clearHistoryBtn">履歴削除</button></div></div>
      <div class="historyList" id="historyList"></div>
    </aside>
  </section>
</main>
<script>
'use strict';
const sampleNames=['織田信長','豊臣秀吉','徳川家康','武田信玄','上杉謙信','伊達政宗','真田幸村','明智光秀'];
let names=[],winnersHistory=[],spinning=false,rotation=0,soundOn=true,confettiOn=true;
const rows=document.getElementById('rows'),count=document.getElementById('count'),wheel=document.getElementById('wheel'),ctx=wheel.getContext('2d'),winnerName=document.getElementById('winnerName'),historyList=document.getElementById('historyList'),probBox=document.getElementById('probBox');
const colors=['#c019d8','#0aaeee','#65b931','#cc7a2a','#e02662','#6250e8','#00c4a5','#d7aa30'];
function save(){try{localStorage.setItem('neonSengokuNamesV6',JSON.stringify(names));localStorage.setItem('neonSengokuHistoryV6',JSON.stringify(winnersHistory));}catch(e){}}
function load(){try{const savedNamesRaw=localStorage.getItem('neonSengokuNamesV6');const savedHistoryRaw=localStorage.getItem('neonSengokuHistoryV6');winnersHistory=JSON.parse(savedHistoryRaw||'[]')||[];names=savedNamesRaw?JSON.parse(savedNamesRaw)||[]:[];if(!Array.isArray(names))names=[];if(!Array.isArray(winnersHistory))winnersHistory=[];if(names.length===sampleNames.length&&winnersHistory.length===0&&names.every((n,i)=>n===sampleNames[i])){names=[];localStorage.setItem('neonSengokuNamesV6',JSON.stringify([]));}}catch(e){names=[];winnersHistory=[]}}
function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}
function updateProbability(){
  const n=names.length;
  const value=probBox.querySelector('.probValue');
  const percent=probBox.querySelector('.probPercent');
  if(!n){value.textContent='-／-';percent.textContent='0％';return;}
  const raw=100/n;
  const floored=Math.floor(raw);
  value.textContent='1／'+n;
  percent.textContent=(Number.isInteger(raw)?'':'約')+floored+'％';
}
function renderRows(){
  rows.innerHTML='';
  names.forEach((name,i)=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<div class="no">${String(i+1).padStart(2,'0')}</div><input class="nameInput" value="${escapeHtml(name)}" placeholder="名前を入力"><button class="del" title="削除">×</button>`;
    const input=row.querySelector('input');
    input.addEventListener('input',()=>{const v=input.value.trim();if(!v){names.splice(i,1);save();renderAll();setTimeout(()=>rows.querySelector('.blankRow input')?.focus(),0);return;}names[i]=v;save();count.textContent=names.length+'名';drawWheel();});
    row.querySelector('.del').addEventListener('click',()=>{names.splice(i,1);save();renderAll();setTimeout(()=>rows.querySelector('.blankRow input')?.focus(),0)});
    rows.appendChild(row);
  });
  const blank=document.createElement('div');blank.className='row blankRow';
  blank.innerHTML=`<div class="no">${String(names.length+1).padStart(2,'0')}</div><input class="nameInput" value="" placeholder="名前を入力後 Enterで追加"><button class="del" title="未入力行を消去">×</button>`;
  const blankInput=blank.querySelector('input');
  let blankComposing=false;
  let blankCommitted=false;
  const commitBlank=()=>{
    if(blankComposing||blankCommitted)return;
    const v=blankInput.value.trim();
    if(!v)return;
    blankCommitted=true;
    blankInput.value='';
    names.push(v);
    save();
    renderAll();
    setTimeout(()=>rows.querySelector('.blankRow input')?.focus(),0);
  };
  blankInput.addEventListener('compositionstart',()=>{blankComposing=true;});
  blankInput.addEventListener('compositionend',()=>{blankComposing=false;});
  blankInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();commitBlank();}});
  blankInput.addEventListener('change',commitBlank);
  blank.querySelector('.del').addEventListener('click',()=>{blankInput.value='';blankInput.focus();});
  rows.appendChild(blank);
}
function renderHistory(){
  historyList.innerHTML='';
  winnersHistory.forEach((name,i)=>{
    const item=document.createElement('div');item.className='histItem';
    item.innerHTML=`<div class="histNo">${String(i+1).padStart(2,'0')}</div><div class="histName">${escapeHtml(name)}</div><button class="miniBtn restore">戻す</button><button class="miniBtn deleteHist">削除</button>`;
    item.querySelector('.restore').addEventListener('click',()=>{names.push(name);winnersHistory.splice(i,1);save();renderAll()});
    item.querySelector('.deleteHist').addEventListener('click',()=>{if(confirm('この履歴を削除しますか？')){winnersHistory.splice(i,1);save();renderAll()}});
    historyList.appendChild(item);
  });
  if(!winnersHistory.length)historyList.innerHTML='<div class="emptyHistory">まだ履歴はありません</div>';
}
function drawWheel(){const w=wheel.width,h=wheel.height,cx=w/2,cy=h/2,r=w*.46;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);const list=names.length?names:['未入力'];const seg=Math.PI*2/list.length;for(let i=0;i<list.length;i++){const st=i*seg-Math.PI/2,mid=st+seg/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,st,st+seg);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.82)';ctx.lineWidth=7;ctx.stroke();ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-14,st+.012,st+seg-.012);ctx.closePath();ctx.clip();ctx.rotate(mid);ctx.translate(r*.63,0);let labelRot=Math.PI/2;const finalAngle=((rotation+mid+labelRot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(finalAngle>Math.PI/2&&finalAngle<Math.PI*3/2){labelRot+=Math.PI}ctx.rotate(labelRot);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';const label=String(list[i]);const safeArc=Math.max(0,seg*r*.50-12);const safeRadial=Math.max(0,r*.38);const fitByArc=safeArc/Math.max(1,label.length*.92);const fitByRadial=safeRadial*.80;const fs=Math.max(4,Math.min(42,fitByArc,fitByRadial));ctx.font=`900 ${fs}px sans-serif`;ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=Math.max(2,Math.min(7,fs*.18));ctx.fillText(label,0,0,Math.max(2,safeRadial));ctx.restore()}ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle='#ffd76a';ctx.lineWidth=18;ctx.shadowColor='rgba(255,215,106,.8)';ctx.shadowBlur=24;ctx.stroke();ctx.restore()}
function fitWinner(){winnerName.style.fontSize='';requestAnimationFrame(()=>{let size=parseFloat(getComputedStyle(winnerName).fontSize);while(winnerName.scrollWidth>winnerName.clientWidth&&size>22){size-=2;winnerName.style.fontSize=size+'px'}})}
function renderAll(redrawRows=true){count.textContent=names.length+'名';updateProbability();if(redrawRows)renderRows();renderHistory();drawWheel()}
function beep(freq,dur,type='square',gain=.05){if(!soundOn)return;const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}
function tickSound(ms){if(!soundOn)return;const st=performance.now();const id=setInterval(()=>{beep(160+Math.random()*420,.03,'sawtooth',.03);if(performance.now()-st>ms)clearInterval(id)},70)}
function fireConfetti(){if(!confettiOn)return;const cv=document.getElementById('confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const pieces=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-40-Math.random()*cv.height*.25,vx:-3+Math.random()*6,vy:3+Math.random()*7,s:6+Math.random()*12,r:Math.random()*Math.PI*2,c:colors[Math.floor(Math.random()*colors.length)]}));let t=0;function step(){cx.clearRect(0,0,cv.width,cv.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.12;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);cx.restore()});if(++t<185)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height)}step()}
function startSpin(){
  if(spinning||names.length<1)return;spinning=true;document.getElementById('startBtn').textContent='抽選中…';document.getElementById('centerBtn').textContent='抽選中';winnerName.classList.remove('idle');winnerName.textContent='抽選中…';
  const SPIN_MS=3600,FIXED_TURNS=8;tickSound(SPIN_MS);const picked=Math.floor(Math.random()*names.length),seg=Math.PI*2/names.length,targetAngle=-(picked*seg+seg/2),fixedTurns=Math.PI*2*FIXED_TURNS,start=rotation,end=start+fixedTurns+(((targetAngle-start)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)),t0=performance.now();
  function ease(x){return 1-Math.pow(1-x,3)}
  function step(now){const p=Math.min(1,(now-t0)/SPIN_MS);rotation=start+(end-start)*ease(p);drawWheel();if(p<1)requestAnimationFrame(step);else{rotation=targetAngle;drawWheel();const winner=names[picked];names.splice(picked,1);winnersHistory.push(winner);save();spinning=false;document.getElementById('startBtn').textContent='抽選スタート';document.getElementById('centerBtn').textContent='開始';winnerName.textContent=winner;fitWinner();renderAll();beep(760,.12,'triangle',.08);setTimeout(()=>beep(1040,.16,'triangle',.08),130);fireConfetti()}}
  requestAnimationFrame(step)
}
document.getElementById('sampleBtn').onclick=()=>{names=sampleNames.slice();save();winnerName.className='winnerName idle';winnerName.textContent='抽選前';renderAll();setTimeout(()=>rows.querySelector('.blankRow input')?.focus(),0)};
document.getElementById('shuffleBtn').onclick=()=>{for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}save();renderAll()};
document.getElementById('clearBtn').onclick=()=>{if(confirm('参加者を全て消しますか？')){names=[];save();renderAll();setTimeout(()=>rows.querySelector('.blankRow input')?.focus(),0)}};
document.getElementById('soundBtn').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent='音 '+(soundOn?'ON':'OFF')};
document.getElementById('confettiBtn').onclick=e=>{confettiOn=!confettiOn;e.currentTarget.textContent='紙吹雪 '+(confettiOn?'ON':'OFF')};
document.getElementById('restoreAllBtn').onclick=()=>{if(!winnersHistory.length)return;names=names.concat(winnersHistory);winnersHistory=[];save();renderAll()};
document.getElementById('clearHistoryBtn').onclick=()=>{if(!winnersHistory.length)return;if(confirm('当選履歴を全て削除しますか？')){winnersHistory=[];save();renderAll()}};
document.getElementById('startBtn').onclick=startSpin;document.getElementById('centerBtn').onclick=startSpin;document.getElementById('wheelWrap').onclick=e=>{if(!e.target.closest('#startBtn'))startSpin()};
window.addEventListener('beforeunload',e=>{if(names.length||winnersHistory.length){e.preventDefault();e.returnValue='抽選データがあります。ページを閉じますか？'}});
window.history.pushState(null,'',location.href);window.addEventListener('popstate',()=>{alert('戻る操作を止めました。終了する時は保存確認後に閉じてください。');window.history.pushState(null,'',location.href)});
load();renderAll();drawWheel();setTimeout(()=>rows.querySelector('.blankRow input')?.focus(),0);
</script>
</body>
</html>
